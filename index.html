<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="theme-color" content="#0d6b62"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Médine"><meta name="apple-mobile-web-app-status-bar-style" content="default"></head><body><title>Vocabulaire Médine</title>

<style>
:root{
  --bg:#eef2f1; --surface:#ffffff; --fg:#14201e; --muted:#566864; --line:#d5dedb;
  --accent:#0d6b62; --accent-fg:#ffffff; --accent-soft:#dcefeb;
  --good:#1f7a4a; --good-soft:#dff2e6; --bad:#a93a2a; --bad-soft:#f7e1dc; --added:#a5530a;
  --font-ui:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;

}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1614; --surface:#16211f; --fg:#e7efed; --muted:#9bb0ab; --line:#26352f;
    --accent:#4cc3b4; --accent-fg:#052220; --accent-soft:#183a35;
    --good:#62d092; --good-soft:#173a29; --bad:#ff8f7b; --bad-soft:#40201a; --added:#f2a65a;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1614; --surface:#16211f; --fg:#e7efed; --muted:#9bb0ab; --line:#26352f;
  --accent:#4cc3b4; --accent-fg:#052220; --accent-soft:#183a35;
  --good:#62d092; --good-soft:#173a29; --bad:#ff8f7b; --bad-soft:#40201a; --added:#f2a65a;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-ui);font-size:16px;line-height:1.45;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit}
.wrap{max-width:560px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1{font-size:26px;line-height:1.15;margin:0;letter-spacing:-.01em}
h2{font-size:13px;margin:28px 0 10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.sub{color:var(--muted);margin:4px 0 0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.today{margin-top:18px;display:grid;gap:14px}
.big{font-size:44px;font-weight:700;line-height:1;letter-spacing:-.02em}
.big small{font-size:15px;font-weight:500;color:var(--muted);letter-spacing:0;margin-left:6px}
.btn{display:block;width:100%;min-height:50px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600;padding:12px 16px;cursor:pointer;text-align:center}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.good{background:var(--good);color:var(--bg);border-color:var(--good)}
.btn.bad{background:var(--bad-soft);color:var(--bad);border-color:var(--bad)}
.btn[disabled]{opacity:.45;cursor:default}
.btn:focus-visible,.row:focus-visible,.link:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.next{display:grid;gap:4px}
.next b{font-size:18px}
.muted{color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.stat{padding:12px}
.stat .n{font-size:24px;font-weight:700}
.stat .l{font-size:12.5px;color:var(--muted);line-height:1.25}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.list{display:grid;gap:8px}
.row{display:grid;grid-template-columns:34px 1fr auto;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;min-height:56px}
.row .no{font-weight:700;color:var(--muted)}
.row .t{font-weight:600}
.row .s{font-size:13px;color:var(--muted)}
.chip{font-size:12px;font-weight:600;padding:4px 9px;border-radius:99px;background:var(--line);color:var(--muted);white-space:nowrap}
.chip.run{background:var(--accent-soft);color:var(--accent)}
.chip.ok{background:var(--good-soft);color:var(--good)}
.link{background:none;border:0;color:var(--accent);font-weight:600;padding:8px 0;cursor:pointer;min-height:44px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.w{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.w:last-child{border-bottom:0}
.w .f{min-width:0}
.pips{display:flex;gap:4px;margin-top:6px}
.pips i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.pips i.on{background:var(--accent)}
.ar{font-family:var(--font-ar);direction:rtl;unicode-bidi:isolate;line-height:1.5}
.w .ar{font-size:30px;text-align:right}
.ex{padding:10px 0;border-bottom:1px solid var(--line)}
.ex:last-child{border-bottom:0}
.ex .ar{font-size:26px;text-align:right}
.ex .fr{font-size:14px;color:var(--muted);margin-top:2px}
.flash{margin-top:16px;background:var(--surface);border:1px solid var(--line);border-radius:18px;min-height:340px;padding:22px 18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center}
.label{font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600}
.fr-big{font-size:clamp(26px,7.5vw,36px);font-weight:700;line-height:1.2;text-wrap:balance}
.ar-big{font-family:var(--font-ar);direction:rtl;unicode-bidi:isolate;font-size:clamp(52px,16vw,80px);line-height:1.45}
.note{font-size:14px;color:var(--muted)}
.divider{width:60%;height:1px;background:var(--line)}
.speak{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--bg);border-radius:99px;padding:8px 14px;cursor:pointer;font-weight:600;font-size:14px;min-height:40px}
.speak svg{width:18px;height:18px;fill:currentColor}
.btn svg{width:18px;height:18px;fill:currentColor;vertical-align:-3px;margin-right:8px;flex:none}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.hint{margin-top:10px;text-align:center;font-size:13px;color:var(--muted)}
.foot{margin-top:32px;font-size:13px;color:var(--muted)}
.foot .link{font-size:13px;color:var(--bad)}
.sum{display:grid;gap:6px;margin-top:14px}
.sum b{font-size:30px}

.picks{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pick{display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-height:60px;padding:10px 14px;border-radius:12px;border:2px solid var(--line);background:var(--surface);cursor:pointer;text-align:left;font-weight:600}
.pick span{font-size:12.5px;font-weight:500;color:var(--muted)}
.pick.on{border-color:var(--accent);background:var(--accent-soft)}
.pick:focus-visible,.segb:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px}
.segb{min-height:46px;padding:8px 6px;border-radius:12px;border:2px solid var(--line);background:var(--surface);font-weight:600;font-size:14px;cursor:pointer}
.segb.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.miss{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.miss:last-child{border-bottom:0}
.miss .ar{font-size:28px;text-align:right}

.search{width:100%;min-height:50px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--fg);font:inherit;font-size:16px;padding:10px 14px;margin-top:14px}
.search:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-color:var(--accent)}
.lchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.lchips .segb{min-height:42px;padding:6px 12px;flex:0 0 auto}
.lrange{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 0;font-size:14px;color:var(--muted)}.lrange label{display:flex;align-items:center;gap:6px}.lrange .sel{width:auto;margin:0;padding:6px 8px}
.cgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.cgrid .btn{min-height:46px;padding:8px 6px;font-size:14px}
.ex.rd{background:color-mix(in srgb,var(--accent) 14%,transparent);border-radius:10px}
.rdbar{margin-top:14px;position:sticky;top:8px;z-index:5}
.tw{overflow-x:auto;margin:10px 0 0;-webkit-overflow-scrolling:touch}.ctbl{width:100%;border-collapse:collapse;font-size:15px}.ctbl th{text-align:left;font-size:12px;font-weight:600;color:var(--muted);padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}.ctbl td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle;line-height:1.5}.ctbl td.ca{text-align:right;direction:rtl}.clist{margin-top:8px}.crow{padding:10px 0;border-bottom:1px solid var(--line)}.crow:last-child{border-bottom:0}.cra{text-align:right;direction:rtl;line-height:1.9}.crf{font-size:14px;color:var(--muted);margin-top:2px}.ctbl tr:last-child td{border-bottom:0}
.cdoc{padding:16px}.cobj{font-weight:600;line-height:1.55;padding-bottom:10px;border-bottom:1px solid var(--line)}.csec{margin-top:16px}.csec h3{font-size:16px;margin:0 0 6px}.csec p{margin:0;line-height:1.7}.ctip{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--accent-soft,color-mix(in srgb,var(--accent) 12%,transparent));font-size:14px;line-height:1.6}.csec ul{margin:0;padding-left:20px;line-height:1.7}.cerr h3{color:var(--bad)}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;gap:0;background:var(--surface);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) max(6px,env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tb{flex:1;max-width:140px;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:50px;border:0;background:transparent;color:var(--muted);font:inherit;font-size:11px;font-weight:600;cursor:pointer;border-radius:10px}
.tb svg{width:22px;height:22px;fill:currentColor}.tb.on{color:var(--accent)}.tb span{position:relative}.bdg{position:absolute;top:-22px;right:-16px;min-width:16px;height:16px;padding:0 4px;border-radius:99px;background:var(--accent);color:var(--accent-fg);font-style:normal;font-size:10px;line-height:16px;text-align:center}
body.hasnav .wrap{padding-bottom:calc(86px + env(safe-area-inset-bottom,0px))}
button,.row,.pick,.segb,.tb{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
.libgrp{margin:18px 0 8px;font-size:13px;font-weight:600;color:var(--muted)}

.w.x .f>div:first-child{font-style:italic;color:var(--added)}
.w.x .ar{color:var(--added)}
.w .pl{font-size:13px;color:var(--muted);margin-top:2px}
.w .pl .ar{font-size:20px;display:inline;color:var(--muted)}
.legend{font-size:13px;color:var(--muted);margin:12px 0 0}
.legend b{font-style:italic;color:var(--added);font-weight:600}
.sel{margin-top:10px}

.cimg{width:100%;height:auto;display:block;border-radius:10px;border:1px solid var(--line);background:#fff;margin-top:10px;cursor:zoom-in}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .cimg,:root:not([data-theme="light"]) .zoomimg{filter:invert(.9) hue-rotate(180deg)}}
:root[data-theme="dark"] .cimg,:root[data-theme="dark"] .zoomimg{filter:invert(.9) hue-rotate(180deg)}
.zoom{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.88);overflow:auto;-webkit-overflow-scrolling:touch}
.zoomimg{display:block;width:230vw;max-width:1500px;height:auto;margin:56px 0 24px;background:#fff}
.zoomx{position:fixed;top:max(10px,env(safe-area-inset-top,0px));right:max(10px,env(safe-area-inset-right,0px));z-index:51;min-width:48px;min-height:48px;border-radius:99px;border:0;background:var(--surface);color:var(--fg);font-size:22px;font-weight:700;cursor:pointer}
.tapnote{font-size:13px;color:var(--muted);margin:10px 0 0}

.slots{min-height:84px;margin-top:14px;padding:10px;border:2px dashed var(--line);border-radius:14px;display:flex;flex-wrap:wrap;gap:8px;direction:rtl;align-content:flex-start;background:var(--surface)}
.slots .ph{direction:ltr;color:var(--muted);font-size:14px;align-self:center;margin:auto}
.tiles{display:flex;flex-wrap:wrap;gap:8px;direction:rtl;margin-top:14px;justify-content:center}
.tile{font-family:var(--font-ar);font-size:26px;line-height:1.5;min-height:52px;padding:2px 14px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer;direction:rtl}
.tile:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.tile.on{border-color:var(--accent);background:var(--accent-soft)}
.tile.good{border-color:var(--good);background:var(--good-soft)}
.tile.bad{border-color:var(--bad);background:var(--bad-soft)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.opts .tile{font-size:28px;min-height:64px;justify-content:center}
.clz{font-family:var(--font-ar);direction:rtl;unicode-bidi:isolate;font-size:clamp(30px,8.5vw,40px);line-height:1.8;text-align:right}
.blank{display:inline-block;min-width:3.2em;border-bottom:3px solid var(--accent);color:transparent;user-select:none}
.fill{color:var(--good);font-weight:700}
.fill.bad{color:var(--bad)}
.verdict{margin-top:14px;display:grid;gap:8px}
.tile.fr{font-family:var(--font-ui);font-size:17px;direction:ltr;line-height:1.3;padding:10px 14px;text-align:left}
.opts.one{grid-template-columns:1fr}
.tile[disabled]{cursor:default}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-top:12px;align-items:end}
.wkc{display:grid;justify-items:center;gap:4px;font-size:12px;color:var(--muted)}
.wkb{height:70px;width:100%;display:flex;align-items:flex-end;background:var(--line);border-radius:8px;overflow:hidden}
.wkb i{display:block;width:100%;background:var(--accent)}
.wkc em{font-style:normal;font-weight:600;color:var(--fg)}
.ctx{border-top:1px solid var(--line);padding-top:12px;width:100%;display:grid;gap:4px;justify-items:center}
.actions.three{grid-template-columns:1fr 1fr 1fr}
.actions.three .btn{padding-inline:6px}
details.dt{margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
details.dt>summary{padding:14px 16px;font-weight:600;cursor:pointer;min-height:48px;list-style:none;display:flex;justify-content:space-between;align-items:center}
details.dt>summary::-webkit-details-marker{display:none}
details.dt>summary::after{content:'+';font-size:20px;color:var(--muted)}
details.dt[open]>summary::after{content:'−'}
details.dt>.in{padding:0 14px 14px}
textarea.search{font-family:ui-monospace,Menlo,monospace;resize:vertical}
.pad{display:block;width:100%;max-width:360px;aspect-ratio:600/260;border:2px dashed var(--line);border-radius:12px;background:var(--bg);touch-action:none}
.pad.ro{border-style:solid;opacity:.9}
.tk{background:none;border:0;border-bottom:2px dotted var(--line);padding:0 3px;margin:0 1px;font-family:var(--font-ar);font-size:28px;line-height:1.7;color:inherit;cursor:pointer;direction:rtl}
.tk.on{border-bottom-color:var(--accent);background:var(--accent-soft)}
.gl{min-height:22px;margin-top:4px;font-size:15px;color:var(--muted)}
.gl b{color:var(--fg)}
.bdg{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.bdg span{font-size:13px;font-weight:600;padding:6px 11px;border-radius:99px;background:var(--line);color:var(--muted)}
.bdg span.on{background:var(--good-soft);color:var(--good)}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .3s ease}}
</style>

« un / une ».","[[مَا]] (choses), [[مَنْ]] (personnes), [[أَ]] (oui / non)."]},"2":{"obj":"Distinguer ce qui est proche ([[هَذَا]]) de ce qui est loin ([[ذَلِكَ]]).","secs":[{"h":"Proche ou éloigné","p":"[[هَذَا]] désigne ce qui est près de toi (« ceci »), [[ذَلِكَ]] ce qui est loin (« cela »). On les oppose souvent dans une même phrase : [[هَذَا … وَذَلِكَ …]]. Le mot [[وَ]] (« et ») se colle au mot suivant : [[وَذَلِكَ]].","tbl":{"h":["Arabe","Français"],"r":[["[[مَا ذَلِكَ ؟ ذَلِكَ نَجْمٌ .]]","Qu'est-ce que c'est (là-bas) ? C'est une étoile."],["[[مَنْ ذَلِكَ ؟]]","Qui est-ce (là-bas) ?"],["[[هَذَا مَسْجِدٌ وَذَلِكَ بَيْتٌ .]]","Ceci est une mosquée et cela est une maison."],["[[أَذَلِكَ كَلْبٌ ؟ لَا ، ذَلِكَ قِطٌّ .]]","Est-ce un chien (là-bas) ? Non, c'est un chat."],["[[هَذَا سُكَّرٌ وَذَلِكَ لَبَنٌ .]]","Ceci est du sucre et cela est du lait."]]},"tip":"[[ذَلِكَ]] se prononce « dhâlika » : le long « â » n'est pas écrit avec un alif, mais il se lit."}],"err":["Lire [[ذَلِكَ]] avec un « a » court : il faut allonger la première voyelle.","Oublier de coller [[وَ]] devant [[ذَلِكَ]]."],"rec":["[[هَذَا]] = proche, [[ذَلِكَ]] = éloigné.","Les deux se construisent exactement comme [[هَذَا]] : pas de verbe."]},"3":{"obj":"Passer de « un… » à « le… » avec [[الْ]], former une phrase sans verbe, et savoir prononcer le lām de [[الْ]].","secs":[{"h":"De l'indéfini au défini","p":"Pour dire « le / la / les », on ajoute [[الْ]] devant le mot **et** on remplace le tanwin par la voyelle simple correspondante : [[ـٌ]] devient [[ـُ]].","tbl":{"h":["Indéfini → défini","Français"],"r":[["[[بَيْتٌ ← الْبَيْتُ]]","une maison → la maison"],["[[كِتَابٌ ← الْكِتَابُ]]","un livre → le livre"],["[[قَلَمٌ ← الْقَلَمُ]]","un stylo → le stylo"],["[[رَجُلٌ ← الرَّجُلُ]]","un homme → l'homme"]]},"tip":"Un mot avec [[الْ]] n'a jamais de tanwin."},{"h":"La phrase nominale","p":"Sujet défini + attribut indéfini, sans verbe : [[الْقَلَمُ مَكْسُورٌ]] = « le stylo est cassé ». Le premier mot est défini ([[الْ]]), le second ne l'est pas (tanwin).","tbl":{"h":["Arabe","Français"],"r":[["[[الْقَلَمُ مَكْسُورٌ .]]","Le stylo est cassé."],["[[الْبَابُ مَفْتُوحٌ .]]","La porte est ouverte."],["[[الْوَلَدُ جَالِسٌ ، وَالْمُدَرِّسُ وَاقِفٌ .]]","Le garçon est assis et l'enseignant est debout."]]},"tip":"Défini + indéfini = phrase complète (« le stylo est cassé »). Défini + défini serait un simple groupe (« le stylo cassé »), tu le verras à la leçon 9."},{"h":"Lettres lunaires : le lām se prononce","p":"Devant 14 lettres, le [[ل]] de [[الْ]] se prononce normalement (avec un soukoun). On les appelle **lunaires**, comme dans [[الْقَمَرُ]] (« al-qamar »).","tbl":{"h":["Exemple","Français"],"r":[["[[الْأَبُ]]","le père"],["[[الْبَابُ]]","la porte"],["[[الْجَنَّةُ]]","le paradis"],["[[الْحِمَارُ]]","l'âne"],["[[الْخُبْزُ]]","le pain"],["[[الْعَيْنُ]]","l'œil"],["[[الْغَدَاءُ]]","le déjeuner"],["[[الْفَمُ]]","la bouche"],["[[الْقَمَرُ]]","la lune"],["[[الْكَلْبُ]]","le chien"],["[[الْمَاءُ]]","l'eau"],["[[الْوَلَدُ]]","le garçon"],["[[الْهَوَاءُ]]","l'air"],["[[الْيَدُ]]","la main"]]}},{"h":"Lettres solaires : le lām disparaît","p":"Devant les 14 autres lettres, le [[ل]] ne se prononce pas : il s'assimile à la lettre suivante, qui est doublée (shadda). On écrit [[الشَّمْسُ]] mais on dit « ash-shams ». Ces lettres sont articulées avec la langue contre les dents ou le palais, comme le [[ل]] lui-même.","tbl":{"h":["Exemple","Français"],"r":[["[[التَّاجِرُ]]","le commerçant"],["[[الثَّوْبُ]]","le vêtement"],["[[الدِّيكُ]]","le coq"],["[[الذَّهَبُ]]","l'or"],["[[الرَّجُلُ]]","l'homme"],["[[الزَّهْرَةُ]]","la fleur"],["[[السَّمَكُ]]","le poisson"],["[[الشَّمْسُ]]","le soleil"],["[[الصَّدْرُ]]","la poitrine"],["[[الضَّيْفُ]]","l'invité"],["[[الطَّالِبُ]]","l'étudiant"],["[[الظَّهْرُ]]","le dos"],["[[اللَّحْمُ]]","la viande"],["[[النَّجْمُ]]","l'étoile"]]},"tip":"Repère visuel : devant une lettre solaire, tu verras une shadda sur la lettre et pas de soukoun sur le [[ل]]."}],"err":["Garder le tanwin avec [[الْ]] : on écrit [[الْبَيْتُ]], jamais [[الْبَيْتٌ]].","Prononcer « al-shams » : on dit « ash-shams ».","Penser qu'une phrase nominale a besoin de [[هُوَ]] ou d'un verbe."],"rec":["[[الْ]] = le / la / les, et plus de tanwin.","Lunaire : « al- » ; solaire : le lām s'assimile.","Défini + indéfini = phrase."]},"4":{"obj":"Dire où se trouve quelque chose ou quelqu'un, d'où l'on vient et où l'on va, avec quatre prépositions.","secs":[{"h":"Quatre prépositions","tbl":{"h":["Arabe","Français"],"r":[["[[فِي]]","dans"],["[[عَلَى]]","sur"],["[[مِنْ]]","de (origine)"],["[[إِلَى]]","vers, à"]]}},{"h":"Le nom qui suit prend la kasra (génitif)","p":"Après une préposition, le nom est au **génitif** : sa dernière voyelle devient une kasra ([[ـِ]]). Avec l'article, [[الْبَيْتُ]] devient [[فِي الْبَيْتِ]].","tbl":{"h":["Arabe","Français"],"r":[["[[الْبَيْتُ : فِي الْبَيْتِ]]","la maison : dans la maison"],["[[السَّرِيرُ : عَلَى السَّرِيرِ]]","le lit : sur le lit"],["[[ذَهَبَ إِلَى الْمُدِيرِ .]]","Il est allé chez le directeur."],["[[خَرَجَ مِنَ الْفَصْلِ .]]","Il est sorti de la classe."]]},"tip":"Devant [[الْ]], [[مِنْ]] devient [[مِنَ]] (fatha) : on dit « minal-fasl »."},{"h":"Où ? D'où ? Il, elle, je, tu","p":"[[أَيْنَ]] demande le lieu, [[مِنْ أَيْنَ]] l'origine. On répond avec un pronom : [[هُوَ]] (il), [[هِيَ]] (elle), [[أَنَا]] (je), [[أَنْتَ]] (tu, masculin).","tbl":{"h":["Arabe","Français"],"r":[["[[أَيْنَ مُحَمَّدٌ ؟ هُوَ فِي الْغُرْفَةِ .]]","Où est Muhammad ? Il est dans la chambre."],["[[أَيْنَ الْكِتَابُ ؟ هُوَ عَلَى الْمَكْتَبِ .]]","Où est le livre ? Il est sur le bureau."],["[[أَيْنَ آمِنَةُ ؟ هِيَ فِي الْمَطْبَخِ .]]","Où est Amina ? Elle est dans la cuisine."],["[[مِنْ أَيْنَ أَنْتَ ؟ أَنَا مِنَ الْيَابَانِ .]]","D'où es-tu ? Je viens du Japon."]]}},{"h":"Prénoms de la leçon","tbl":{"h":["Masculins","Féminins"],"r":[["[[مُحَمَّدٌ ، خَالِدٌ ، حَامِدٌ ، يَاسِرٌ]]","[[آمِنَةُ ، زَيْنَبُ ، فَاطِمَةُ ، مَرْيَمُ]]"],["[[عَمَّارٌ ، سَعِيدٌ ، عَلِيٌّ ، عَبَّاسٌ]]","[[عَائِشَةُ ، خَدِيجَةُ ، صَفِيَّةُ ، رُقَيَّةُ]]"]]}}],"err":["Garder la damma après une préposition : [[فِي الْبَيْتُ]] est faux, on dit [[فِي الْبَيْتِ]].","Confondre [[هُوَ]] (il) et [[هِيَ]] (elle).","Oublier que [[أَيْنَ]] se place en tête de phrase."],"rec":["[[فِي]], [[عَلَى]], [[مِنْ]], [[إِلَى]] + nom à la kasra.","[[أَيْنَ]] = où ? ; [[مِنْ أَيْنَ]] = d'où ?","[[هُوَ]] il, [[هِيَ]] elle, [[أَنَا]] je, [[أَنْتَ]] tu."]},"5":{"obj":"Relier deux noms (le livre de Muhammad), appeler quelqu'un avec [[يَا]] et parler du fils avec [[ابْنُ]].","secs":[{"h":"L'annexion (الْإِضَافَةُ)","p":"Pour dire « le livre de Muhammad », on place les deux noms l'un derrière l'autre, dans le même ordre qu'en français. Le **premier** perd son article et son tanwin ; le **second** est au génitif (kasra).","tbl":{"h":["Arabe","Français"],"r":[["[[كِتَابُ مُحَمَّدٍ]]","le livre de Muhammad"],["[[مَكْتَبُ الْمُدَرِّسِ]]","le bureau de l'enseignant"],["[[سَيَّارَةُ الْمُدِيرِ]]","la voiture du directeur"],["[[مِفْتَاحُ الْبَيْتِ]]","la clé de la maison"],["[[كِتَابُ اللَّهِ]]","le livre d'Allah (le Coran)"],["[[بَيْتُ اللَّهِ]]","la maison d'Allah (la Kaaba)"]]},"tip":"Le premier terme n'a jamais de [[الْ]] : il est déjà défini par le second."},{"h":"Le fils : ابْنٌ","p":"[[ابْنٌ]] commence par un alif qui ne se prononce que si le mot est au début de la phrase. Précédé d'un autre mot, il disparaît à l'oral (hamzat al-waṣl).","tbl":{"h":["Arabe","Français"],"r":[["[[ابْنُ مُحَمَّدٍ]]","le fils de Muhammad"]]}},{"h":"Appeler quelqu'un : يَا","p":"On appelle quelqu'un avec [[يَا]] suivi du nom, qui prend la damma sans tanwin.","tbl":{"h":["Arabe","Français"],"r":[["[[يَا مُحَمَّدُ ، يَا أُسْتَاذُ]]","ô Muhammad, ô professeur"]]}},{"h":"Petits mots de la leçon","tbl":{"h":["Arabe","Français"],"r":[["[[يَا]]","ô (vocatif)"],["[[تَحْتَ]]","sous"],["[[هُنَاكَ]]","là-bas"],["[[اِسْمٌ]]","nom"]]}}],"err":["Mettre [[الْ]] sur le premier terme : [[الْكِتَابُ مُحَمَّدٍ]] est faux.","Garder le tanwin sur le premier terme.","Oublier la kasra sur le second terme."],"rec":["Annexion : 1er terme sans [[الْ]] ni tanwin, 2e terme au génitif.","[[يَا]] + nom (damma, sans tanwin).","[[ابْنُ]] perd son alif à l'oral derrière un autre mot."]},"6":{"obj":"Montrer quelque chose de féminin avec [[هَذِهِ]], dire à qui c'est avec [[لِ]] et utiliser [[أَيْضًا]] et [[جِدًّا]].","secs":[{"h":"هَذِهِ : « ceci » au féminin","p":"Pour un nom féminin, on utilise [[هَذِهِ]] à la place de [[هَذَا]]. La phrase reste sans verbe. Beaucoup de noms féminins se terminent par [[ـَةٌ]] (tā' marbūṭa) ; quelques-uns n'en ont pas ([[عَيْنٌ]] œil, [[يَدٌ]] main).","tbl":{"h":["Arabe","Français"],"r":[["[[هَذِهِ آمِنَةُ .]]","Ceci est Amina."],["[[مَنْ هَذِهِ ؟ هَذِهِ أُخْتُ الْمُهَنْدِسِ .]]","Qui est-ce ? C'est la sœur de l'ingénieur."],["[[هَذِهِ بَقَرَةُ الْفَلَّاحِ .]]","Ceci est la vache de l'agriculteur."],["[[هَذَا أَنْفٌ وَهَذَا فَمٌ .]]","Ceci est un nez et ceci est une bouche."]]},"tip":"Masculin → [[هَذَا]], féminin → [[هَذِهِ]]. [[أَنْفٌ]] et [[فَمٌ]] sont masculins : on dit [[هَذَا]]."},{"h":"Du masculin au féminin","p":"On forme souvent le féminin en ajoutant [[ـَةٌ]] au masculin.","tbl":{"h":["Masculin","Féminin"],"r":[["[[طَالِبٌ]] étudiant","[[طَالِبَةٌ]] étudiante"],["[[مُهَنْدِسٌ]] ingénieur","[[مُهَنْدِسَةٌ]] ingénieure"],["[[طَبِيبٌ]] médecin","[[طَبِيبَةٌ]] femme médecin"]]}},{"h":"لِ : à, pour (appartenance)","p":"La petite particule [[لِ]] se colle au nom et indique à qui appartient une chose. Le nom qui suit est au génitif.","tbl":{"h":["Arabe","Français"],"r":[["[[لِمَنْ هَذِهِ ؟ هَذِهِ لِخَالِدٍ .]]","À qui est ceci ? C'est à Khalid."],["[[هَذِهِ سَاعَةُ عَلِيٍّ . هِيَ جَمِيلَةٌ جِدًّا .]]","Ceci est la montre d'Ali. Elle est très belle."],["[[أَهِيَ أَيْضًا مُهَنْدِسَةٌ ؟ لَا ، هِيَ طَبِيبَةٌ .]]","Est-elle aussi ingénieure ? Non, elle est médecin."]]}},{"h":"Petits mots","tbl":{"h":["Arabe","Français"],"r":[["[[هَذِهِ]]","ceci (féminin)"],["[[لِ]]","à, pour"],["[[لِمَنْ]]","à qui ?"],["[[أَيْضًا]]","aussi"],["[[جِدًّا]]","très"]]}}],"err":["Dire [[هَذَا]] devant un nom féminin.","Détacher [[لِ]] du nom : il se colle ([[لِخَالِدٍ]]).","Oublier la kasra et le tanwin sur le nom après [[لِ]]."],"rec":["[[هَذِهِ]] + nom féminin.","[[لِ]] + nom = « à / pour » (génitif).","[[أَيْضًا]] aussi, [[جِدًّا]] très."]},"7":{"obj":"Compléter le tableau des quatre démonstratifs avec [[تِلْكَ]] (cela, féminin éloigné).","secs":[{"h":"Le tableau des démonstratifs","p":"Deux critères : le **genre** du nom (masculin / féminin) et la **distance** (proche / éloigné).","tbl":{"h":["","Masculin","Féminin"],"r":[["Proche (ceci)","[[هَذَا مُحَمَّدٌ]]","[[هَذِهِ آمِنَةُ]]"],["Éloigné (cela)","[[ذَلِكَ حَامِدٌ]]","[[تِلْكَ زَيْنَبُ]]"]]},"tip":"Pour choisir : 1) masculin ou féminin ? 2) près ou loin ? Les quatre mots : [[هَذَا]], [[هَذِهِ]], [[ذَلِكَ]], [[تِلْكَ]]."},{"h":"Exemples","tbl":{"h":["Arabe","Français"],"r":[["[[وَمَنْ تِلْكَ ؟ تِلْكَ فَاطِمَةُ .]]","Et qui est-ce (là-bas) ? C'est Fatima."],["[[هَذِهِ طَبِيبَةٌ وَتِلْكَ مُمَرِّضَةٌ .]]","Celle-ci est médecin et celle-là est infirmière."],["[[أَتِلْكَ دَجَاجَةٌ ؟ لَا ، تِلْكَ بَطَّةٌ .]]","Est-ce une poule ? Non, c'est un canard."],["[[مَا تِلْكَ ؟ تِلْكَ بَيْضَةٌ .]]","Qu'est-ce que c'est (là-bas) ? C'est un œuf."],["[[هَذِهِ سَيَّارَةُ الْمُدَرِّسِ وَتِلْكَ سَيَّارَةُ الْمُدِيرِ .]]","Ceci est la voiture de l'enseignant et cela est la voiture du directeur."]]}}],"err":["Dire [[ذَلِكَ]] devant un nom féminin éloigné : on dit [[تِلْكَ]].","Confondre [[هَذِهِ]] et [[تِلْكَ]] : l'un est proche, l'autre loin."],"rec":["Proche : [[هَذَا]] / [[هَذِهِ]]. Éloigné : [[ذَلِكَ]] / [[تِلْكَ]]."]},"8":{"obj":"Utiliser [[لِ]] avec l'article, dire devant / derrière, et parler des pays et des villes.","secs":[{"h":"لِ + الْ = لِلْ","p":"Quand [[لِ]] rencontre [[الْ]], l'alif de [[الْ]] disparaît : [[لِ]] + [[الْمُدَرِّسِ]] = [[لِلْمُدَرِّسِ]]. Devant une lettre solaire, le lām de [[الْ]] s'assimile : [[لِ]] + [[التَّاجِرِ]] = [[لِلتَّاجِرِ]].","tbl":{"h":["Arabe","Français"],"r":[["[[هَذَا الْبَيْتُ لِلتَّاجِرِ .]]","Cette maison est au commerçant."],["[[هَذَا الْبَيْتُ لِلتَّاجِرِ وَذَلِكَ الْبَيْتُ لِلطَّبِيبِ .]]","Cette maison est au commerçant et celle-là au médecin."],["[[لِمَنْ هَذِهِ السَّيَّارَةُ ؟]]","À qui est cette voiture ?"]]}},{"h":"Devant et derrière","p":"[[أَمَامَ]] (devant) et [[خَلْفَ]] (derrière) sont suivis du génitif, comme les prépositions.","tbl":{"h":["Arabe","Français"],"r":[["[[بَيْتُ التَّاجِرِ أَمَامَ الْمَسْجِدِ .]]","La maison du commerçant est devant la mosquée."],["[[بَيْتُ الطَّبِيبِ خَلْفَ الْمَدْرَسَةِ .]]","La maison du médecin est derrière l'école."]]}},{"h":"Pays et villes","p":"Avec les pays et les villes, on réutilise [[فِي]], [[مِنْ]] et [[إِلَى]]. Beaucoup de noms de pays se disent sans [[الْ]] : [[مِنْ أَمْرِيكَا]].","tbl":{"h":["Arabe","Français"],"r":[["[[هَذِهِ السَّيَّارَةُ مِنَ الْيَابَانِ وَتِلْكَ مِنْ أَمْرِيكَا .]]","Cette voiture vient du Japon et celle-là d'Amérique."],["[[الْبَيْتُ : فِي الْبَيْتِ ، مِنَ الْبَيْتِ ، إِلَى الْبَيْتِ]]","la maison : dans / de / vers la maison"]]}}],"err":["Écrire [[لِ الْمُدَرِّسِ]] : on écrit [[لِلْمُدَرِّسِ]].","Oublier la kasra après [[أَمَامَ]] et [[خَلْفَ]]."],"rec":["[[لِ]] + [[الْ]] = [[لِلْ]].","[[أَمَامَ]] devant, [[خَلْفَ]] derrière + génitif.","Pays : [[فِي]] / [[مِنْ]] / [[إِلَى]]."]},"9":{"obj":"Dire qui tu es, décrire avec des adjectifs et construire une relative avec [[الَّذِي]].","secs":[{"h":"Les pronoms","tbl":{"h":["Arabe","Français"],"r":[["[[أَنَا]]","je"],["[[أَنْتَ]]","tu (masculin)"],["[[هُوَ]]","il"],["[[هِيَ]]","elle"]]}},{"h":"L'adjectif (النَّعْتُ)","p":"L'adjectif se place **après** le nom et s'accorde avec lui en genre, en défini / indéfini et en voyelle finale.","tbl":{"h":["Arabe","Français"],"r":[["[[مُدِيرٌ جَدِيدٌ]]","un nouveau directeur"],["[[الْمُدِيرُ الْجَدِيدُ]]","le nouveau directeur"],["[[سَيَّارَةٌ جَمِيلَةٌ]]","une belle voiture"],["[[الْعَرَبِيَّةُ لُغَةٌ سَهْلَةٌ .]]","L'arabe est une langue facile."]]},"tip":"Piège classique : [[الْمُدِيرُ جَدِيدٌ]] (défini + indéfini) est une phrase : « le directeur est nouveau ». [[الْمُدِيرُ الْجَدِيدُ]] (défini + défini) est un groupe : « le nouveau directeur »."},{"h":"الَّذِي : « qui » (relative)","p":"[[الَّذِي]] relie un nom défini à une description : [[الرَّجُلُ الطَّوِيلُ الَّذِي خَرَجَ]] = « l'homme grand qui est sorti ».","tbl":{"h":["Arabe","Français"],"r":[["[[مَنْ أَنْتَ ؟ أَنَا طَالِبٌ .]]","Qui es-tu ? Je suis étudiant."],["[[أَأَنْتَ طَالِبٌ جَدِيدٌ ؟ نَعَمْ .]]","Es-tu un nouvel étudiant ? Oui."],["[[عَبَّاسٌ تَاجِرٌ غَنِيٌّ .]]","Abbas est un commerçant riche."],["[[لِمَاذَا الْمُدَرِّسُ غَضْبَانُ الْيَوْمَ ؟]]","Pourquoi l'enseignant est-il en colère aujourd'hui ?"]]}}],"err":["Accorder mal : adjectif masculin avec un nom féminin.","Mettre [[الْ]] sur le nom mais pas sur l'adjectif (ou l'inverse) quand on veut un groupe.","Oublier [[الَّذِي]] pour relier deux informations."],"rec":["Adjectif après le nom, même genre et même défini.","Défini + indéfini = phrase ; défini + défini = groupe.","[[الَّذِي]] = qui (masculin)."]},"10":{"obj":"Dire « mon, ton, son » avec les suffixes, et dire « avoir » avec [[عِنْدَ]] et [[لِ]].","secs":[{"h":"Les suffixes possessifs","p":"Au lieu de petits mots séparés, on colle une terminaison au nom : [[ـِي]] (mon), [[ـُكَ]] (ton, masculin), [[ـُهُ]] (son, à lui), [[ـُهَا]] (son, à elle). Le tanwin disparaît.","tbl":{"h":["Nom","mon","ton (m.)","son (à lui)","son (à elle)"],"r":[["[[بَيْتٌ]]","[[بَيْتِي]]","[[بَيْتُكَ]]","[[بَيْتُهُ]]","[[بَيْتُهَا]]"],["[[أَبٌ]]","[[أَبِي]]","[[أَبُوكَ]]","[[أَبُوهُ]]","[[أَبُوهَا]]"],["[[أَخٌ]]","[[أَخِي]]","[[أَخُوكَ]]","[[أَخُوهُ]]","[[أَخُوهَا]]"]]},"tip":"[[أَبٌ]] et [[أَخٌ]] ajoutent un [[و]] devant le suffixe : [[أَبُوكَ]], [[أَخُوهُ]]."},{"h":"Avoir : عِنْدَ et لِ","p":"Il n'y a pas de verbe « avoir ». On dit « chez moi » : [[عِنْدِي]]. Avec la famille, on préfère [[لِي]] (« à moi »). La négation est [[مَا]].","tbl":{"h":["Arabe","Français"],"r":[["[[عِنْدِي دَرَّاجَةٌ .]]","J'ai un vélo."],["[[أَلَكَ أَخٌ ؟ نَعَمْ ، لِي أَخٌ وَاحِدٌ .]]","As-tu un frère ? Oui, j'ai un seul frère."],["[[أَعِنْدَكَ سَيَّارَةٌ ؟ لَا ، مَا عِنْدِي سَيَّارَةٌ .]]","As-tu une voiture ? Non, je n'ai pas de voiture."],["[[مَنْ مَعَكَ ؟ مَعِي زَمِيلِي .]]","Qui est avec toi ? Mon camarade est avec moi."]]}},{"h":"Questions personnelles","tbl":{"h":["Arabe","Français"],"r":[["[[مَا اسْمُكَ ؟ اِسْمِي مُحَمَّدٌ .]]","Quel est ton nom ? Mon nom est Muhammad."],["[[مَا لُغَتُكَ ؟ لُغَتِي الْأُرْدِيَّةُ .]]","Quelle est ta langue ? Ma langue est l'ourdou."],["[[أَيْنَ أَبُوكَ ؟ أَبِي فِي الْكُوَيْتِ .]]","Où est ton père ? Mon père est au Koweït."]]}}],"err":["Garder le tanwin devant un suffixe : [[بَيْتٌي]] est faux.","Oublier le [[و]] dans [[أَبُوكَ]] et [[أَخُوكَ]].","Dire [[عِنْدِي أَخٌ]] ? Compréhensible, mais pour la famille on préfère [[لِي أَخٌ]]."],"rec":["Suffixes : [[ـِي]], [[ـُكَ]], [[ـُهُ]], [[ـُهَا]].","Avoir = [[عِنْدِي]] (objets), [[لِي]] (famille).","Négation : [[مَا]]."]},"11":{"obj":"Lire ton premier texte suivi, « Ma maison », et apprendre [[فِيهِ]] / [[فِيهَا]] (dedans) et [[أُحِبُّ]] (j'aime).","secs":[{"h":"Dedans : فِيهِ / فِيهَا","p":"[[فِي]] + suffixe donne « dans lui / dans elle ». Après la kasra de [[فِي]], le suffixe [[هُ]] devient [[هِ]] : [[فِيهِ]] (dans lui, masculin), [[فِيهَا]] (dans elle, féminin).","tbl":{"h":["Arabe","Français"],"r":[["[[فِيهِ]]","dedans (masculin)"],["[[فِيهَا]]","dedans (féminin)"],["[[أُحِبُّ]]","j'aime"],["[[مَاذَا]]","que, quoi ?"],["[[مَا فِيهِ أَحَدٌ .]]","Il n'y a personne dedans."]]}},{"h":"Le texte « بَيْتِي » (Ma maison)","p":"Lis d'abord avec la traduction, puis sans. Repère les suffixes [[ـِي]], [[ـُهُ]], [[ـُهَا]] et les mots [[فِيهِ]] / [[فِيهَا]].","tbl":{"h":["Arabe","Français"],"r":[["[[هَذَا بَيْتِي . بَيْتِي أَمَامَ الْمَسْجِدِ .]]","Ceci est ma maison. Ma maison est devant la mosquée."],["[[فِيهِ حَدِيقَةٌ صَغِيرَةٌ .]]","Il y a dedans un petit jardin."],["[[هَذِهِ غُرْفَتِي . فِيهَا نَافِذَةٌ كَبِيرَةٌ وَمِرْوَحَةٌ جَمِيلَةٌ .]]","Ceci est ma chambre. Il y a une grande fenêtre et un joli ventilateur."],["[[حَقِيبَتِي تَحْتَ الْمَكْتَبِ .]]","Mon cartable est sous le bureau."],["[[لِي أَخٌ وَاحِدٌ اِسْمُهُ أُسَامَةُ ، وَلِي أُخْتٌ وَاحِدَةٌ اِسْمُهَا سُعَادُ .]]","J'ai un seul frère nommé Oussama et une seule sœur nommée Souad."],["[[أَنَا أُحِبُّ أَبِي وَأُمِّي . وَأُحِبُّ أَخِي وَأُخْتِي .]]","J'aime mon père et ma mère. Et j'aime mon frère et ma sœur."]]}}],"err":["Dire [[فِيهُ]] : après [[فِي]], le suffixe prend la kasra : [[فِيهِ]].","Oublier d'accorder [[فِيهِ]] (masculin) et [[فِيهَا]] (féminin) avec le nom auquel ils renvoient."],"rec":["[[فِيهِ]] masculin, [[فِيهَا]] féminin.","[[أُحِبُّ]] = j'aime.","Relis le texte jusqu'à pouvoir le traduire sans aide."]},"12":{"obj":"Saluer et répondre, demander des nouvelles, et conjuguer un verbe au féminin.","secs":[{"h":"La salutation","p":"La salutation musulmane complète s'adapte à la personne : [[عَلَيْكَ]] à un homme, [[عَلَيْكِ]] à une femme. On répond en inversant : [[وَعَلَيْكَ السَّلَامُ]].","tbl":{"h":["Arabe","Français"],"r":[["[[اَلسَّلَامُ عَلَيْكِ وَرَحْمَةُ اللَّهِ وَبَرَكَاتُهُ .]]","Que la paix, la miséricorde d'Allah et Ses bénédictions soient sur toi (à une femme)."],["[[وَعَلَيْكِ السَّلَامُ وَرَحْمَةُ اللَّهِ وَبَرَكَاتُهُ .]]","Et sur toi la paix, la miséricorde d'Allah et Ses bénédictions."],["[[كَيْفَ حَالُكِ يَا بِنْتُ ؟]]","Comment vas-tu, ma fille ?"],["[[أَنَا بِخَيْرٍ وَالْحَمْدُ لِلَّهِ .]]","Je vais bien, louange à Allah."]]}},{"h":"Le verbe au féminin","p":"Le passé féminin ajoute [[تْ]] au verbe : [[ذَهَبَ]] (il est allé) → [[ذَهَبَتْ]] (elle est allée). [[أَنْتِ]] est le « tu » féminin.","tbl":{"h":["Masculin","Féminin"],"r":[["[[خَرَجَ مُحَمَّدٌ مِنَ الْبَيْتِ .]]","[[خَرَجَتْ آمِنَةُ مِنَ الْبَيْتِ .]]"],["[[ذَهَبَ مُحَمَّدٌ]]","[[ذَهَبَتْ آمِنَةُ]]"]]}},{"h":"الَّذِي / الَّتِي : « qui »","p":"[[الَّذِي]] (masculin) et [[الَّتِي]] (féminin) relient une description à un nom défini.","tbl":{"h":["Arabe","Français"],"r":[["[[مَنْ هَذِهِ الْفَتَاةُ الَّتِي مَعَكِ ؟]]","Qui est cette jeune fille qui est avec toi ?"],["[[مَنِ الْفَتَى الَّذِي خَرَجَ مِنْ بَيْتِكَ ؟]]","Qui est le jeune homme qui est sorti de ta maison ?"],["[[مِنْ أَيْنَ أَنْتِ ؟ أَنَا مِنَ الرِّيَاضِ .]]","D'où es-tu ? Je suis de Riyad."]]}}],"err":["Oublier [[تْ]] quand le sujet est féminin.","Dire [[عَلَيْكَ]] à une femme : on dit [[عَلَيْكِ]].","Confondre [[الَّذِي]] et [[الَّتِي]]."],"rec":["Verbe féminin : + [[تْ]].","[[أَنْتِ]] = tu (féminin).","[[كَيْفَ حَالُكَ]] / [[حَالُكِ]], réponse [[بِخَيْرٍ]]."]},"13":{"obj":"Mettre les noms au pluriel (sain et irrégulier), dire « ils / elles » et conjuguer au pluriel.","secs":[{"h":"Trois pluriels","p":"Il y a trois façons de faire un pluriel. Le pluriel sain masculin ajoute [[ـُونَ]]. Le pluriel sain féminin remplace [[ـَةٌ]] par [[ـَاتٌ]]. Le pluriel irrégulier (« brisé ») change la forme du mot : il s'apprend avec chaque mot.","tbl":{"h":["Type","Singulier","Pluriel"],"r":[["sain masculin","[[مُسْلِمٌ]]","[[مُسْلِمُونَ]]"],["sain féminin","[[طَالِبَةٌ]]","[[طَالِبَاتٌ]]"],["irrégulier","[[طَالِبٌ]]","[[طُلَّابٌ]]"]]}},{"h":"Ils, elles, ceux-ci","p":"[[هُمْ]] = ils, [[هُنَّ]] = elles. [[هَؤُلَاءِ]] = ceux-ci / celles-ci, [[أُولَئِكَ]] = ceux-là / celles-là.","tbl":{"h":["Singulier","Pluriel"],"r":[["[[هَذَا طَالِبٌ]]","[[هَؤُلَاءِ طُلَّابٌ]]"],["[[هَذِهِ طَالِبَةٌ]]","[[هَؤُلَاءِ طَالِبَاتٌ]]"],["[[ذَلِكَ طَالِبٌ]]","[[أُولَئِكَ طُلَّابٌ]]"],["[[تِلْكَ طَالِبَةٌ]]","[[أُولَئِكَ طَالِبَاتٌ]]"]]}},{"h":"Le verbe au pluriel","p":"Pour « ils » : [[ذَهَبُوا]] (le alif final n'est pas prononcé). Pour « elles » : [[ذَهَبْنَ]].","tbl":{"h":["Masculin","Féminin"],"r":[["[[مُحَمَّدٌ ذَهَبَ]]","[[مَرْيَمُ ذَهَبَتْ]]"],["[[مُحَمَّدٌ وَحَامِدٌ وَعَلِيٌّ ذَهَبُوا]]","[[مَرْيَمُ وَآمِنَةُ وَفَاطِمَةُ ذَهَبْنَ]]"]]}},{"h":"Exemples","tbl":{"h":["Arabe","Français"],"r":[["[[هَؤُلَاءِ طُلَّابٌ جُدُدٌ .]]","Ce sont de nouveaux étudiants."],["[[هُمْ مِنْ أَمْرِيكَا .]]","Ils sont d'Amérique."],["[[هُمْ مُجْتَهِدُونَ .]]","Ils sont studieux."],["[[هُنَّ زَمِيلَاتِي .]]","Elles sont mes camarades (filles)."],["[[أُولَئِكَ أَطِبَّاءُ وَهَؤُلَاءِ مُهَنْدِسُونَ .]]","Ceux-là sont médecins et ceux-ci sont ingénieurs."]]}}],"err":["Chercher une règle pour le pluriel brisé : apprends-le avec le mot.","Utiliser [[هُمْ]] pour des filles : c'est [[هُنَّ]].","Prononcer le alif de [[ذَهَبُوا]]."],"rec":["Pluriel masculin sain : [[ـُونَ]] ; féminin sain : [[ـَاتٌ]] ; brisé : à apprendre.","[[هُمْ]] / [[هُنَّ]], [[هَؤُلَاءِ]] / [[أُولَئِكَ]].","Passé : [[ذَهَبَ]] / [[ذَهَبَتْ]] / [[ذَهَبُوا]] / [[ذَهَبْنَ]]."]},"14":{"obj":"Dire « nous » et « vous », utiliser [[ـنَا]] et [[ـكُمْ]], demander « quel ? » avec [[أَيُّ]] et accueillir quelqu'un.","secs":[{"h":"Nous et vous","tbl":{"h":["Arabe","Français"],"r":[["[[نَحْنُ]]","nous"],["[[أَنْتُمْ]]","vous (masculin pluriel)"],["[[ـنَا]]","notre / nous (suffixe)"],["[[ـكُمْ]]","votre (masculin pluriel)"]]}},{"h":"Les suffixes en action","tbl":{"h":["Arabe","Français"],"r":[["[[بَيْتُنَا الْجَدِيدُ قَرِيبٌ مِنَ الْمَطَارِ .]]","Notre nouvelle maison est près de l'aéroport."],["[[أَيْنَ بَيْتُكُمْ ؟ أَيْنَ مَدْرَسَتُكُمْ ؟ مَا لُغَتُكُمْ ؟]]","Où est votre maison ? Où est votre école ? Quelle est votre langue ?"],["[[اللَّهُ رَبُّنَا وَالْإِسْلَامُ دِينُنَا .]]","Allah est notre Seigneur et l'islam est notre religion."]]}},{"h":"Quel ? أَيُّ","p":"[[أَيُّ]] est suivi d'un nom indéfini au génitif.","tbl":{"h":["Arabe","Français"],"r":[["[[أَيُّ يَوْمٍ هَذَا ؟ هَذَا يَوْمُ السَّبْتِ .]]","Quel jour est-ce ? C'est samedi."],["[[أَيُّ شَهْرٍ هَذَا ؟ هَذَا شَهْرُ رَجَبٍ .]]","Quel mois est-ce ? C'est le mois de Rajab."]]}},{"h":"Accueillir","tbl":{"h":["Arabe","Français"],"r":[["[[أَهْلًا وَسَهْلًا وَمَرْحَبًا .]]","Bienvenue."],["[[شَفَاهُ اللَّهُ .]]","Qu'Allah le guérisse."],["[[نَحْنُ أَبْنَاءُ الدُّكْتُورِ مُوسَى .]]","Nous sommes les fils du docteur Moussa."],["[[أَأَنْتُمْ فِي الْمَدْرَسَةِ الثَّانَوِيَّةِ ؟ لَا ، نَحْنُ بِالْجَامِعَةِ .]]","Êtes-vous au lycée ? Non, nous sommes à l'université."]]}}],"err":["Confondre [[ـنَا]] (notre) et [[ـكُمْ]] (votre).","Mettre le nom après [[أَيُّ]] avec [[الْ]] : on dit [[أَيُّ يَوْمٍ]]."],"rec":["[[نَحْنُ]] nous, [[أَنْتُمْ]] vous.","Suffixes : [[ـنَا]] notre, [[ـكُمْ]] votre.","[[أَيُّ]] + nom indéfini au génitif."]},"15":{"obj":"Compléter les pronoms (« vous », féminin pluriel), dire quand avec [[مَتَى]], avant / après, et conjuguer [[ذَهَبَ]] au passé.","secs":[{"h":"Les pronoms séparés (الضَّمَائِرُ الْمُنْفَصِلَةُ)","tbl":{"h":["Masculin","Féminin","Français"],"r":[["[[هُوَ طَالِبٌ]]","[[هِيَ طَالِبَةٌ]]","il / elle est étudiant(e)"],["[[أَنْتَ طَالِبٌ]]","[[أَنْتِ طَالِبَةٌ]]","tu es étudiant(e)"],["[[أَنَا طَالِبٌ]]","[[أَنَا طَالِبَةٌ]]","je suis étudiant(e)"],["[[هُمْ طُلَّابٌ]]","[[هُنَّ طَالِبَاتٌ]]","ils / elles sont étudiants"],["[[أَنْتُمْ طُلَّابٌ]]","[[أَنْتُنَّ طَالِبَاتٌ]]","vous êtes étudiants"],["[[نَحْنُ طُلَّابٌ]]","[[نَحْنُ طَالِبَاتٌ]]","nous sommes étudiants"]]}},{"h":"Le passé de ذَهَبَ","p":"Au passé, la terminaison indique la personne : [[ـتُ]] (je), [[ـتَ]] (tu, masculin), [[ـتِ]] (tu, féminin), [[ـنَا]] (nous), [[ـتُمْ]] (vous), [[ـتُنَّ]] (vous, féminin).","tbl":{"h":["Arabe","Français"],"r":[["[[أَنَا ذَهَبْتُ]]","je suis allé(e)"],["[[أَنْتَ ذَهَبْتَ]]","tu es allé"],["[[أَنْتِ ذَهَبْتِ]]","tu es allée"],["[[نَحْنُ ذَهَبْنَا]]","nous sommes allés"],["[[أَنْتُمْ ذَهَبْتُمْ]]","vous êtes allés"],["[[أَنْتُنَّ ذَهَبْتُنَّ]]","vous êtes allées"]]}},{"h":"Quand, avant, après","p":"[[مَتَى]] demande le moment. [[قَبْلَ]] (avant) et [[بَعْدَ]] (après) sont suivis du génitif.","tbl":{"h":["Arabe","Français"],"r":[["[[مَتَى ذَهَبَتْ ؟ ذَهَبَتْ قَبْلَ أُسْبُوعٍ .]]","Quand est-elle partie ? Il y a une semaine."],["[[مَتَى اِخْتِبَارُكُنَّ ؟ اِخْتِبَارُنَا بَعْدَ شَهْرٍ .]]","Quand est votre examen ? Dans un mois."],["[[ذَهَبْتُ إِلَى الْمَسْجِدِ قَبْلَ الْأَذَانِ .]]","Je suis allé à la mosquée avant l'appel à la prière."],["[[ذَهَبْتُ إِلَى الْمَطْعَمِ بَعْدَ الصَّلَاةِ .]]","Je suis allé au restaurant après la prière."]]}}],"err":["Confondre les terminaisons [[ـتَ]] (masculin) et [[ـتِ]] (féminin).","Oublier le génitif après [[قَبْلَ]] / [[بَعْدَ]]."],"rec":["Six pronoms + leurs terminaisons au passé.","[[مَتَى]] quand, [[قَبْلَ]] avant, [[بَعْدَ]] après."]},"16":{"obj":"Parler de plusieurs choses : le pluriel d'un objet se comporte comme un féminin singulier.","secs":[{"h":"La règle d'or","p":"Quand un pluriel désigne des **choses ou des animaux** (غَيْرُ الْعَاقِلِ), tout s'accorde comme avec un féminin singulier : [[هَذِهِ]], [[هِيَ]], adjectif féminin singulier. Pour les **personnes** (الْعَاقِلُ), on utilise [[هَؤُلَاءِ]] et [[هُمْ]].","tbl":{"h":["Personnes","Choses"],"r":[["[[هَذَا طَالِبٌ ← هَؤُلَاءِ طُلَّابٌ]]","[[هَذَا بَيْتٌ ← هَذِهِ بُيُوتٌ]]"],["[[هَذِهِ طَالِبَةٌ ← هَؤُلَاءِ طَالِبَاتٌ]]","[[هَذِهِ سَيَّارَةٌ ← هَذِهِ سَيَّارَاتٌ]]"],["[[ذَلِكَ طَالِبٌ ← أُولَئِكَ طُلَّابٌ]]","[[ذَلِكَ بَيْتٌ ← تِلْكَ بُيُوتٌ]]"],["[[تِلْكَ طَالِبَةٌ ← أُولَئِكَ طَالِبَاتٌ]]","[[تِلْكَ سَيَّارَةٌ ← تِلْكَ سَيَّارَاتٌ]]"]]},"tip":"Choses au pluriel : [[هَذِهِ]] (proche) ou [[تِلْكَ]] (éloigné), et [[هِيَ]] pour « ils / elles »."},{"h":"Exemples","tbl":{"h":["Arabe","Français"],"r":[["[[هِيَ جَمِيلَةٌ جِدًّا .]]","Ils sont très beaux."],["[[هَذَا طَالِبٌ جَدِيدٌ . هُوَ مِنْ بَلْجِيكَا .]]","Ceci est un nouvel étudiant. Il est de Belgique."],["[[هَؤُلَاءِ طُلَّابٌ جُدُدٌ . هُمْ مِنْ بَلْجِيكَا .]]","Ce sont de nouveaux étudiants. Ils sont de Belgique."],["[[هَذِهِ كُتُبٌ جَدِيدَةٌ . هِيَ مِنْ بَلْجِيكَا .]]","Ce sont de nouveaux livres. Ils viennent de Belgique."]]}}],"err":["Utiliser [[هُمْ]] pour des objets : on dit [[هِيَ]].","Accorder l'adjectif au pluriel : on le met au féminin singulier."],"rec":["Pluriel de choses = féminin singulier.","Personnes : [[هَؤُلَاءِ]] / [[هُمْ]] ; choses : [[هَذِهِ]] / [[هِيَ]]."]},"17":{"obj":"Consolider le pluriel des choses avec de nombreux exemples et du vocabulaire.","secs":[{"h":"Rappel : féminin singulier","p":"Un pluriel de choses est accordé au féminin singulier : le verbe, l'adjectif et le pronom ([[هِيَ]]). Apprends chaque pluriel avec son mot.","tbl":{"h":["Arabe","Français"],"r":[["[[أَبْوَابُ الْمَسْجِدِ مَفْتُوحَةٌ .]]","Les portes de la mosquée sont ouvertes."],["[[النُّجُومُ جَمِيلَةٌ .]]","Les étoiles sont belles."],["[[هَذِهِ الدُّرُوسُ سَهْلَةٌ .]]","Ces leçons sont faciles."],["[[فِي الْهِنْدِ لُغَاتٌ كَثِيرَةٌ .]]","En Inde il y a beaucoup de langues."],["[[السَّاعَةُ الْيَابَانِيَّةُ رَخِيصَةٌ .]]","La montre japonaise est bon marché."],["[[هَذِهِ الْحُمُرُ لِلْفَلَّاحِ .]]","Ces ânes sont à l'agriculteur."],["[[أَيْنَ كُتُبُكُنَّ يَا أَخَوَاتُ ؟ هِيَ فِي الْفَصْلِ .]]","Où sont vos livres, mes sœurs ? Ils sont dans la classe."],["[[فِي هَذَا الشَّارِعِ فَنَادِقُ كَبِيرَةٌ .]]","Dans cette rue il y a de grands hôtels."]]}},{"h":"Vocabulaire","tbl":{"h":["Arabe","Français"],"r":[["[[كَثِيرٌ]]","beaucoup, nombreux"]]},"tip":"Pour tout pluriel de chose, l'adjectif est au féminin singulier : [[فَنَادِقُ كَبِيرَةٌ]], jamais [[كَبِيرُونَ]]."}],"err":["Mettre l'adjectif au pluriel d'un nom de chose.","Oublier que le verbe est aussi au féminin singulier."],"rec":["Choses au pluriel → tout au féminin singulier.","Relis les exemples en cachant le français."]},"18":{"obj":"Parler de deux personnes ou objets avec le duel, et demander « combien ? » avec [[كَمْ]].","secs":[{"h":"Former le duel (الْمُثَنَّى)","p":"L'arabe a une forme spéciale pour « deux » : on ajoute [[ـَانِ]] au nom. Pour un nom féminin en [[ـَةٌ]], la lettre [[ة]] devient [[ت]] : [[ـَتَانِ]].","tbl":{"h":["Singulier","Duel","Français"],"r":[["[[كِتَابٌ]]","[[كِتَابَانِ]]","deux livres"],["[[أُخْتٌ]]","[[أُخْتَانِ]]","deux sœurs"],["[[عَجَلَةٌ]]","[[عَجَلَتَانِ]]","deux roues"],["[[عِيدٌ]]","[[عِيدَانِ]]","deux fêtes"],["[[نَافِذَةٌ]]","[[نَافِذَتَانِ]]","deux fenêtres"],["[[مِسْطَرَةٌ]]","[[مِسْطَرَتَانِ]]","deux règles"],["[[أَخٌ]]","[[أَخَوَانِ]]","deux frères"],["[[عَيْنٌ]]","[[عَيْنَانِ]]","deux yeux"],["[[أُذُنٌ]]","[[أُذُنَانِ]]","deux oreilles"],["[[يَدٌ]]","[[يَدَانِ]]","deux mains"],["[[رِجْلٌ]]","[[رِجْلَانِ]]","deux pieds"]]},"tip":"Le duel remplace le tanwin : [[كِتَابٌ]] → [[كِتَابَانِ]]. Attention à [[أَخٌ]] → [[أَخَوَانِ]] : le [[و]] réapparaît. Pour info : au génitif et à l'accusatif, [[ـَانِ]] devient [[ـَيْنِ]] (par exemple [[فِي كِتَابَيْنِ]]), tu le verras plus tard."},{"h":"Demonstratifs et pronom au duel","tbl":{"h":["Arabe","Français"],"r":[["[[هُمَا]]","eux deux / elles deux"],["[[هَذَانِ]]","ces deux (masculin)"],["[[هَاتَانِ]]","ces deux (féminin)"]]}},{"h":"Combien ? كَمْ","p":"[[كَمْ]] est suivi d'un nom au **singulier** terminé par la fatha et le tanwin ([[ـًا]]) : [[كَمْ أَخًا لَكَ ؟]] On répond [[لِي أَخٌ وَاحِدٌ]] ou [[لِي أَخَوَانِ]].","tbl":{"h":["Arabe","Français"],"r":[["[[كَمْ أَخًا لَكَ يَا مُحَمَّدُ ؟ لِي أَخٌ وَاحِدٌ .]]","Combien de frères as-tu, Muhammad ? J'ai un seul frère."],["[[وَكَمْ أُخْتًا لَكَ ؟ لِي أُخْتَانِ .]]","Et combien de sœurs ? J'ai deux sœurs."],["[[كَمْ عَجَلَةً لِلدَّرَّاجَةِ ؟ لَهَا عَجَلَتَانِ .]]","Combien de roues a le vélo ? Il a deux roues."],["[[لِمَنْ هَذَانِ الدَّفْتَرَانِ ؟ هُمَا لِي .]]","À qui sont ces deux cahiers ? Ils sont à moi."],["[[لِي عَيْنَانِ وَأُذُنَانِ وَيَدَانِ وَرِجْلَانِ .]]","J'ai deux yeux, deux oreilles, deux mains et deux pieds."],["[[خَالِدٌ لَهُ ابْنَانِ وَبِنْتَانِ .]]","Khalid a deux fils et deux filles."]]}}],"err":["Dire « deux livres » avec un nombre et un pluriel : on utilise le duel, [[كِتَابَانِ]].","Mettre le nom au pluriel après [[كَمْ]] : il reste au singulier."],"rec":["Duel : nom + [[ـَانِ]] (féminin en [[ة]] : [[ـَتَانِ]]).","[[كَمْ]] + singulier accusatif.","[[هُمَا]], [[هَذَانِ]], [[هَاتَانِ]]."]},"19":{"obj":"Compter de 3 à 10 avec un nom masculin.","secs":[{"h":"La règle","p":"De 3 à 10, le nombre est suivi d'un **pluriel au génitif**, et le genre du nombre est **inversé** par rapport au nom compté. Avec un nom **masculin**, le nombre prend la [[ة]] : [[ثَلَاثَةُ طُلَّابٍ]]. « Un » se place après le nom, comme un adjectif : [[كِتَابٌ وَاحِدٌ]] ; « deux » s'exprime avec le duel : [[كِتَابَانِ]] (leçon 18). Après [[كَمْ]], le nom est au singulier accusatif : [[كَمْ طَالِبًا ؟]]","tbl":{"h":["Chiffre","Arabe","Exemple"],"r":[["٣","[[ثَلَاثَةُ]]","[[ثَلَاثَةُ طُلَّابٍ]]"],["٤","[[أَرْبَعَةُ]]","[[أَرْبَعَةُ طُلَّابٍ]]"],["٥","[[خَمْسَةُ]]","[[خَمْسَةُ طُلَّابٍ]]"],["٦","[[سِتَّةُ]]","[[سِتَّةُ طُلَّابٍ]]"],["٧","[[سَبْعَةُ]]","[[سَبْعَةُ طُلَّابٍ]]"],["٨","[[ثَمَانِيَةُ]]","[[ثَمَانِيَةُ طُلَّابٍ]]"],["٩","[[تِسْعَةُ]]","[[تِسْعَةُ طُلَّابٍ]]"],["١٠","[[عَشَرَةُ]]","[[عَشَرَةُ طُلَّابٍ]]"]]},"tip":"Moyen mnémotechnique : « masculin → nombre en [[ة]] ». Le nombre prend le genre contraire du nom."},{"h":"Exemples","tbl":{"h":["Arabe","Français"],"r":[["[[فِيهِ عَشَرَةُ طُلَّابٍ جُدُدٍ .]]","Il y a dix nouveaux étudiants."],["[[فِيهِ ثَلَاثَةُ طُلَّابٍ مِنَ الْفِلِبِّينِ وَأَرْبَعَةُ طُلَّابٍ مِنَ الْيَابَانِ .]]","Il y a trois étudiants des Philippines et quatre du Japon."],["[[فِيهِ سَبْعَةُ طُلَّابٍ مِنْ أَمْرِيكَا .]]","Il y a sept étudiants d'Amérique."],["[[عِنْدِي خَمْسَةُ كُتُبٍ وَثَلَاثَةُ أَقْلَامٍ .]]","J'ai cinq livres et trois stylos."],["[[خَالِدٌ لَهُ سِتَّةُ أَبْنَاءٍ .]]","Khalid a six fils."],["[[لِي أَرْبَعَةُ إِخْوَةٍ .]]","J'ai quatre frères."],["[[فِي الْأُسْبُوعِ سَبْعَةُ أَيَّامٍ .]]","Dans la semaine il y a sept jours."],["[[فِي هَذَا الْكِتَابِ عَشَرَةُ دُرُوسٍ .]]","Dans ce livre il y a dix leçons."]]}}],"err":["Mettre le nom compté au singulier : après 3 à 10, c'est un pluriel.","Oublier la kasra sur le nom compté (génitif).","Appliquer la règle d'accord habituelle : ici le genre est inversé."],"rec":["3 à 10 + pluriel au génitif.","Nom masculin → nombre avec [[ة]].","[[كَمْ]] + singulier accusatif."]},"20":{"obj":"Compter de 3 à 10 avec un nom féminin, et lire les chiffres arabes.","secs":[{"h":"La règle inversée","p":"Avec un nom **féminin**, le nombre perd la [[ة]] : [[ثَلَاثُ طَالِبَاتٍ]]. Le nom compté reste un pluriel au génitif. Après [[كَمْ]], le nom est au singulier accusatif : [[كَمْ أُخْتًا ؟]]","tbl":{"h":["Chiffre","Arabe","Exemple"],"r":[["٣","[[ثَلَاثُ]]","[[ثَلَاثُ طَالِبَاتٍ]]"],["٤","[[أَرْبَعُ]]","[[أَرْبَعُ طَالِبَاتٍ]]"],["٥","[[خَمْسُ]]","[[خَمْسُ طَالِبَاتٍ]]"],["٦","[[سِتُّ]]","[[سِتُّ طَالِبَاتٍ]]"],["٧","[[سَبْعُ]]","[[سَبْعُ طَالِبَاتٍ]]"],["٨","[[ثَمَانِي]]","[[ثَمَانِي طَالِبَاتٍ]]"],["٩","[[تِسْعُ]]","[[تِسْعُ طَالِبَاتٍ]]"],["١٠","[[عَشْرُ]]","[[عَشْرُ طَالِبَاتٍ]]"]]},"tip":"Masculin → [[ثَلَاثَةُ]] (avec [[ة]]). Féminin → [[ثَلَاثُ]] (sans [[ة]])."},{"h":"Les chiffres arabes","p":"Les chiffres s'écrivent ٠ ١ ٢ ٣ ٤ ٥ ٦ ٧ ٨ ٩ (0 à 9). Les mots s'écrivent de droite à gauche, mais les nombres se lisent de gauche à droite : ١٢٣ = 123.","tbl":{"h":["Chiffre","Valeur"],"r":[["٠","0"],["١","1"],["٢","2"],["٣","3"],["٤","4"],["٥","5"],["٦","6"],["٧","7"],["٨","8"],["٩","9"]]}},{"h":"Exemples","tbl":{"h":["Arabe","Français"],"r":[["[[فِي فَصْلِنَا خَمْسُ طَالِبَاتٍ مِنَ الصِّينِ وَأَرْبَعُ طَالِبَاتٍ مِنَ الْيَابَانِ .]]","Dans notre classe il y a cinq étudiantes de Chine et quatre du Japon."],["[[لِي ثَلَاثُ أَخَوَاتٍ وَخَمْسَةُ إِخْوَةٍ .]]","J'ai trois sœurs et cinq frères."],["[[لِي أَرْبَعَةُ إِخْوَةٍ وَأَرْبَعُ أَخَوَاتٍ .]]","J'ai quatre frères et quatre sœurs."],["[[لَنَا أَرْبَعَةُ أَعْمَامٍ وَخَمْسُ عَمَّاتٍ .]]","Nous avons quatre oncles paternels et cinq tantes paternelles."],["[[فِي بَلَدِي خَمْسُ جَامِعَاتٍ .]]","Dans mon pays il y a cinq universités."],["[[فِي ذَلِكَ الدَّرْسِ ثَمَانِي كَلِمَاتٍ جَدِيدَةٍ .]]","Dans cette leçon il y a huit mots nouveaux."]]}}],"err":["Garder la [[ة]] du nombre devant un nom féminin.","Se fier au sens : le genre se juge sur le **singulier** du nom compté. [[دَرْسٌ]] (leçon) est masculin, donc « dix leçons » = [[عَشَرَةُ دُرُوسٍ]] (leçon 19)."],"rec":["Nom féminin → nombre sans [[ة]].","Les chiffres ٠–٩ ; les nombres se lisent de gauche à droite.","Pour choisir, regarde le genre du **singulier** du nom compté."]},"21":{"obj":"Lire un texte suivi, « Mon école », en réutilisant nombres, duel, pluriels de choses et suffixes.","secs":[{"h":"Nouveaux mots","tbl":{"h":["Arabe","Français"],"r":[["[[ذَاكَ]]","cela (= [[ذَلِكَ]])"],["[[وَلَكِنْ]]","mais"],["[[ـهُمْ]]","leur (suffixe)"]]}},{"h":"Le texte « مَدْرَسَتِي » (Mon école)","p":"Lis-le à voix haute, puis traduis phrase par phrase. Repère le duel ([[نَافِذَتَانِ]]), le nombre ([[ثَلَاثَةُ أَبْوَابٍ]]) et le suffixe [[ـهُمْ]].","tbl":{"h":["Arabe","Français"],"r":[["[[هَذِهِ مَدْرَسَتِي . هِيَ قَرِيبَةٌ مِنَ الْمَسْجِدِ .]]","Ceci est mon école. Elle est près de la mosquée."],["[[هِيَ مَدْرَسَةٌ كَبِيرَةٌ لَهَا ثَلَاثَةُ أَبْوَابٍ .]]","C'est une grande école qui a trois portes."],["[[فِي فَصْلِنَا نَافِذَتَانِ كَبِيرَتَانِ وَسَبُّورَةٌ كَبِيرَةٌ .]]","Dans notre classe il y a deux grandes fenêtres et un grand tableau."],["[[هَذَا مَكْتَبُ الْمُدَرِّسِ وَذَاكَ كُرْسِيُّهُ .]]","Ceci est le bureau de l'enseignant et cela est sa chaise."],["[[وَتِلْكَ مَكَاتِبُ الطُّلَّابِ وَكَرَاسِيُّهُمْ .]]","Et ce sont les bureaux des étudiants et leurs chaises."],["[[فِي فَصْلِنَا عَشَرَةُ طُلَّابٍ .]]","Dans notre classe il y a dix étudiants."],["[[هُمْ مِنْ أَمْرِيكَا وَالْيَابَانِ وَالصِّينِ .]]","Ils viennent d'Amérique, du Japon et de Chine."],["[[وَلَكِنْ دِينُهُمْ وَاحِدٌ . رَبُّهُمْ وَاحِدٌ .]]","Mais leur religion est une. Leur Seigneur est un."],["[[هُمْ مُسْلِمُونَ . وَالْمُسْلِمُونَ إِخْوَةٌ .]]","Ils sont musulmans. Et les musulmans sont frères."]]}}],"err":["Lire sans comprendre : traduis chaque phrase de tête."],"rec":["Relis le texte trois fois à voix haute.","Cache la traduction et traduis de tête."]},"22":{"obj":"Apprendre les couleurs, [[قَالَ]] / [[قَالَتْ]] et les mots qui n'ont pas de tanwin.","secs":[{"h":"Les couleurs (masculin)","tbl":{"h":["Arabe","Français"],"r":[["[[أَبْيَضُ]]","blanc"],["[[أَسْوَدُ]]","noir"],["[[أَحْمَرُ]]","rouge"],["[[أَخْضَرُ]]","vert"],["[[أَزْرَقُ]]","bleu"],["[[أَصْفَرُ]]","jaune"]]},"tip":"Ces adjectifs n'ont pas de tanwin : on dit [[قَلَمٌ أَحْمَرُ]] (stylo rouge). Au féminin ils changent de forme ([[حَمْرَاءُ]], [[بَيْضَاءُ]]…), tu les verras plus tard."},{"h":"Dire : قَالَ / قَالَتْ","p":"[[قَالَ]] = il a dit, [[قَالَتْ]] = elle a dit. On les place avant le nom.","tbl":{"h":["Arabe","Français"],"r":[["[[قَالَ يُوسُفُ : عِنْدِي خَمْسَةُ أَقْلَامٍ : هَذَا قَلَمٌ أَحْمَرُ وَهَذَا قَلَمٌ أَزْرَقُ .]]","Youssouf a dit : j'ai cinq stylos : celui-ci est rouge, celui-ci est bleu."],["[[قَالَتْ زَيْنَبُ : عِنْدِي مَنَادِيلُ كَثِيرَةٌ .]]","Zaynab a dit : j'ai beaucoup de mouchoirs."],["[[قَالَتْ لَهَا فَاطِمَةُ : أَعِنْدَكِ مِنْدِيلٌ أَخْضَرُ ؟ قَالَتْ : لَا .]]","Fatima lui a dit : as-tu un mouchoir vert ? Elle a dit : non."]]}},{"h":"Mots sans tanwin (مَمْنُوعٌ مِنَ الصَّرْفِ)","p":"Certains mots ne prennent jamais de tanwin : on écrit [[زَيْنَبُ]] et non [[زَيْنَبٌ]]. Voici les types à reconnaître.","tbl":{"h":["Type de mot","Exemples"],"r":[["Prénoms féminins","[[زَيْنَبُ ، مَرْيَمُ ، فَاطِمَةُ ، عَائِشَةُ]]"],["Villes","[[مَكَّةُ ، جُدَّةُ]]"],["Prénoms masculins en [[ة]]","[[حَمْزَةُ ، أُسَامَةُ ، مُعَاوِيَةُ ، طَلْحَةُ]]"],["Prénoms en [[ـَانُ]]","[[عُثْمَانُ ، عَفَّانُ ، سُفْيَانُ ، مَرْوَانُ]]"],["Couleurs et comparatifs","[[أَبْيَضُ ، أَسْوَدُ ، أَحْمَرُ ، أَكْبَرُ ، أَسْعَدُ]]"],["Noms étrangers","[[وِلْيَمُ ، إِدْوَرْدُ ، لَنْدَنُ ، بَارِيسُ ، بَغْدَادُ]]"],["Certains pluriels irréguliers","[[أَصْدِقَاءُ ، مَسَاجِدُ ، مَدَارِسُ ، مَفَاتِيحُ ، فَنَاجِينُ]]"]]}}],"err":["Ajouter un tanwin à [[زَيْنَبُ]], [[مَسَاجِدُ]] ou [[أَحْمَرُ]].","Oublier [[تْ]] dans [[قَالَتْ]] quand le sujet est féminin."],"rec":["Couleurs masculines : [[أَبْيَضُ]] [[أَسْوَدُ]] [[أَحْمَرُ]] [[أَخْضَرُ]] [[أَزْرَقُ]] [[أَصْفَرُ]].","Pas de tanwin pour les prénoms féminins, villes, couleurs, comparatifs et beaucoup de pluriels brisés."]},"23":{"obj":"Lire un dialogue en classe et distinguer le génitif d'un nom ordinaire (kasra + tanwin) de celui d'un nom sans tanwin (fatha).","secs":[{"h":"Kasra avec tanwin ou fatha sans tanwin","p":"Après une préposition ou en annexion, un nom ordinaire prend la **kasra avec tanwin** : [[مِنْ مُحَمَّدٍ]]. Un nom qui n'a pas de tanwin prend la **fatha** (seule) : [[مِنْ زَيْنَبَ]]. Dans les deux cas c'est le génitif ; seule la voyelle change.","tbl":{"h":["Nom ordinaire","Nom sans tanwin"],"r":[["[[مِنْ مُحَمَّدٍ]]","[[مِنْ زَيْنَبَ]]"],["[[إِلَى مُحَمَّدٍ]]","[[إِلَى زَيْنَبَ]]"],["[[لِمُحَمَّدٍ]]","[[لِزَيْنَبَ]]"],["[[كِتَابُ مُحَمَّدٍ]]","[[كِتَابُ زَيْنَبَ]]"]]},"tip":"Pour savoir quelle voyelle mettre, demande-toi : ce nom peut-il avoir un tanwin ? Prénoms féminins et villes : jamais."},{"h":"Petits mots","tbl":{"h":["Arabe","Français"],"r":[["[[هَاتِ]]","donne !"],["[[مِنْ / إِلَى / لِ / فِي]]","prépositions suivies du génitif"]]}},{"h":"Exemples","tbl":{"h":["Arabe","Français"],"r":[["[[هَذَا الْكِتَابُ لِمُحَمَّدٍ وَذَلِكَ لِزَيْنَبَ .]]","Ce livre est à Muhammad et celui-là à Zaynab."],["[[ذَهَبَ خَالِدٌ إِلَى أَحْمَدَ .]]","Khalid est allé chez Ahmad."],["[[ذَهَبَ أَبِي إِلَى مَكَّةَ وَذَهَبَ عَمِّي إِلَى جُدَّةَ .]]","Mon père est allé à La Mecque et mon oncle à Djeddah."],["[[أَيْنَ زَوْجُ خَدِيجَةَ ؟ هُوَ فِي لَنْدَنَ .]]","Où est le mari de Khadija ? Il est à Londres."],["[[أَأَنْتَ مِنْ مَكَّةَ ؟ لَا . أَنَا مِنَ الطَّائِفِ .]]","Es-tu de La Mecque ? Non. Je suis de Taëf."],["[[الْبَيْتُ الْحَرَامُ فِي مَكَّةَ .]]","La Maison sacrée est à La Mecque."]]}}],"err":["Mettre un tanwin sur [[مَكَّةَ]] ou [[زَيْنَبَ]] après une préposition.","Mettre la fatha sur un nom ordinaire : [[مِنْ مُحَمَّدَ]] est faux."],"rec":["Génitif ordinaire : kasra + tanwin.","Génitif d'un mot sans tanwin : fatha.","Relis le dialogue de la leçon à voix haute."]}};

const RULES={"1":{"t":"« Ceci est… » et le tanwin","c":[{"h":"Pas de verbe « être »","x":"En arabe, il n'y a pas de verbe « être » au présent. On dit simplement [[هَذَا بَيْتٌ]] : « ceci (est) une maison ».\nPour demander : [[مَا هَذَا ؟]] = Qu'est-ce que c'est ? Réponse : [[هَذَا قَلَمٌ]].","q":"Dans [[هَذَا بَيْتٌ]], quel mot correspond à « est » ?","o":["Aucun : l'arabe n'a pas de verbe « être » au présent","[[هَذَا]]","[[بَيْتٌ]]"],"w":"Le verbe « être » est sous-entendu : on met simplement les deux mots côte à côte."},{"h":"Le tanwin = indéfini","x":"Les deux petits signes en fin de mot, comme dans [[بَيْتٌ]], s'appellent le tanwin. Il marque l'indéfini : « un / une ».","q":"Que marque le tanwin ([[ـٌ]]) à la fin de [[بَيْتٌ]] ?","o":["L'indéfini (un / une)","Le défini (le / la)","Le pluriel","Le féminin"],"w":"Tanwin = indéfini. Pour le défini, on ajoutera [[ال]] (leçon 3)."},{"h":"Poser la question","x":"[[مَا هَذَا ؟]] sert pour les choses. On répond toujours par [[هَذَا]] + le nom.","q":"Que veut dire [[مَا هَذَا ؟]]","o":["Qu'est-ce que c'est ?","Où est-ce ?","Qui est-ce ?","Est-ce un stylo ?"],"w":"[[مَا]] = quoi / que. [[هَذَا]] = ceci."}]},"2":{"t":"« Cela » : ذَلِكَ","c":[{"h":"Près ou loin","x":"[[هَذَا]] désigne ce qui est près (ceci). [[ذَلِكَ]] désigne ce qui est loin (cela, là-bas). On les oppose : [[هَذَا بَيْتٌ وَذَلِكَ مَسْجِدٌ]].","q":"Quel mot désigne ce qui est loin (masculin) ?","o":["[[ذَلِكَ]]","[[هَذَا]]","[[هَذِهِ]]","[[مَا]]"],"w":"[[ذَلِكَ]] = cela (loin). [[هَذَا]] = ceci (près)."},{"h":"Lire une phrase","x":"[[مَا ذَلِكَ ؟ ذَلِكَ نَجْمٌ]] = Qu'est-ce que c'est (là-bas) ? C'est une étoile.","q":"Que veut dire [[ذَلِكَ نَجْمٌ]] ?","o":["Cela (là-bas) est une étoile","Ceci est une étoile","Une étoile est ici","Qu'est-ce que c'est ?"],"w":"Même construction qu'à la leçon 1, avec [[ذَلِكَ]]."}]},"3":{"t":"L'article ال, phrase nominale, lettres lunaires et solaires","c":[{"h":"Rendre un mot défini","x":"Pour passer de l'indéfini au défini : on enlève le tanwin (on garde la damma simple) et on ajoute [[الْ]] devant.\n[[بَيْتٌ]] ← [[الْبَيْتُ]]","q":"Comment rendre [[كِتَابٌ]] défini ?","o":["[[الْكِتَابُ]]","[[الْكِتَابٌ]]","[[كِتَابُ]]","[[الْكِتَابِ]]"],"w":"Défini = [[الْ]] + fin simple (damma), sans tanwin."},{"h":"La phrase nominale","x":"Sujet défini + attribut indéfini, sans verbe : [[الْقَلَمُ مَكْسُورٌ]] = le stylo est cassé.","q":"Laquelle veut dire « Le livre est nouveau » ?","o":["[[الْكِتَابُ جَدِيدٌ]]","[[الْكِتَابُ الْجَدِيدُ]]","[[جَدِيدٌ الْكِتَابُ]]"],"w":"[[الْكِتَابُ الْجَدِيدُ]] = « le nouveau livre » (ce n'est pas une phrase). La phrase = défini + indéfini."},{"h":"Lettres lunaires et solaires","x":"Lettres lunaires : le [[ل]] de [[ال]] se prononce ([[الْقَمَرُ]] al-qamar).\nLettres solaires : le [[ل]] ne se prononce pas et la lettre suivante porte une shadda ([[الشَّمْسُ]] ash-shams).","q":"Comment se prononce [[الشَّمْسُ]] ?","o":["ash-shams (le [[ل]] ne se prononce pas)","al-shams","al-mas"],"w":"Devant une lettre solaire comme [[ش]], le [[ل]] s'assimile : la lettre est doublée (shadda)."}]},"4":{"t":"Prépositions : في، على، من، إلى","c":[{"h":"Les quatre prépositions","x":"[[فِي]] = dans, [[عَلَى]] = sur, [[مِنْ]] = de (origine), [[إِلَى]] = vers.\n[[أَيْنَ]] = où ? [[مِنْ أَيْنَ]] = d'où ? [[هُوَ]] = il, [[هِيَ]] = elle.","q":"Que veut dire [[مِنْ أَيْنَ ؟]]","o":["D'où ?","Où ?","Vers où ?","Qui ?"],"w":"[[مِنْ]] (de) + [[أَيْنَ]] (où) = d'où."},{"h":"Le génitif après une préposition","x":"Le nom qui suit une préposition est au génitif : il se termine par une kasra. [[فِي الْبَيْتِ]] = dans la maison.","q":"Quelle terminaison prend le nom après [[فِي]] ?","o":["Une kasra : [[الْبَيْتِ]]","Une damma : [[الْبَيْتُ]]","Une fatha : [[الْبَيْتَ]]"],"w":"Après une préposition : génitif = kasra."}]},"5":{"t":"L'annexion, le vocatif, ابن","c":[{"h":"L'annexion (إِضَافَة)","x":"Pour dire « le livre de Muhammad » : [[كِتَابُ مُحَمَّدٍ]]. Le premier terme perd [[ال]] et le tanwin. Le second est défini et au génitif.","q":"Comment dire « le livre du professeur » ?","o":["[[كِتَابُ الْمُدَرِّسِ]]","[[الْكِتَابُ الْمُدَرِّسِ]]","[[كِتَابٌ الْمُدَرِّسِ]]","[[كِتَابُ الْمُدَرِّسُ]]"],"w":"1er terme : sans [[ال]], sans tanwin. 2e terme : défini, génitif (kasra)."},{"h":"Le vocatif","x":"Pour appeler quelqu'un : [[يَا]] + nom. [[يَا مُحَمَّدُ]] = Ô Muhammad !","q":"Que veut dire [[يَا مُحَمَّدُ]] ?","o":["Ô Muhammad ! (on l'appelle)","Voici Muhammad","Le livre de Muhammad","Muhammad est ici"],"w":"[[يَا]] sert à interpeller."},{"h":"ابْن et la hamza","x":"[[اِبْنٌ]] (fils) perd sa hamza quand un mot le précède : on enchaîne (hamzat al-wasl).","q":"Que fait la hamza de [[اِبْنٌ]] quand un mot le précède ?","o":["Elle ne se prononce plus : on enchaîne","Elle devient un tanwin","Elle se double"],"w":"C'est la hamzat al-wasl : une hamza d'appui qui disparaît à l'enchaînement."}]},"6":{"t":"Le féminin : هَذِهِ et لِ","c":[{"h":"Ceci au féminin","x":"Avec un nom féminin : [[هَذِهِ سَيَّارَةٌ]] = ceci est une voiture. Beaucoup de noms féminins finissent par [[ـة]].","q":"Quel démonstratif avec [[سَيَّارَةٌ]] ?","o":["[[هَذِهِ]]","[[هَذَا]]","[[ذَلِكَ]]"],"w":"[[هَذِهِ]] = ceci (féminin)."},{"h":"Reconnaître le féminin","x":"Les noms en [[ـة]] sont (le plus souvent) féminins.","q":"Lequel de ces mots est féminin ?","o":["[[مَدْرَسَةٌ]]","[[كِتَابٌ]]","[[قَلَمٌ]]","[[بَيْتٌ]]"],"w":"[[مَدْرَسَةٌ]] finit par [[ة]]."},{"h":"لِ : l'appartenance","x":"[[لِ]] + nom = à. [[لِمَنْ هَذِهِ ؟]] = À qui est celle-ci ? [[هَذِهِ لِخَالِدٍ]] = elle est à Khalid.","q":"Que veut dire [[لِمَنْ هَذِهِ ؟]]","o":["À qui est celle-ci ?","Qui est celle-ci ?","Où est celle-ci ?","Quelle est celle-ci ?"],"w":"[[لِ]] (à) + [[مَنْ]] (qui)."}]},"7":{"t":"تِلْكَ et le tableau des démonstratifs","c":[{"h":"Le tableau","x":"Proche : masculin [[هَذَا]], féminin [[هَذِهِ]].\nÉloigné : masculin [[ذَلِكَ]], féminin [[تِلْكَ]].","q":"Quel mot veut dire « cela » (féminin, éloigné) ?","o":["[[تِلْكَ]]","[[ذَلِكَ]]","[[هَذِهِ]]","[[هَذَا]]"],"w":"Éloigné + féminin = [[تِلْكَ]]."},{"h":"Lire une phrase","x":"[[مَنْ تِلْكَ ؟ تِلْكَ فَاطِمَةُ]] = Qui est celle-là ? C'est Fatima.","q":"Que veut dire [[تِلْكَ فَاطِمَةُ]] ?","o":["Celle-là, c'est Fatima","Celle-ci, c'est Fatima","Fatima est ici","À qui est Fatima ?"],"w":"[[تِلْكَ]] = celle-là."}]},"8":{"t":"لِ + nom, خلف / أمام, pays et villes","c":[{"h":"لِ devant un nom défini","x":"[[هَذَا الْبَيْتُ لِلتَّاجِرِ]] = cette maison est au commerçant. Devant [[ال]], [[لِ]] + [[ال]] devient [[لِلـ]].","q":"Comment dire « à l'enseignant » ?","o":["[[لِلْمُدَرِّسِ]]","[[لِالْمُدَرِّسِ]]","[[لْمُدَرِّسِ]]"],"w":"L'alif de [[الْ]] disparaît : [[لِ]] + [[الْمُدَرِّسِ]] s'écrit [[لِلْمُدَرِّسِ]]."},{"h":"Devant et derrière","x":"[[أَمَامَ]] = devant, [[خَلْفَ]] = derrière. Ils sont suivis du génitif : [[أَمَامَ الْبَيْتِ]].","q":"Que veut dire [[أَمَامَ الْبَيْتِ]] ?","o":["Devant la maison","Derrière la maison","Dans la maison","Vers la maison"],"w":"[[أَمَامَ]] = devant, [[خَلْفَ]] = derrière."}]},"9":{"t":"Pronoms, l'adjectif (نَعْت), الَّذِي","c":[{"h":"Les pronoms","x":"[[أَنَا]] = je, [[أَنْتَ]] = tu (masc.), [[هُوَ]] = il, [[هِيَ]] = elle.","q":"Quel pronom veut dire « elle » ?","o":["[[هِيَ]]","[[هُوَ]]","[[أَنْتَ]]","[[أَنَا]]"],"w":"[[هِيَ]] = elle ; [[هُوَ]] = il."},{"h":"L'adjectif suit le nom","x":"L'adjectif suit le nom et s'accorde en genre et en défini : [[الْمُدِيرُ الْجَدِيدُ]] (le nouveau directeur), [[سَيَّارَةٌ جَمِيلَةٌ]] (une belle voiture).","q":"Comment dire « une belle voiture » ?","o":["[[سَيَّارَةٌ جَمِيلَةٌ]]","[[سَيَّارَةٌ جَمِيلٌ]]","[[السَّيَّارَةُ جَمِيلَةٌ]]"],"w":"Nom féminin → adjectif féminin ; les deux indéfinis. [[السَّيَّارَةُ جَمِيلَةٌ]] = « la voiture est belle »."},{"h":"Défini des deux côtés","x":"Si le nom est défini, l'adjectif l'est aussi.","q":"Comment dire « le nouveau directeur » ?","o":["[[الْمُدِيرُ الْجَدِيدُ]]","[[الْمُدِيرُ جَدِيدٌ]]","[[مُدِيرٌ الْجَدِيدُ]]"],"w":"[[الْمُدِيرُ جَدِيدٌ]] = « le directeur est nouveau » (phrase). Pour « le nouveau directeur » : défini + défini."}]},"10":{"t":"Pronoms suffixes et عند","c":[{"h":"Les suffixes","x":"Attachés au nom : [[ـِي]] = mon, [[ـكَ]] = ton (masc.), [[ـهُ]] = son (à lui), [[ـهَا]] = son (à elle). [[كِتَابُهَا]] = son livre (à elle).","q":"Que veut dire [[كِتَابُهَا]] ?","o":["Son livre (à elle)","Son livre (à lui)","Ton livre","Mon livre"],"w":"[[ـهَا]] = son/sa (à elle)."},{"h":"Avoir avec عند","x":"[[عِنْدَ]] + suffixe = « avoir » : [[عِنْدِي قَلَمٌ]] = j'ai un stylo. Négation : [[مَا عِنْدِي سَيَّارَةٌ]]. Avec la famille on dit [[لِي أَخٌ]].","q":"Comment dire « Je n'ai pas de voiture » ?","o":["[[مَا عِنْدِي سَيَّارَةٌ]]","[[عِنْدِي مَا سَيَّارَةٌ]]","[[مَا سَيَّارَةٌ عِنْدَ]]"],"w":"[[مَا]] + [[عِنْدِي]] + nom."},{"h":"La famille : لِي","x":"Pour un membre de la famille : [[لِي أَخٌ]] (j'ai un frère), et non [[عِنْدِي أَخٌ]].","q":"Comment dire « J'ai un frère » ?","o":["[[لِي أَخٌ]]","[[عِنْدِي أَخٌ]]"],"w":"Avec la famille, on utilise [[لِي]]."}]},"11":{"t":"Texte « بَيْتِي »","c":[{"h":"Mots du texte","x":"[[فِيهِ]] = dedans (masc.), [[فِيهَا]] = dedans (fém.), [[أُحِبُّ]] = j'aime, [[مَا فِيهِ أَحَدٌ]] = il n'y a personne dedans.","q":"Que veut dire [[أُحِبُّ]] ?","o":["J'aime","Je pars","Je sais","J'ai"],"w":"[[أُحِبُّ]] = j'aime."},{"h":"Dedans","x":"[[فِيهِ]] renvoie à un nom masculin, [[فِيهَا]] à un nom féminin.","q":"Que veut dire [[فِيهَا]] ?","o":["Dedans (en parlant d'un nom féminin)","Dedans (en parlant d'un nom masculin)","Avec elle","Vers elle"],"w":"[[فِي]] + [[هَا]] = en elle, dedans."}]},"12":{"t":"Salutations, كَيْفَ حَالُكَ، le verbe au féminin","c":[{"h":"Saluer et répondre","x":"[[السَّلَامُ عَلَيْكَ]] — réponse : [[وَعَلَيْكَ السَّلَامُ]].\n[[كَيْفَ حَالُكَ ؟]] = comment vas-tu ? Réponse : [[بِخَيْرٍ]] = bien.","q":"Que répond-on à [[السَّلَامُ عَلَيْكَ]] ?","o":["[[وَعَلَيْكَ السَّلَامُ]]","[[بِخَيْرٍ]]","[[كَيْفَ حَالُكَ]]"],"w":"On renvoie la salutation en inversant l'ordre."},{"h":"Le verbe au féminin","x":"Au passé, le féminin prend [[ـتْ]] : [[ذَهَبَ مُحَمَّدٌ]] / [[ذَهَبَتْ آمِنَةُ]]. [[الَّذِي]] (masc.) / [[الَّتِي]] (fém.) = qui.","q":"Comment dire « elle est allée » ?","o":["[[ذَهَبَتْ]]","[[ذَهَبَ]]","[[ذَهَبُوا]]"],"w":"Féminin au passé : [[ـتْ]] ajouté."}]},"13":{"t":"Le pluriel et les verbes au pluriel","c":[{"h":"Pluriels sains","x":"Masculin : [[ـُونَ]] ([[مُسْلِمٌ]] ← [[مُسْلِمُونَ]]). Féminin : [[ـَاتٌ]] ([[طَالِبَةٌ]] ← [[طَالِبَاتٌ]]).","q":"Quel est le pluriel de [[طَالِبَةٌ]] ?","o":["[[طَالِبَاتٌ]]","[[طَالِبُونَ]]","[[طُلَّابٌ]]"],"w":"Féminin sain : on remplace [[ـة]] par [[ـَاتٌ]]."},{"h":"Pluriel irrégulier","x":"Beaucoup de mots ont un pluriel irrégulier (جَمْعُ تَكْسِيرٍ), à apprendre avec chaque mot : [[طَالِبٌ]] ← [[طُلَّابٌ]].","q":"Comment apprendre un pluriel irrégulier ?","o":["Avec chaque mot, par cœur","Avec une règle fixe","On ajoute [[ـُونَ]]"],"w":"Pas de règle simple : on mémorise le pluriel avec le mot."},{"h":"Ils et elles","x":"[[هُمْ]] = ils, [[هُنَّ]] = elles. Verbes : [[ذَهَبُوا]] (ils sont allés), [[ذَهَبْنَ]] (elles sont allées).","q":"Comment dire « ils sont allés » ?","o":["[[ذَهَبُوا]]","[[ذَهَبْنَ]]","[[ذَهَبَتْ]]"],"w":"[[ـُوا]] = ils ; [[ـْنَ]] = elles."}]},"14":{"t":"نَحْنُ / أَنْتُمْ et suffixes","c":[{"h":"Nous et vous","x":"[[نَحْنُ]] = nous, [[أَنْتُمْ]] = vous (masc. pl.). Suffixes : [[ـنَا]] = notre, [[ـكُمْ]] = votre.","q":"Comment dire « votre maison » (à plusieurs) ?","o":["[[بَيْتُكُمْ]]","[[بَيْتُنَا]]","[[بَيْتُهُمْ]]"],"w":"[[ـكُمْ]] = votre."},{"h":"Verbes au passé","x":"[[ذَهَبْتُمْ]] = vous êtes allés. [[ذَهَبْنَا]] = nous sommes allés. [[أَيُّ]] = quel(le) ? + nom indéfini au génitif.","q":"Que veut dire [[ذَهَبْنَا]] ?","o":["Nous sommes allés","Vous êtes allés","Ils sont allés"],"w":"[[ـْنَا]] = nous."}]},"15":{"t":"أَنْتُنَّ, مَتَى, قَبْلَ / بَعْدَ","c":[{"h":"Vous (féminin pluriel)","x":"[[أَنْتُنَّ]] = vous (fém. pl.). Suffixes : [[ـك e gauche à droite, même dans un texte arabe.","q":"Que vaut [[٤]] ?","o":["4","5","6","3"],"w":"[[٠]]=0 [[١]]=1 [[٢]]=2 [[٣]]=3 [[٤]]=4 [[٥]]=5 [[٦]]=6 [[٧]]=7 [[٨]]=8 [[٩]]=9."}]},"21":{"t":"Texte « مَدْرَسَتِي »","c":[{"h":"Mots-outils du texte","x":"[[وَلَكِنْ]] = mais. Suffixes : [[ـنَا]] = notre, [[ـهُمْ]] = leur. Lis le texte à voix haute, puis traduis phrase par phrase.","q":"Que veut dire [[وَلَكِنْ]] ?","o":["Mais","Et","Où","Quand"],"w":"[[وَلَكِنْ]] = mais."},{"h":"Suffixes","x":"Le suffixe [[ـنَا]] sur un nom veut dire « notre ».","q":"Que veut dire [[مَدْرَسَتُنَا]] ?","o":["Notre école","Mon école","Leur école","Votre école"],"w":"[[ـنَا]] = notre."}]},"22":{"t":"Les couleurs, قَالَ / قَالَتْ, mots sans tanwin","c":[{"h":"Les couleurs","x":"[[أَبْيَضُ]] blanc, [[أَسْوَدُ]] noir, [[أَحْمَرُ]] rouge, [[أَخْضَرُ]] vert, [[أَزْرَقُ]] bleu, [[أَصْفَرُ]] jaune.","q":"Quel mot veut dire « noir » ?","o":["[[أَسْوَدُ]]","[[أَبْيَضُ]]","[[أَحْمَرُ]]","[[أَخْضَرُ]]"],"w":"[[أَسْوَدُ]] = noir."},{"h":"Pas de tanwin","x":"Ces adjectifs, beaucoup de noms propres et certains pluriels irréguliers ([[مَسَاجِدُ]], [[مَدَارِسُ]], [[مَفَاتِيحُ]]) n'ont pas de tanwin : on écrit [[أَحْمَرُ]], pas [[أَحْمَرٌ]].","q":"Lequel est un mot sans tanwin ?","o":["[[مَدَارِسُ]]","[[كِتَابٌ]]","[[قَلَمٌ]]","[[بَيْتٌ]]"],"w":"[[مَدَارِسُ]] est un pluriel irrégulier de ce type ([[مَمْنُوعٌ مِنَ الصَّرْفِ]])."},{"h":"Il a dit, elle a dit","x":"[[قَالَ]] = il a dit ; [[قَالَتْ]] = elle a dit.","q":"Que veut dire [[قَالَتْ]] ?","o":["Elle a dit","Il a dit","Ils ont dit","Tu as dit"],"w":"[[ـتْ]] = féminin."}]},"23":{"t":"Dialogue en classe ; noms propres sans tanwin avec les prépositions","c":[{"h":"Génitif des mots sans tanwin","x":"Un mot sans tanwin prend la fatha au génitif, pas la kasra : [[مِنْ أَحْمَدَ]], [[إِلَى مَكَّةَ]], [[كِتَابُ زَيْنَبَ]].","q":"Complète : [[هَذَا كِتَابُ]] ___ (Zaynab)","o":["[[زَيْنَبَ]]","[[زَيْنَبٍ]]","[[زَيْنَبِ]]"],"w":"Sans tanwin : fatha au génitif."},{"h":"Un nom ordinaire","x":"Un nom ordinaire prend la kasra avec tanwin : [[مِنْ مُحَمَّدٍ]], [[كِتَابُ عَلِيٍّ]].","q":"Complète : [[مِنْ]] ___ (Muhammad)","o":["[[مُحَمَّدٍ]]","[[مُحَمَّدَ]]","[[مُحَمَّدِ]]"],"w":"Mot ordinaire : kasra + tanwin."},{"h":"La Mecque","x":"[[مَكَّةُ]] est un nom propre sans tanwin : [[إِلَى مَكَّةَ]].","q":"Complète : [[ذَهَبْتُ إِلَى]] ___","o":["[[مَكَّةَ]]","[[مَكَّةٍ]]","[[مَكَّةِ]]"],"w":"Nom propre sans tanwin après une préposition : fatha."}]}};

function fixS(o){o.log=o.log||{};o.st=o.st||{};o.goal=o.goal||20;o.exams=o.exams||[];o.started=o.started||[];o.cards=o.cards||{};o.guide=o.guide||{};o.guide.done=o.guide.done||{};o.guide.pos=o.guide.pos||{};o.err=o.err||{};o.sm=o.sm||{};o.time=o.time||{};return o}
function blank(){return fixS({v:1,ts:0,started:[],cards:{}})}
function fmt(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function today(){return fmt(new Date())}
function addDays(n){const d=new Date();d.setDate(d.getDate()+n);return fmt(d)}
function dayDiff(s){const p=s.split('-').map(Number);const a=new Date(p[0],p[1]-1,p[2]);const t=new Date();const b=new Date(t.getFullYear(),t.getMonth(),t.getDate());return Math.round((a-b)/864e5)}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function parseAr(s){const m=s.match(/^(.*?)\s*\((.*)\)\s*$/);return m?{main:m[1],note:m[2]}:{main:s,note:''}}

function loadLocal(){try{const r=localStorage.getItem(KEY);if(r){const o=JSON.parse(r);if(o&&o.v===1&&o.cards)return fixS(o)}}catch(e){}return null}
function saveLocal(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

let saveTimer=null,saving=false,dirty=false;
function touch(){S.ts=Date.now();saveLocal();dirty=true;clearTimeout(saveTimer);saveTimer=setTimeout(flush,900)}
async function flush(){
  if(!docRef||saving||!dirty)return;
  saving=true;dirty=false;
  try{await docRef.set(JSON.parse(JSON.stringify(S)))}catch(e){dbState='local';if(view.n==='home')render()}
  saving=false;
  if(dirty)flush();
}
async function initDb(){
  try{
    if(!window.claude){dbState='local';return}
    const db=await claude.use('db');
    const user=await claude.use('user');
    if(!db||!user){dbState='local';return}
    const id=await user.id();
    if(!id){dbState='local';return}
    docRef=db.doc('data/users/'+id+'/state');
    const snap=await docRef.get();
    const remote=snap.exists?snap.data():null;
    if(remote&&remote.v===1&&remote.cards&&(remote.ts||0)>(S.ts||0)){if(S.ts>0){try{localStorage.setItem(KEY+'-bak',JSON.stringify(S))}catch(e){}}S=fixS(JSON.parse(JSON.stringify(remote)));saveLocal()}
    else if(S.ts>0){dirty=true;await flush()}
    dbState='account';
  }catch(e){dbState='local'}
  if(view.n==='home')render();
}

function wordMin(g,w){const a=S.cards[g+'.'+w+'.fa'],b=S.cards[g+'.'+w+'.af'];if(!a||!b)return null;return Math.min(a.b,b.b)}
function groupStatus(g){
  if(S.started.indexOf(g)<0)return 0;
  const ws=DATA[g-1].words;
  return ws.every((_,w)=>(wordMin(g,w)||0)>=3)?2:1;
}
function dueIds(){const t=today();return Object.keys(S.cards).filter(k=>S.cards[k].d<=t)}
function counts(){
  let started=0,solid=0;
  DATA.forEach(gr=>{if(S.started.indexOf(gr.g)>=0){started+=gr.words.length;gr.words.forEach((_,w)=>{if((wordMin(gr.g,w)||0)>=3)solid++})}});
  return {started,solid};
}
function nextGroup(){for(let i=1;i<=DATA.length;i++){if(S.started.indexOf(i)<0)return i}return 0}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function nextDueText(){
  const t=today();let best=null,n=0;
  Object.keys(S.cards).forEach(k=>{const d=S.cards[k].d;if(d>t){if(best===null||d<best){best=d;n=1}else if(d===best)n++}});
  if(!best)return '';
  const diff=dayDiff(best);
  let when;
  if(diff===1)when='demain';
  else{const p=best.split('-').map(Number);when='le '+new Date(p[0],p[1]-1,p[2]).toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'})}
  return 'Prochaines révisions : '+n+' carte'+(n>1?'s':'')+' '+when+'.';
}

function lessonLabel(l){return l?'Leçon '+l:'Complément'}
function secOf(gr){return gr.lesson===0?'Compléments par thème':gr.lesson>10?'Leçons 11 à 23 (ajoutées)':'Leçons 1 à 10'}
function plHtml(w){return w.pl?'<div class="pl">pluriel · <span class="ar">'+esc(w.pl)+'</span></div>':''}
function rowHtml(w,g,i,showPips){
  const p=parseAr(w.ar),m=wordMin(g,i);
  let pips='';
  if(showPips){pips='<div class="pips" aria-label="Niveau de mémorisation">';for(let k=1;k<=5;k++)pips+='<i class="'+(m>=k?'on':'')+'"></i>';pips+='</div>'}
  return '<div class="w'+(w.x&&!SHARED?' x':'')+'"><div class="f"><div>'+esc(w.fr)+(p.note?' <span class="muted">('+esc(p.note)+')</span>':'')+'</div>'+plHtml(w)+pips+'</div><div class="ar">'+esc(p.main)+'</div></div>';
}

try{history.replaceState({v:{n:'home'}},'')}catch(e){}

function answer(ok,easy){
  if(!ses||!ses.revealed)return;
  if(ses.mode==='test'){
    const tid=ses.queue.shift();
    ses.done++;
    if(ok)ses.correct++;else ses.wrong.push(tid);
    {const tp=tid.split('.');rec(tp[0]+'.'+tp[1],ok);recE(tp[2],ok);bump();touch()}
    ses.revealed=false;ses.padImg='';
    if(!ses.queue.length)go({n:'testdone'});else render();
    return;
  }
  const id=ses.queue.shift();const c=S.cards[id];delete c.n;
  {const pp=id.split('.');rec(pp[0]+'.'+pp[1],ok);recE(pp[2],ok);bump()}
  if(ok){
    if(ses.failed.has(id)){const pb=(ses.prev&&ses.prev[id])||0;c.b=Math.max(1,Math.floor(pb/2));c.d=addDays(INT[c.b-1])}
    else{c.b=Math.min(c.b+(easy?2:1),6);c.d=addDays(INT[c.b-1]);ses.first++}
    ses.done++;
  }else{
    if(!ses.failed.has(id)){ses.prev=ses.prev||{};ses.prev[id]=c.b;c.l=(c.l||0)+1}
    ses.failed.add(id);c.b=0;c.d=today();
    ses.queue.splice(Math.min(3,ses.queue.length),0,id);
  }
  touch();
  ses.revealed=false;ses.padImg='';
  if(!ses.queue.length){go({n:'done'})}else render();
}

function speak(text){
  try{
    const u=new SpeechSynthesisUtterance(text.replace(/\(.*?\)/g,'').replace(/ـ/g,'').trim());
    u.lang='ar-SA';u.rate=.8;
    speechSynthesis.cancel();speechSynthesis.speak(u);
  }catch(e){}
}
let rdOn=false,lastSS=[];
function utt(t,lang,rate){const u=new SpeechSynthesisUtterance(t);u.lang=lang;u.rate=rate;return u}
function rdMark(i){document.querySelectorAll('.ex.rd').forEach(x=>x.classList.remove('rd'));const e=document.getElementById('ex'+i);if(e){e.classList.add('rd');const r=e.getBoundingClientRect();if(r.top<80||r.bottom>innerHeight-80)e.scrollIntoView({block:'center',behavior:'smooth'})}}
function rdStop(){rdOn=false;try{speechSynthesis.cancel()}catch(e){}document.querySelectorAll('.ex.rd').forEach(x=>x.classList.remove('rd'));const b=document.querySelector('[data-act="rdall"]');if(b)b.innerHTML=SPK+'Tout lire'}
function rdPlay(from,to){
  try{
    speechSynthesis.cancel();rdOn=true;
    for(let i=from;i<to;i++){
      const x=lastSS[i];if(!x)continue;
      const a=utt(x.ar.replace(/\(.*?\)/g,'').replace(/ـ/g,'').trim(),'ar-SA',.8);
      a.onstart=()=>rdMark(i);
      if(!S.rdfr&&i===to-1)a.onend=()=>rdStop();
      speechSynthesis.speak(a);
      if(S.rdfr){const f=utt(x.fr,'fr-FR',.95);if(i===to-1)f.onend=()=>rdStop();speechSynthesis.speak(f)}
    }
    const b=document.querySelector('[data-act="rdall"]');if(b&&to-from>1)b.innerHTML=SPK+'Arrêter la lecture';
  }catch(e){rdOn=false}
}
function checkVoices(){try{hasAr=speechSynthesis.getVoices().some(v=>/^ar/i.test(v.lang))}catch(e){hasAr=false}}

  shuffle(combos).slice(0,nv).forEach(c=>items.push(vItem(c[0],c[1],'exam',pool)));
  return shuffle(items);
}

function testDoneV(){

  h+='<div>'+(pct>=80?'<span class="chip ok">Validé</span> <span class="muted">80 % ou plus</span>':'<span class="chip run">À retravailler</span> <span class="muted">objectif : 80 %</span>')+'</div></div>';
  const seen=new Set(),miss=[];
  ses.wrong.forEach(id=>{const q=id.split('.');const k=q[0]+'.'+q[1];if(!seen.has(k)){seen.add(k);miss.push(DATA[q[0]-1].words[q[1]])}});
  if(miss.length){
    h+='<h2>Mots à revoir ('+miss.length+')</h2><div class="card" style="padding-block:6px">';
    miss.forEach(w=>{const p=parseAr(w.ar);h+='<div class="miss"><div>'+esc(w.fr)+(p.note?' <span class="muted">('+esc(p.note)+')</span>':'')+'</div><div class="ar">'+esc(p.main)+'</div></div>'});

function sessionV(){

  }else{

  else if(a==='zoom')openZoom(b.dataset.src);
  else if(a==='rdall'){if(rdOn)rdStop();else rdPlay(0,lastSS.length)}
  else if(a==='rdone'){rdPlay(Number(b.dataset.i),Number(b.dataset.i)+1)}
  else if(a==='rdfr'){S.rdfr=!S.rdfr;touch();rdStop();const y=window.scrollY;render();window.scrollTo(0,y)}
  else if(a==='novow'){view.novow=!view.novow;const y=window.scrollY;render();window.scrollTo(0,y)}
  else if(a==='hidefr'){view.hidefr=!view.hidefr;const y=window.scrollY;render();window.scrollTo(0,y)}
  else if(a==='showfr'){const e=document.getElementById('fr'+b.dataset.i);if(e)e.style.display='';b.remove()}
  else if(a==='gl'){const g=document.getElementById('gl'+b.dataset.i),w=b.dataset.w,f=glFor(w);document.querySelectorAll('.tk.on').forEach(x=>x.classList.remove('on'));b.classList.add('on');if(view.novow&&(view.n==='lesson'||view.n==='course'))b.textContent=w;if(g)g.innerHTML='<span class="ar" style="font-size:22px">'+esc(w)+'</span> = '+(f?'<b>'+esc(f)+'</b>':'mot ou forme pas dans ta liste')}
  else if(a==='lessonopen')go({n:'lesson',l:Number(b.dataset.l)});
  else if(a==='lessontest')startTest(shuffle(lessonIds(Number(b.dataset.l))));
  else if(a==='lblk'){lib.a=Number(b.dataset.a);lib.b=Number(b.dataset.b);const y=window.scrollY;render();window.scrollTo(0,y)}
  else if(a==='tl'){const l=Number(b.dataset.l);if(tcfg.l.has(l))tcfg.l.delete(l);else tcfg.l.add(l);render()}
  else if(a==='tall'){const all=[...new Set(DATA.map(g=>g.lesson))];if(tcfg.l.size===all.length)tcfg.l=new Set();else tcfg.l=new Set(all);render()}
  else if(a==='tdir'){tcfg.dir=b.dataset.v;render()}
  else if(a==='tn'){tcfg.n=Number(b.dataset.v);render()}
  else if(a==='tstart'){const ids=shuffle(testPool());startTest(tcfg.n===0?ids:ids.slice(0,tcfg.n),tcfg.write)}
  else if(a==='tretry'){if(ses&&ses.mode==='test')startTest(shuffle(ses.wrong.slice()),ses.write)}
  else if(a==='reset'){
    if(!resetArmed){resetArmed=true;b.textContent='Confirmer : tout effacer';clearTimeout(resetTimer);resetTimer=setTimeout(()=>{resetArmed=false;if(view.n==='home')render()},4000)}
    else{resetArmed=false;S=blank();touch();go({n:'home'})}
  }
});
app.addEventListener('toggle',e=>{if(e.target.id==='d-more')ui.more=e.target.open;if(e.target.id==='d-crs')ui.crs=e.target.open;if(e.target.id==='d-groups')ui.groups=e.target.open;if(e.target.id==='d-themes')ui.themes=e.target.open},true);
app.addEventListener('input',e=>{
  if(e.target.id==='rrq'){view.rq=e.target.value;const el=document.getElementById('rrlist');if(el)el.innerHTML=rulesRefList(view.rq)}
  if(e.target.id==='libq'){lib.q=e.target.value;const el=document.getElementById('liblist');if(el)el.innerHTML=libListV()}
});
app.addEventListener('change',e=>{
  if(e.target.id==='crsP'){setProg(Number(e.target.value));view.a=1;view.b=prog();render();return}
  if(e.target.id==='crsa'||e.target.id==='crsb'||e.target.id==='crssz'){const v=Number(e.target.value);if(e.target.id==='crsa'){view.a=v;if(view.b<v)view.b=v}else if(e.target.id==='crsb'){view.b=v;if(view.a>v)view.a=v}else view.sz=v;const y=window.scrollY;render();window.scrollTo(0,y);return}
  if(e.target.id==='lwa'||e.target.id==='lwb'){const v=Number(e.target.value);if(e.target.id==='lwa'){view.a=v;if(view.b<v)view.b=v}else{view.b=v;if(view.a>v)view.a=v}render();return}
  if(e.target.id==='liba'||e.target.id==='libb'||e.target.id==='libsz'){const v=Number(e.target.value);if(e.target.id==='liba'){lib.a=v;if(lib.b<v)lib.b=v}else if(e.target.id==='libb'){lib.b=v;if(lib.a>v)lib.a=v}else lib.sz=v;const y=window.scrollY;render();window.scrollTo(0,y);return}
  if(e.target.id==='libth'){lib.th=e.target.value;const el=document.getElementById('liblist');if(el)el.innerHTML=libListV()}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape')closeZoom();
  if(e.key==='Enter'&&e.target&&e.target.id==='tin'){e.preventDefault();const tb=document.getElementById('tbtn');if(tb)tb.click();return}
  if(view.n!=='session'||!ses)return;
  if(!ses.revealed&&(e.key===' '||e.key==='Enter')){e.preventDefault();ses.revealed=true;render()}
  else if(ses.revealed&&e.key==='1')answer(false);
  else if(ses.revealed&&e.key==='2')answer(true);
  else if(ses.revealed&&e.key==='3'&&ses.mode!=='test')answer(true,true);
});

const local=loadLocal();if(local)S=local;
render();
initDb();

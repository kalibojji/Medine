  DATA[g-1].words.forEach((_,w)=>{['fa','af'].forEach(d=>{const id=g+'.'+w+'.'+d;if(!S.cards[id])S.cards[id]={b:0,d:today()}})});
  touch();
  startSession();
}
function sibKey(k){const p=k.split('.');return p.length===3?p[0]+'.'+p[1]:null}
function startSession(cap){
  const q=FSRS.sib(shuffle(dueIds()),S.cards,sibKey).slice(0,cap||60);touch();
  if(!q.length){go({n:'home'});return}
  ses={mode:'review',queue:q,total:q.length,done:0,first:0,failed:new Set(),revealed:false};
  go({n:'session'});
}
function testPool(){
  const dirs=tcfg.dir==='both'?['fa','af']:[tcfg.dir];
  const ids=[];
  DATA.forEach(gr=>{if(tcfg.l.has(gr.lesson))gr.words.forEach((_,w)=>dirs.forEach(d=>ids.push(gr.g+'.'+w+'.'+d)))});
  return ids;
}
function startTest(ids,wr){
  if(!ids.length)return;
  ses={mode:'test',queue:ids,total:ids.length,done:0,correct:0,wrong:[],revealed:false,write:!!wr};
  go({n:'session'});
}
function answer(ok,easy){
  if(!ses||!ses.revealed)return;
  if(ses.mode==='test'){
    const tid=ses.queue.shift();
    ses.done++;
    if(ok)ses.correct++;else ses.wrong.push(tid);
    {const tp=tid.split('.');rec(tp[0]+'.'+tp[1],ok);recE(tp[2],ok);bump(ok);touch()}
    ses.revealed=false;ses.padImg='';
    if(!ses.queue.length)go({n:'testdone'});else render();
    return;
  }
  const id=ses.queue.shift();const c=S.cards[id];delete c.n;
  {const pp=id.split('.');rec(pp[0]+'.'+pp[1],ok);recE(pp[2],ok);bump(ok,{first:!ses.failed.has(id)})}
  if(ok){
    if(ses.failed.has(id)){FSRS.review(c,3,id)}
    else{const hard=!easy&&(ses.ms||0)>(ses.write?20000:8000);FSRS.review(c,easy?4:hard?2:3,id);ses.first++}
    ses.done++;
  }else{
    if(!ses.failed.has(id)){ses.prev=ses.prev||{};ses.prev[id]=c.b;c.l=(c.l||0)+1;FSRS.review(c,1,id)}
    ses.failed.add(id);c.b=0;c.d=today();
    ses.queue.splice(Math.min(3,ses.queue.length),0,id);
  }
  touch();
  ses.revealed=false;ses.padImg='';ses.ms=null;ses.cur=null;
  if(!ses.queue.length){go({n:'done'})}else render();
}

function speak(text){
  try{
    const u=new SpeechSynthesisUtterance(text.replace(/\(.*?\)/g,'').replace(/ـ/g,'').trim());
    u.lang='ar-SA';u.rate=.8;
    speechSynthesis.cancel();speechSynthesis.speak(u);
  }catch(e){}
}
let rdOn=false,lastSS=[];
function utt(t,lang,rate){const u=new SpeechSynthesisUtterance(t);u.lang=lang;u.rate=rate;return u}
function rdMark(i){document.querySelectorAll('.ex.rd').forEach(x=>x.classList.remove('rd'));const e=document.getElementById('ex'+i);if(e){e.classList.add('rd');const r=e.getBoundingClientRect();if(r.top<80||r.bottom>innerHeight-80)e.scrollIntoView({block:'center',behavior:'smooth'})}}
function rdStop(){try{auStop()}catch(e){}rdOn=false;try{speechSynthesis.cancel()}catch(e){}document.querySelectorAll('.ex.rd').forEach(x=>x.classList.remove('rd'));const b=document.querySelector('[data-act="rdall"]');if(b)b.innerHTML=SPK+'Tout lire'}
function rdPlay(from,to){
  try{
    speechSynthesis.cancel();rdOn=true;
    for(let i=from;i<to;i++){
      const x=lastSS[i];if(!x)continue;
      const a=utt(x.ar.replace(/\(.*?\)/g,'').replace(/ـ/g,'').trim(),'ar-SA',.8);
      a.onstart=()=>rdMark(i);
      if(!S.rdfr&&i===to-1)a.onend=()=>rdStop();
      speechSynthesis.speak(a);
      if(S.rdfr){const f=utt(x.fr,'fr-FR',.95);if(i===to-1)f.onend=()=>rdStop();speechSynthesis.speak(f)}
    }
    const b=document.querySelector('[data-act="rdall"]');if(b&&to-from>1)b.innerHTML=SPK+'Arrêter la lecture';
  }catch(e){rdOn=false}
}

function gPick(sc){

  Object.keys(sc.slots).forEach(k=>{
    const pn=sc.slots[k],pool=GEN.pools[pn];used[pn]=used[pn]||{};
    let t=0,j;do{j=Math.floor(Math.random()*pool.length);t++}while(used[pn][j]&&t<60);

  });

}
function gFill(t,ch,fr){
  t=t.replace(/\{(\w+)\?([^|}]*)\|([^}]*)\}/g,(m,k,a,b)=>ch[k][2]==='f'?b:a);
  t=t.replace(/\{(\w+)(?::(\d+)(?:\|(\d+)@(\w+))?)?\}/g,(m,k,i,i2,g)=>{
    const it=ch[k];
    if(i2!==undefined)return it[(ch[g][2]==='f')?+i2:+i];
    if(i!==undefined)return it[+i];
    return it[fr?1:0];
  });
  return t;
}

function splitTok(w){
  const out=[];let rest=w;
  const m=rest.match(/^\u0648\u064E/);
  if(m&&rest.length>m[0].length+1&&NOSPLIT.indexOf(normAr(w))<0){out.push(m[0]);rest=rest.slice(m[0].length)}
  const a=rest.match(/^\u0627\u0644\u0652?(?![\u064B-\u0652])/);
  if(a&&rest.length>a[0].length){out.push(a[0]);rest=rest.slice(a[0].length)}
  out.push(rest);
  return out;
}

function sToks(s){return s.ar.split(' ').filter(t=>PUNCT.indexOf(t)<0)}
function sElig(s){const n=sToks(s).length;return scfg.mode==='cloze'?n>=3:n>=3&&n<=10}

function mkItem(s,mode,split){
  const words=sToks(s);
  const sp=split===undefined?scfg.split:split;
  if(mode==='build'||mode==='dict'){
    const bw=sp?words.reduce((a,w)=>a.concat(splitTok(w)),[]):words;
    let tiles=bw.map((w,i)=>({w:w,id:i}));
    for(let k=0;k<6;k++){shuffle(tiles);if(tiles.some((x,i)=>x.w!==bw[i]))break}
    return {s:s,m:'build',d:mode==='dict',words:bw,tiles:tiles,chosen:[],done:false,ok:false};
  }
  let cand=[];words.forEach((w,i)=>{if(normAr(w).length>=3)cand.push(i)});
  if(!cand.length)cand=words.map((_,i)=>i);
  const k=cand[Math.floor(Math.random()*cand.length)];
  const ans=words[k],na=normAr(ans);
  const near=[],far=[];
  SENT.forEach(o=>{sToks(o).forEach(w=>{if(normAr(w)!==na){(Math.abs(o.l-s.l)<=3?near:far).push(w)}})});
  const d=[],seen={};seen[na]=1;
  {const vr=variantOf(ans);if(vr&&vr!==ans)d.push(vr)}
  shuffle(near.slice()).concat(shuffle(far.slice())).forEach(w=>{const n=normAr(w);if(d.length<3&&!seen[n]){seen[n]=1;d.push(w)}});
  return {s:s,m:'cloze',words:words,k:k,ans:ans,opts:shuffle([ans].concat(d)),picked:null,done:false,ok:false};

async function alignBlob(bl,ar){
  const ws=ar.split(' '),n=ws.length,cw=wFrac(ar);

  const AC=window.AudioContext||window.webkitAudioContext;
  const ctx=new AC();

  try{buf=await new Promise((ok,ko)=>{const p=ctx.decodeAudioData(ab,ok,ko);if(p&&p.catch)p.catch(ko)})}finally{try{ctx.close()}catch(e){}}
  const d=buf.getChannelData(0),sr=buf.sampleRate,hop=Math.max(1,Math.round(sr*0.01)),win=Math.round(sr*0.025),F=Math.floor((d.length-win)/hop);
  if(F<30)return null;
  const e=new Float32Array(F);
  for(let f=0;f<F;f++){let s=0;const o=f*hop;for(let i=0;i<win;i+=2){const x=d[o+i];s+=x*x}e[f]=10*Math.log10(s/(win/2)+1e-10)}
  const sm=new Float32Array(F);
  for(let f=0;f<F;f++){let s=0,c=0;for(let j=-2;j<=2;j++){const q=f+j;if(q>=0&&q<F){s+=e[q];c++}}sm[f]=s/c}
  const srt=Array.from(sm).sort((x,y)=>x-y),fl=srt[Math.floor(F*0.1)],pk=srt[Math.floor(F*0.95)],rg=Math.max(6,pk-fl),thr=fl+0.2*rg;
  let s0=0,s1=F-1;
  while(s0<F-1&&sm[s0]<thr)s0++;
  while(s1>s0&&sm[s1]<thr)s1--;
  const L=Math.max(10,s1-s0),tot=buf.duration,fr=f=>Math.min(1,Math.max(0,f*hop/sr/tot));
  if(n===1)return {s:fr(s0),b:[fr(s1)]};
  const v=new Float32Array(F),R=15;
  for(let f=0;f<F;f++){let m=-1e9;for(let j=Math.max(0,f-R);j<=Math.min(F-1,f+R);j++)if(sm[j]>m)m=sm[j];v[f]=Math.min(1,(m-sm[f])/rg)}
  const K=n-1,prior=[],W=Math.max(8,Math.round(L*0.12));
  for(let k=0;k<K;k++)prior.push(s0+L*cw[k]);
  const lam=50,cand=[],cost=[],from=[];
  for(let k=0;k<K;k++){
    const lo=Math.max(s0+2,Math.round(prior[k]-W)),hi=Math.min(s1-2,Math.round(prior[k]+W));
    const cs=[];for(let c=lo;c<=hi;c++)cs.push(c);
    if(!cs.length)cs.push(Math.round(prior[k]));
    cand.push(cs);
    const cc=new Float32Array(cs.length),ff=new Int32Array(cs.length);
    for(let i=0;i<cs.length;i++){
      const dev=(cs[i]-prior[k])/L,local=-v[cs[i]]+lam*dev*dev;
      if(k===0){cc[i]=local;ff[i]=-1}
      else{let best=1e9,bi=-1;const pc=cand[k-1];for(let j=0;j<pc.length;j++){if(pc[j]<cs[i]-4&&cost[k-1][j]<best){best=cost[k-1][j];bi=j}}if(bi<0){let bb=1e9;for(let j=0;j<pc.length;j++)if(cost[k-1][j]<bb){bb=cost[k-1][j];bi=j}best=bb+5}cc[i]=best+local;ff[i]=bi}
    }
    cost.push(cc);from.push(ff);
  }
  let bi=0;for(let i=1;i<cost[K-1].length;i++)if(cost[K-1][i]<cost[K-1][bi])bi=i;
  const pos=new Array(K);
  for(let k=K-1;k>=0;k--){pos[k]=cand[k][bi];bi=from[k][bi]}
  for(let k=1;k<K;k++)if(pos[k]<=pos[k-1])pos[k]=pos[k-1]+1;

}

function auRun(q,i){

    a.onplaying=()=>{if(au===a){auMsg('');auRate(a);cancelAnimationFrame(hlRaf);hlRaf=requestAnimationFrame(()=>hlLoop(a,it))}};
    auMsg('Chargement…');
    const go=()=>{
      if(au!==a)return;
      const pr=a.play();
      if(pr&&pr.catch)pr.catch(()=>{if(au===a)auMsg('Lecture bloquée : appuie de nouveau sur le bouton.')});
    };

    hlT=null;

    ayahBlob(it.sn,it.a).then(async bl=>{

}

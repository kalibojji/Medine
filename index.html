function gPick(sc){
  const used={},ch={};
  Object.keys(sc.slots).forEach(k=>{
    const pn=sc.slots[k],pool=GEN.pools[pn];used[pn]=used[pn]||{};
    let t=0,j;do{j=Math.floor(Math.random()*pool.length);t++}while(used[pn][j]&&t<60);
    used[pn][j]=1;ch[k]=pool[j];
  });
  return ch;
}
function gFill(t,ch,fr){
  t=t.replace(/\{(\w+)\?([^|}]*)\|([^}]*)\}/g,(m,k,a,b)=>ch[k][2]==='f'?b:a);
  t=t.replace(/\{(\w+)(?::(\d+)(?:\|(\d+)@(\w+))?)?\}/g,(m,k,i,i2,g)=>{
    const it=ch[k];
    if(i2!==undefined)return it[(ch[g][2]==='f')?+i2:+i];
    if(i!==undefined)return it[+i];
    return it[fr?1:0];
  });
  return t;
}
function gScene(sc){
  const ch=gPick(sc);
  return sc.s.map(x=>{
    const ar=gFill(x[0],ch,false).replace(/\s+/g,' ').trim();
    let fr=gFill(x[1],ch,true).replace(/\s+/g,' ').trim();
    fr=fr.charAt(0).toUpperCase()+fr.slice(1);
    return {ar:ar,fr:fr,l:sc.l};
  });
}

const NOSPLIT=['ولد','واحد','وسخ','ورق','واسع','ولكن','وقت','وجه','والد','والدة','وصل'];
function splitTok(w){
  const out=[];let rest=w;
  const m=rest.match(/^\u0648\u064E/);
  if(m&&rest.length>m[0].length+1&&NOSPLIT.indexOf(normAr(w))<0){out.push(m[0]);rest=rest.slice(m[0].length)}
  const a=rest.match(/^\u0627\u0644\u0652?(?![\u064B-\u0652])/);
  if(a&&rest.length>a[0].length){out.push(a[0]);rest=rest.slice(a[0].length)}

function mkItem(s,mode,split){
  const words=sToks(s);
  const sp=split===undefined?scfg.split:split;
  if(mode==='build'||mode==='dict'){
    const bw=sp?words.reduce((a,w)=>a.concat(splitTok(w)),[]):words;
    let tiles=bw.map((w,i)=>({w:w,id:i}));
    for(let k=0;k<6;k++){shuffle(tiles);if(tiles.some((x,i)=>x.w!==bw[i]))break}
    return {s:s,m:'build',d:mode==='dict',words:bw,tiles:tiles,chosen:[],done:false,ok:false};
  }
  let cand=[];words.forEach((w,i)=>{if(normAr(w).length>=3)cand.push(i)});
  if(!cand.length)cand=words.map((_,i)=>i);
  const k=cand[Math.floor(Math.random()*cand.length)];
  const ans=words[k],na=normAr(ans);
  const near=[],far=[];
  SENT.forEach(o=>{sToks(o).forEach(w=>{if(normAr(w)!==na){(Math.abs(o.l-s.l)<=3?near:far).push(w)}})});
  const d=[],seen={};seen[na]=1;
  {const vr=variantOf(ans);if(vr&&vr!==ans)d.push(vr)}
  shuffle(near.slice()).concat(shuffle(far.slice())).forEach(w=>{const n=normAr(w);if(d.length<3&&!seen[n]){seen[n]=1;d.push(w)}});
  return {s:s,m:'cloze',words:words,k:k,ans:ans,opts:shuffle([ans].concat(d)),picked:null,done:false,ok:false};

function qBuild(){

}

function ctxIdx(){

  const rest=[];for(let k=0;k<rec.length||k<old.length;k++){if(rec[2*k])rest.push(rec[2*k]);if(rec[2*k+1])rest.push(rec[2*k+1]);if(old[k])rest.push(old[k])}
  const pool=miss.concat(rest);

let idbP=null;
function idb(){
  if(idbP)return idbP;
  idbP=new Promise((ok,ko)=>{
    try{
      const q=indexedDB.open('medine-audio',1);
      q.onupgradeneeded=()=>{q.result.createObjectStore('a')};
      q.onsuccess=()=>ok(q.result);
      q.onerror=()=>ko(q.error);
    }catch(e){ko(e)}
  });
  idbP.catch(()=>{idbP=null});
  return idbP;
}
function idbGet(k){return idb().then(d=>new Promise((ok,ko)=>{const q=d.transaction('a').objectStore('a').get(k);q.onsuccess=()=>ok(q.result);q.onerror=()=>ko(q.error)}))}
function idbHas(k){return idb().then(d=>new Promise((ok,ko)=>{const q=d.transaction('a').objectStore('a').count(k);q.onsuccess=()=>ok(q.result>0);q.onerror=()=>ko(q.error)}))}
function idbPut(k,v){return idb().then(d=>new Promise((ok,ko)=>{const t=d.transaction('a','readwrite');t.objectStore('a').put(v,k);t.oncomplete=()=>ok();t.onerror=()=>ko(t.error)}))}
function idbClear(pref){return idb().then(d=>new Promise((ok,ko)=>{const t=d.transaction('a','readwrite'),st=t.objectStore('a'),q=st.openKeyCursor();q.onsuccess=()=>{const c=q.result;if(c){if(c.key.indexOf(pref)===0)st.delete(c.key);c.continue()}};t.oncomplete=()=>ok();t.onerror=()=>ko(t.error)}))}
function auKeys(folder){

  add(1,1);

  return o;
}

  }).catch(()=>{const el=document.getElementById('offst');if(el)el.textContent='Le stockage hors connexion n\'est pas disponible sur ce navigateur.'});

async function offDownload(){
  if(dlBusy)return;
  const el=document.getElementById('offst'),f=recFolder(),ks=auKeys(f);
  dlBusy=true;
  let ok=0,fail=0,first=null;
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
  for(let i=0;i<ks.length;i++){
    const x=ks[i];
    if(el)el.textContent='Téléchargement… '+(i+1)+' / '+ks.length;
    try{
      if(await idbHas(x.k)){ok++;continue}
      const res=await fetch(ayahUrl(x.sn,x.a),{mode:'cors'});
      if(!res.ok)throw new Error('http '+res.status);
      const bl=await res.blob();
      if(!bl.size)throw new Error('vide');
      await idbPut(x.k,bl);ok++;
    }catch(e){fail++;if(!first)first=e;if(fail>=3&&ok===0)break}
  }
  dlBusy=false;
  const e2=document.getElementById('offst');
  if(e2){
    if(fail&&ok===0)e2.textContent='Téléchargement impossible : le serveur de récitation ou ton navigateur refuse l\'enregistrement hors connexion. L\'écoute en ligne continue de fonctionner.';
    else if(fail)e2.textContent=ok+' récitations enregistrées, '+fail+' ont échoué. Vérifie ta connexion puis appuie de nouveau pour reprendre.';
  }
  if(!fail)offStatus();
  else{const b=document.getElementById('offdl');if(b)b.textContent='Reprendre le téléchargement'}
}

function wW(w){
  const c=w.replace(/[ً-ٰٟۖ-ۭـ]/g,'');
  const mad=(w.match(/[اويىٰ]/g)||[]).length;
  return Math.max(1,c.length)+mad*0.4+((w.match(/ّ/g)||[]).length)*0.6;
}
function wCum(a){
  const ws=a.split(' ').map(wW),t=ws.reduce((x,y)=>x+y,0);let c=0;
  return ws.map(x=>{c+=x;return (c/t).toFixed(4)}).join(',');
}
let hlRaf=0;
function hlClear(){
  cancelAnimationFrame(hlRaf);hlRaf=0;
  document.querySelectorAll('.sw.dn,.sw.cu').forEach(x=>x.classList.remove('dn','cu'));
}
function hlMark(e,f){
  const box=e.querySelector('.sar');if(!box)return;
  const cum=(box.dataset.c||'').split(',').map(Number),ws=box.querySelectorAll('.sw');
  const t=Math.min(1,Math.max(0,(f-0.04)/0.9));
  let cur=cum.findIndex(x=>t<=x);if(cur<0)cur=cum.length-1;
  ws.forEach((w,j)=>{w.classList.toggle('dn',j<cur);w.classList.toggle('cu',j===cur)});
}
function hlLoop(a,it){
  if(au!==a)return;
  if(it.k>=0&&a.duration>0&&isFinite(a.duration)){
    const e=document.querySelector('.ex[data-k="'+it.k+'"]');
    if(e)hlMark(e,a.currentTime/a.duration);
  }
  hlRaf=requestAnimationFrame(()=>hlLoop(a,it));
}
function auRate(a){try{a.preservesPitch=true;a.webkitPreservesPitch=true;a.playbackRate=S.sp||1}catch(e){}}
function spdHtml(){
  const v=S.sp||1;
  return '<div class="muted" style="font-size:13px;text-align:left;font-weight:600">Vitesse de lecture</div><div class="spd">'+[0.6,0.75,0.9,1].map(x=>'<button class="segb'+(v===x?' on':'')+'" aria-pressed="'+(v===x)+'" data-act="suspd" data-v="'+x+'">'+x+'×</button>').join('')+'</div>';

function auMsg(t){const e=document.getElementById('sumsg');if(e)e.textContent=t}
function auStop(){
  try{if(au){au.onended=null;au.onerror=null;au.onplaying=null;au.pause()}}catch(e){}
  au=null;
  hlClear();
  document.querySelectorAll('.ex.rd').forEach(x=>x.classList.remove('rd'));
  auMsg('');
}
function auRun(q,i){
  if(i>=q.length){auStop();return}
  const it=q[i];
  try{
    if(au){au.onended=null;au.onerror=null;au.onplaying=null;au.pause()}
    const a=new Audio();
    au=a;
    hlClear();
    auRate(a);
    const key=recFolder()+'/'+pad3(it.sn)+pad3(it.a);
    a.src=ayahUrl(it.sn,it.a);
    document.querySelectorAll('.ex.rd').forEach(x=>x.classList.remove('rd'));
    if(it.k>=0){const e=document.querySelector('.ex[data-k="'+it.k+'"]');if(e)e.classList.add('rd')}
    a.onended=()=>{if(au===a){hlClear();auRun(q,i+1)}};
    a.onerror=()=>{if(au===a){auStop();auMsg('Audio indisponible : vérifie ta connexion internet.')}};
    a.onplaying=()=>{if(au===a){auMsg('');auRate(a);cancelAnimationFrame(hlRaf);hlRaf=requestAnimationFrame(()=>hlLoop(a,it))}};
    auMsg('Chargement…');
    const go=()=>{
      if(au!==a)return;
      const pr=a.play();
      if(pr&&pr.catch)pr.catch(()=>{if(au===a)auMsg('Lecture bloquée : appuie de nouveau sur le bouton.')});
    };
    a.removeAttribute('src');
    idbGet(key).then(bl=>{
      if(au!==a)return;
      if(bl){const u=URL.createObjectURL(bl);a.src=u;const rv=()=>{try{URL.revokeObjectURL(u)}catch(e){}};a.addEventListener('ended',rv);a.addEventListener('error',rv)}
      else a.src=ayahUrl(it.sn,it.a);
      auRate(a);go();
    }).catch(()=>{if(au===a){a.src=ayahUrl(it.sn,it.a);go()}});
  }catch(e){auMsg('Audio indisponible.')}
}

  if(e.target.id==='libth'){lib.th=e.target.value;const el=document.getElementById('liblist');if(el)el.innerHTML=libListV()}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape')closeZoom();
  if(e.key==='Enter'&&e.target&&e.target.id==='tin'){e.preventDefault();const tb=document.getElementById('tbtn');if(tb)tb.click();return}
  if(view.n!=='session'||!ses)return;
  if(!ses.revealed&&(e.key===' '||e.key==='Enter')){e.preventDefault();ses.revealed=true;render()}
  else if(ses.revealed&&e.key==='1')answer(false);
  else if(ses.revealed&&e.key==='2')answer(true);
  else if(ses.revealed&&e.key==='3'&&ses.mode!=='test')answer(true,true);
});

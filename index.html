const COURSE={"1":{"obj":"Dire « ceci est… » et poser tes premières questions : quoi ? qui ? est-ce que ?","secs":[{"h":"Pas de verbe « être » au présent","p":"En arabe, on ne dit pas « ceci *est* une maison » : on pose simplement les deux mots côte à côte. [[هَذَا بَيْتٌ]] signifie « ceci (est) une maison ». Le verbe « être » est sous-entendu : ne le cherche pas.","tbl":{"h":["Arabe","Français"],"r":[["[[هَذَا بَيْتٌ]]","Ceci est une maison."],["[[هَذَا قَلَمٌ]]","Ceci est un stylo."],["[[هَذَا كِتَابٌ]]","Ceci est un livre."]]}},{"h":"Le tanwin : « un / une »","p":"Les deux petits signes en fin de mot, comme dans [[بَيْتٌ]], s'appellent le **tanwin**. Ils se lisent « -oun » ([[بَيْتٌ]] = « baytoun ») et marquent l'indéfini : « un / une ». À ce stade, presque tous les noms que tu rencontres sont indéfinis, donc avec tanwin.","tip":"Le tanwin n'est pas une lettre : c'est une voyelle suivie d'un son « n ». Ne l'écris pas comme un ن."},{"h":"Poser des questions","p":"Trois outils pour interroger, et deux mots pour répondre.","tbl":{"h":["Arabe","Français"],"r":[["[[مَا هَذَا ؟]]","Qu'est-ce que c'est ? (choses)"],["[[مَنْ هَذَا ؟]]","Qui est-ce ? (personnes)"],["[[أَهَذَا بَيْتٌ ؟]]","Est-ce une maison ? (oui / non)"],["[[نَعَمْ ، هَذَا بَيْتٌ .]]","Oui, c'est une maison."],["[[لَا ، هَذَا كُرْسِيٌّ .]]","Non, c'est une chaise."]]},"tip":"[[مَا]] pour les choses, [[مَنْ]] pour les personnes. Pour une question oui / non, on colle [[أَ]] devant le premier mot : [[أَهَذَا]]."},{"h":"Les petits mots à connaître","tbl":{"h":["Arabe","Français"],"r":[["[[هَذَا]]","ceci, ce (masculin, proche)"],["[[مَا]]","quoi, que"],["[[مَنْ]]","qui"],["[[أَ]]","est-ce que (question oui / non)"],["[[نَعَمْ]]","oui"],["[[لَا]]","non"],["[[وَ]]","et (se colle au mot suivant)"]]}}],"err":["Chercher un verbe « est » : il n'existe pas.","Oublier le tanwin en fin de mot.","Séparer [[أَ]] du mot suivant : on écrit [[أَهَذَا]] en un seul bloc."],"rec":["[[هَذَا]] + nom = « ceci est… ».","Tanwin = « un / une ».","[[مَا]] (choses), [[مَنْ]] (personnes), [[أَ]] (oui / non)."]},"2":{"obj":"Distinguer ce qui est proche ([[هَذَا]]) de ce qui est loin ([[ذَلِكَ]]).","secs":[{"h":"Proche ou éloigné","p":"[[هَذَا]] désigne ce qui est près de toi (« ceci »), [[ذَلِكَ]] ce qui est loin (« cela »). On les oppose souvent dans une même phrase : [[هَذَا … وَذَلِكَ …]]. Le mot [[وَ]] (« et ») se colle au mot suivant : [[وَذَلِكَ]].","tbl":{"h":["Arabe","Français"],"r":[["[[مَا ذَلِكَ ؟ ذَلِكَ نَجْمٌ .]]","Qu'est-ce que c'est (là-bas) ? C'est une étoile."],["[[مَنْ ذَلِكَ ؟]]","Qui est-ce (là-bas) ?"],["[[هَذَا مَسْجِدٌ وَذَلِكَ بَيْتٌ .]]","Ceci est une mosquée et cela est une maison."],["[[أَذَلِكَ كَلْبٌ ؟ لَا ، ذَلِكَ قِطٌّ .]]","Est-ce un chien (là-bas) ? Non, c'est un chat."],["[[هَذَا سُكَّرٌ وَذَلِكَ لَبَنٌ .]]","Ceci est du sucre et cela est du lait."]]},"tip":"Dans [[ذَلِكَ]], le [[ا]] long après le [[ذ]] n'est pas écrit, mais il se lit : c'est un petit alif au-dessus de la lettre."}],"err":["Lire [[ذَلِكَ]] avec un « a » court : il faut allonger la première voyelle.","Oublier de coller [[وَ]] devant [[ذَلِكَ]]."],"rec":["[[هَذَا]] = proche, [[ذَلِكَ]] = éloigné.","Les deux se construisent exactement comme [[هَذَا]] : pas de verbe."]},"3":{"obj":"Passer de « un… » à « le… » avec [[الْ]], former une phrase sans verbe, et savoir prononcer le lām de [[الْ]].","secs":[{"h":"De l'indéfini au défini","p":"Pour dire « le / la / les », on ajoute [[الْ]] devant le mot **et** on remplace le tanwin par la voyelle simple correspondante : [[ـٌ]] devient [[ـُ]].","tbl":{"h":["Indéfini → défini","Français"],"r":[["[[بَيْتٌ ← الْبَيْتُ]]","une maison → la maison"],["[[كِتَابٌ ← الْكِتَابُ]]","un livre → le livre"],["[[قَلَمٌ ← الْقَلَمُ]]","un stylo → le stylo"],["[[رَجُلٌ ← الرَّجُلُ]]","un homme → l'homme"]]},"tip":"Un mot avec [[الْ]] n'a jamais de tanwin."},{"h":"La phrase nominale","p":"Sujet défini + attribut indéfini, sans verbe : [[الْقَلَمُ مَكْسُورٌ]] = « le stylo est cassé ». Le premier mot est défini ([[الْ]]), le second ne l'est pas (tanwin).","tbl":{"h":["Arabe","Français"],"r":[["[[الْقَلَمُ مَكْسُورٌ .]]","Le stylo est cassé."],["[[الْبَابُ مَفْتُوحٌ .]]","La porte est ouverte."],["[[الْوَلَدُ جَالِسٌ ، وَالْمُدَرِّسُ وَاقِفٌ .]]","Le garçon est assis et l'enseignant est debout."]]},"tip":"Défini + indéfini = phrase complète (« le stylo est cassé »). Défini + défini serait un simple groupe (« le stylo cassé »), tu le verras à la leçon 9."},{"h":"Lettres lunaires : le lām se prononce","p":"Devant 14 lettres, le [[ل]] de [[الْ]] se prononce normalement (avec un soukoun). On les appelle **lunaires**, comme dans [[الْقَمَرُ]].","tbl":{"h":["Exemple","Français"],"r":[["[[الْأَبُ]]","le père"],["[[الْبَابُ]]","la porte"],["[[الْجَنَّةُ]]","le paradis"],["[[الْحِمَارُ]]","l'âne"],["[[الْخُبْزُ]]","le pain"],["[[الْعَيْنُ]]","l'œil"],["[[الْغَدَاءُ]]","le déjeuner"],["[[الْفَمُ]]","la bouche"],["[[الْقَمَرُ]]","la lune"],["[[الْكَلْبُ]]","le chien"],["[[الْمَاءُ]]","l'eau"],["[[الْوَلَدُ]]","le garçon"],["[[الْهَوَاءُ]]","l'air"],["[[الْيَدُ]]","la main"]]}},{"h":"Lettres solaires : le lām disparaît","p":"Devant les 14 autres lettres, le [[ل]] ne se prononce pas : il s'assimile à la lettre suivante, qui est doublée (shadda). On écrit [[الشَّمْسُ]] mais on prononce le [[ش]] doublé : le [[ل]] ne s'entend pas. Ces lettres sont articulées avec la langue contre les dents ou le palais, comme le [[ل]] lui-même.","tbl":{"h":["Exemple","Français"],"r":[["[[التَّاجِرُ]]","le commerçant"],["[[الثَّوْبُ]]","le vêtement"],["[[الدِّيكُ]]","le coq"],["[[الذَّهَبُ]]","l'or"],["[[الرَّجُلُ]]","l'homme"],["[[الزَّهْرَةُ]]","la fleur"],["[[السَّمَكُ]]","le poisson"],["[[الشَّمْسُ]]","le soleil"],["[[الصَّدْرُ]]","la poitrine"],["[[الضَّيْفُ]]","l'invité"],["[[الطَّالِبُ]]","l'étudiant"],["[[الظَّهْرُ]]","le dos"],["[[اللَّحْمُ]]","la viande"],["[[النَّجْمُ]]","l'étoile"]]},"tip":"Repère visuel : devant une lettre solaire, tu verras une shadda sur la lettre et pas de soukoun sur le [[ل]]."}],"err":["Garder le tanwin avec [[الْ]] : on écrit [[الْبَيْتُ]], jamais [[الْبَيْتٌ]].","Prononcer le [[ل]] dans [[الشَّمْسُ]] : il s'assimile au [[ش]], qui est doublé.","Penser qu'une phrase nominale a besoin de [[هُوَ]] ou d'un verbe."],"rec":["[[الْ]] = le / la / les, et plus de tanwin.","Lunaire : le [[ل]] se prononce ; solaire : le [[ل]] s'assimile.","Défini + indéfini = phrase."]},"4":{"obj":"Dire où se trouve quelque chose ou quelqu'un, d'où l'on vient et où l'on va, avec quatre prépositions.","secs":[{"h":"Quatre prépositions","tbl":{"h":["Arabe","Français"],"r":[["[[فِي]]","dans"],["[[عَلَى]]","sur"],["[[مِنْ]]","de (origine)"],["[[إِلَى]]","vers, à"]]}},{"h":"Le nom qui suit prend la kasra (génitif)","p":"Après une préposition, le nom est au **génitif** : sa dernière voyelle devient une kasra ([[ـِ]]). Avec l'article, [[الْبَيْتُ]] devient [[فِي الْبَيْتِ]].","tbl":{"h":["Arabe","Français"],"r":[["[[الْبَيْتُ : فِي الْبَيْتِ]]","la maison : dans la maison"],["[[السَّرِيرُ : عَلَى السَّرِيرِ]]","le lit : sur le lit"],["[[ذَهَبَ إِلَى الْمُدِيرِ .]]","Il est allé chez le directeur."],["[[خَرَجَ مِنَ الْفَصْلِ .]]","Il est sorti de la classe."]]},"tip":"Devant [[الْ]], [[مِنْ]] devient [[مِنَ]] (fatha) : on dit « minal-fasl »."},{"h":"Où ? D'où ? Il, elle, je, tu","p":"[[أَيْنَ]] demande le lieu, [[مِنْ أَيْنَ]] l'origine. On répond avec un pronom : [[هُوَ]] (il), [[هِيَ]] (elle), [[أَنَا]] (je), [[أَنْتَ]] (tu, masculin).","tbl":{"h":["Arabe","Français"],"r":[["[[أَيْنَ مُحَمَّدٌ ؟ هُوَ فِي الْغُرْفَةِ .]]","Où est Muhammad ? Il est dans la chambre."],["[[أَيْنَ الْكِتَابُ ؟ هُوَ عَلَى الْمَكْتَبِ .]]","Où est le livre ? Il est sur le bureau."],["[[أَيْنَ آمِنَةُ ؟ هِيَ فِي الْمَطْبَخِ .]]","Où est Amina ? Elle est dans la cuisine."],["[[مِنْ أَيْنَ أَنْتَ ؟ أَنَا مِنَ الْيَابَانِ .]]","D'où es-tu ? Je viens du Japon."]]}},{"h":"Prénoms de la leçon","tbl":{"h":["Masculins","Féminins"],"r":[["[[مُحَمَّدٌ ، خَالِدٌ ، حَامِدٌ ، يَاسِرٌ]]","[[آمِنَةُ ، زَيْنَبُ ، فَاطِمَةُ ، مَرْيَمُ]]"],["[[عَمَّارٌ ، سَعِيدٌ ، عَلِيٌّ ، عَبَّاسٌ]]","[[عَائِشَةُ ، خَدِيجَةُ ، صَفِيَّةُ ، رُقَيَّةُ]]"]]}}],"err":["Garder la damma après une préposition : [[فِي الْبَيْتُ]] est faux, on dit [[فِي الْبَيْتِ]].","Confondre [[هُوَ]] (il) et [[هِيَ]] (elle).","Oublier que [[أَيْنَ]] se place en tête de phrase."],"rec":["[[فِي]], [[عَلَى]], [[مِنْ]], [[إِلَى]] + nom à la kasra.","[[أَيْنَ]] = où ? ; [[مِنْ أَيْنَ]] = d'où ?","[[هُوَ]] il, [[هِيَ]] elle, [[أَنَا]] je, [[أَنْتَ]] tu."]},"5":{"obj":"Relier deux noms (le livre de Muhammad), appeler quelqu'un avec [[يَا]] et parler du fils avec [[ابْنُ]].","secs":[{"h":"L'annexion (الْإِضَافَةُ)","p":"Pour dire « le livre de Muhammad », on place les deux noms l'un derrière l'autre, dans le même ordre qu'en français. Le **premier** perd son article et son tanwin ; le **second** est au génitif (kasra).","tbl":{"h":["Arabe","Français"],"r":[["[[كِتَابُ مُحَمَّدٍ]]","le livre de Muhammad"],["[[مَكْتَبُ الْمُدَرِّسِ]]","le bureau de l'enseignant"],["[[سَيَّارَةُ الْمُدِيرِ]]","la voiture du directeur"],["[[مِفْتَاحُ الْبَيْتِ]]","la clé de la maison"],["[[كِتَابُ اللَّهِ]]","le livre d'Allah (le Coran)"],["[[بَيْتُ اللَّهِ]]","la maison d'Allah (la Kaaba)"]]},"tip":"Le premier terme n'a jamais de [[الْ]] : il est déjà défini par le second."},{"h":"Le fils : ابْنٌ","p":"[[ابْنٌ]] commence par un alif qui ne se prononce que si le mot est au début de la phrase. Précédé d'un autre mot, il disparaît à l'oral (c'est la [[هَمْزَةُ الْوَصْلِ]], hamza d'appui).","tbl":{"h":["Arabe","Français"],"r":[["[[ابْنُ مُحَمَّدٍ]]","le fils de Muhammad"]]}},{"h":"Appeler quelqu'un : يَا","p":"On appelle quelqu'un avec [[يَا]] suivi du nom, qui prend la damma sans tanwin.","tbl":{"h":["Arabe","Français"],"r":[["[[يَا مُحَمَّدُ ، يَا أُسْتَاذُ]]","ô Muhammad, ô professeur"]]}},{"h":"Petits mots de la leçon","tbl":{"h":["Arabe","Français"],"r":[["[[يَا]]","ô (vocatif)"],["[[تَحْتَ]]","sous"],["[[هُنَاكَ]]","là-bas"],["[[اِسْمٌ]]","nom"]]}}],"err":["Mettre [[الْ]] sur le premier terme : [[الْكِتَابُ مُحَمَّدٍ]] est faux.","Garder le tanwin sur le premier terme.","Oublier la kasra sur le second terme."],"rec":["Annexion : 1er terme sans [[الْ]] ni tanwin, 2e terme au génitif.","[[يَا]] + nom (damma, sans tanwin).","[[ابْنُ]] perd son alif à l'oral derrière un autre mot."]},"6":{"obj":"Montrer quelque chose de féminin avec [[هَذِهِ]], dire à qui c'est avec [[لِ]] et utiliser [[أَيْضًا]] et [[جِدًّا]].","secs":[{"h":"هَذِهِ : « ceci » au féminin","p":"Pour un nom féminin, on utilise [[هَذِهِ]] à la place de [[هَذَا]]. La phrase reste sans verbe. Beaucoup de noms féminins se terminent par [[ـَةٌ]] (la lettre [[ة]]) ; quelques-uns n'en ont pas ([[عَيْنٌ]] œil, [[يَدٌ]] main).","tbl":{"h":["Arabe","Français"],"r":[["[[هَذِهِ آمِنَةُ .]]","Ceci est Amina."],["[[مَنْ هَذِهِ ؟ هَذِهِ أُخْتُ الْمُهَنْدِسِ .]]","Qui est-ce ? C'est la sœur de l'ingénieur."],["[[هَذِهِ بَقَرَةُ الْفَلَّاحِ .]]","Ceci est la vache de l'agriculteur."],["[[هَذَا أَنْفٌ وَهَذَا فَمٌ .]]","Ceci est un nez et ceci est une bouche."]]},"tip":"Masculin → [[هَذَا]], féminin → [[هَذِهِ]]. [[أَنْفٌ]] et [[فَمٌ]] sont masculins : on dit [[هَذَا]]."},{"h":"Du masculin au féminin","p":"On forme souvent le féminin en ajoutant [[ـَةٌ]] au masculin.","tbl":{"h":["Masculin","Féminin"],"r":[["[[طَالِبٌ]] étudiant","[[طَالِبَةٌ]] étudiante"],["[[مُهَنْدِسٌ]] ingénieur","[[مُهَنْدِسَةٌ]] ingénieure"],["[[طَبِيبٌ]] médecin","[[طَبِيبَةٌ]] femme médecin"]]}},{"h":"لِ : à, pour (appartenance)","p":"La petite particule [[لِ]] se colle au nom et indique à qui appartient une chose. Le nom qui suit est au génitif.","tbl":{"h":["Arabe","Français"],"r":[["[[لِمَنْ هَذِهِ ؟ هَذِهِ لِخَالِدٍ .]]","À qui est ceci ? C'est à Khalid."],["[[هَذِهِ سَاعَةُ عَلِيٍّ . هِيَ جَمِيلَةٌ جِدًّا .]]","Ceci est la montre d'Ali. Elle est très belle."],["[[أَهِيَ أَيْضًا مُهَنْدِسَةٌ ؟ لَا ، هِيَ طَبِيبَةٌ .]]","Est-elle aussi ingénieure ? Non, elle est médecin."]]}},{"h":"Petits mots","tbl":{"h":["Arabe","Français"],"r":[["[[هَذِهِ]]","ceci (féminin)"],["[[لِ]]","à, pour"],["[[لِمَنْ]]","à qui ?"],["[[أَيْضًا]]","aussi"],["[[جِدًّا]]","très"]]}}],"err":["Dire [[هَذَا]] devant un nom féminin.","Détacher [[لِ]] du nom : il se colle ([[لِخَالِدٍ]]).","Oublier la kasra et le tanwin sur le nom après [[لِ]]."],"rec":["[[هَذِهِ]] + nom féminin.","[[لِ]] + nom = « à / pour » (génitif).","[[أَيْضًا]] aussi, [[جِدًّا]] très."]},"7":{"obj":"Compléter le tableau des quatre démonstratifs avec [[تِلْكَ]] (cela, féminin éloigné).","secs":[{"h":"Le tableau des démonstratifs","p":"Deux critères : le **genre** du nom (masculin / féminin) et la **distance** (proche / éloigné).","tbl":{"h":["","Masculin","Féminin"],"r":[["Proche (ceci)","[[هَذَا مُحَمَّدٌ]]","[[هَذِهِ آمِنَةُ]]"],["Éloigné (cela)","[[ذَلِكَ حَامِدٌ]]","[[تِلْكَ زَيْنَبُ]]"]]},"tip":"Pour choisir : 1) masculin ou féminin ? 2) près ou loin ? Les quatre mots : [[هَذَا]], [[هَذِهِ]], [[ذَلِكَ]], [[تِلْكَ]]."},{"h":"Exemples","tbl":{"h":["Arabe","Français"],"r":[["[[وَمَنْ تِلْكَ ؟ تِلْكَ فَاطِمَةُ .]]","Et qui est-ce (là-bas) ? C'est Fatima."],["[[هَذِهِ طَبِيبَةٌ وَتِلْكَ مُمَرِّضَةٌ .]]","Celle-ci est médecin et celle-là est infirmière."],["[[أَتِلْكَ دَجَاجَةٌ ؟ لَا ، تِلْكَ بَطَّةٌ .]]","Est-ce une poule ? Non, c'est un canard."],["[[مَا تِلْكَ ؟ تِلْكَ بَيْضَةٌ .]]","Qu'est-ce que c'est (là-bas) ? C'est un œuf."],["[[هَذِهِ سَيَّارَةُ الْمُدَرِّسِ وَتِلْكَ سَيَّارَةُ الْمُدِيرِ .]]","Ceci est la voiture de l'enseignant et cela est la voiture du directeur."]]}}],"err":["Dire [[ذَلِكَ]] devant un nom féminin éloigné : on dit [[تِلْكَ]].","Confondre [[هَذِهِ]] et [[تِلْكَ]] : l'un est proche, l'autre loin."],"rec":["Proche : [[هَذَا]] / [[هَذِهِ]]. Éloigné : [[ذَلِكَ]] / [[تِلْكَ]]."]},"8":{"obj":"Utiliser [[لِ]] avec l'article, dire devant / derrière, et parler des pays et des villes.","secs":[{"h":"لِ + الْ = لِلْ","p":"Quand [[لِ]] rencontre [[الْ]], l'alif de [[الْ]] disparaît : [[لِ]] + [[الْمُدَرِّسِ]] = [[لِلْمُدَرِّسِ]]. Devant une lettre solaire, le lām de [[الْ]] s'assimile : [[لِ]] + [[التَّاجِرِ]] = [[لِلتَّاجِرِ]].","tbl":{"h":["Arabe","Français"],"r":[["[[هَذَا الْبَيْتُ لِلتَّاجِرِ .]]","Cette maison est au commerçant."],["[[هَذَا الْبَيْتُ لِلتَّاجِرِ وَذَلِكَ الْبَيْتُ لِلطَّبِيبِ .]]","Cette maison est au commerçant et celle-là au médecin."],["[[لِمَنْ هَذِهِ السَّيَّارَةُ ؟]]","À qui est cette voiture ?"]]}},{"h":"Devant et derrière","p":"[[أَمَامَ]] (devant) et [[خَلْفَ]] (derrière) sont suivis du génitif, comme les prépositions.","tbl":{"h":["Arabe","Français"],"r":[["[[بَيْتُ التَّاجِرِ أَمَامَ الْمَسْجِدِ .]]","La maison du commerçant est devant la mosquée."],["[[بَيْتُ الطَّبِيبِ خَلْفَ الْمَدْرَسَةِ .]]","La maison du médecin est derrière l'école."]]}},{"h":"Pays et villes","p":"Avec les pays et les villes, on réutilise [[فِي]], [[مِنْ]] et [[إِلَى]]. Beaucoup de noms de pays se disent sans [[الْ]] : [[مِنْ أَمْرِيكَا]].","tbl":{"h":["Arabe","Français"],"r":[["[[هَذِهِ السَّيَّارَةُ مِنَ الْيَابَانِ وَتِلْكَ مِنْ أَمْرِيكَا .]]","Cette voiture vient du Japon et celle-là d'Amérique."],["[[الْبَيْتُ : فِي الْبَيْتِ ، مِنَ الْبَيْتِ ، إِلَى الْبَيْتِ]]","la maison : dans / de / vers la maison"]]}}],"err":["Écrire [[لِ الْمُدَرِّسِ]] : on écrit [[لِلْمُدَرِّسِ]].","Oublier la kasra après [[أَمَامَ]] et [[خَلْفَ]]."],"rec":["[[لِ]] + [[الْ]] = [[لِلْ]].","[[أَمَامَ]] devant, [[خَلْفَ]] derrière + génitif.","Pays : [[فِي]] / [[مِنْ]] / [[إِلَى]]."]},"9":{"obj":"Dire qui tu es, décrire avec des adjectifs et construire une relative avec [[الَّذِي]].","secs":[{"h":"Les pronoms","tbl":{"h":["Arabe","Français"],"r":[["[[أَنَا]]","je"],["[[أَنْتَ]]","tu (masculin)"],["[[هُوَ]]","il"],["[[هِيَ]]","elle"]]}},{"h":"L'adjectif (النَّعْتُ)","p":"L'adjectif se place **après** le nom et s'accorde avec lui en genre, en défini / indéfini et en voyelle finale.","tbl":{"h":["Arabe","Français"],"r":[["[[مُدِيرٌ جَدِيدٌ]]","un nouveau directeur"],["[[الْمُدِيرُ الْجَدِيدُ]]","le nouveau directeur"],["[[سَيَّارَةٌ جَمِيلَةٌ]]","une belle voiture"],["[[الْعَرَبِيَّةُ لُغَةٌ سَهْلَةٌ .]]","L'arabe est une langue facile."]]},"tip":"Piège classique : [[الْمُدِيرُ جَدِيدٌ]] (défini + indéfini) est une phrase : « le directeur est nouveau ». [[الْمُدِيرُ الْجَدِيدُ]] (défini + défini) est un groupe : « le nouveau directeur »."},{"h":"الَّذِي : « qui » (relative)","p":"[[الَّذِي]] relie un nom défini à une description : [[الرَّجُلُ الطَّوِيلُ الَّذِي خَرَجَ]] = « l'homme grand qui est sorti ».","tbl":{"h":["Arabe","Français"],"r":[["[[مَنْ أَنْتَ ؟ أَنَا طَالِبٌ .]]","Qui es-tu ? Je suis étudiant."],["[[أَأَنْتَ طَالِبٌ جَدِيدٌ ؟ نَعَمْ .]]","Es-tu un nouvel étudiant ? Oui."],["[[عَبَّاسٌ تَاجِرٌ غَنِيٌّ .]]","Abbas est un commerçant riche."],["[[لِمَاذَا الْمُدَرِّسُ غَضْبَانُ الْيَوْمَ ؟]]","Pourquoi l'enseignant est-il en colère aujourd'hui ?"]]}}],"err":["Accorder mal : adjectif masculin avec un nom féminin.","Mettre [[الْ]] sur le nom mais pas sur l'adjectif (ou l'inverse) quand on veut un groupe.","Oublier [[الَّذِي]] pour relier deux informations."],"rec":["Adjectif après le nom, même genre et même défini.","Défini + indéfini = phrase ; défini + défini = groupe.","[[الَّذِي]] = qui (masculin)."]},"10":{"obj":"Dire « mon, ton, son » avec les suffixes, et dire « avoir » avec [[عِنْدَ]] et [[لِ]].","secs":[{"h":"Les suffixes possessifs","p":"Au lieu de petits mots séparés, on colle une terminaison au nom : [[ـِي]] (mon), [[ـُكَ]] (ton, masculin), [[ـُهُ]] (son, à lui), [[ـُهَا]] (son, à elle). Le tanwin disparaît.","tbl":{"h":["Nom","mon","ton (m.)","son (à lui)","son (à elle)"],"r":[["[[بَيْتٌ]]","[[بَيْتِي]]","[[بَيْتُكَ]]","[[بَيْتُهُ]]","[[بَيْتُهَا]]"],["[[أَبٌ]]","[[أَبِي]]","[[أَبُوكَ]]","[[أَبُوهُ]]","[[أَبُوهَا]]"],["[[أَخٌ]]","[[أَخِي]]","[[أَخُوكَ]]","[[أَخُوهُ]]","[[أَخُوهَا]]"]]},"tip":"[[أَبٌ]] et [[أَخٌ]] ajoutent un [[و]] devant le suffixe : [[أَبُوكَ]], [[أَخُوهُ]]."},{"h":"Avoir : عِنْدَ et لِ","p":"Il n'y a pas de verbe « avoir ». On dit « chez moi » : [[عِنْدِي]]. Avec la famille, on préfère [[لِي]] (« à moi »). La négation est [[مَا]].","tbl":{"h":["Arabe","Français"],"r":[["[[عِنْدِي دَرَّاجَةٌ .]]","J'ai un vélo."],["[[أَلَكَ أَخٌ ؟ نَعَمْ ، لِي أَخٌ وَاحِدٌ .]]","As-tu un frère ? Oui, j'ai un seul frère."],["[[أَعِنْدَكَ سَيَّارَةٌ ؟ لَا ، مَا عِنْدِي سَيَّارَةٌ .]]","As-tu une voiture ? Non, je n'ai pas de voiture."],["[[مَنْ مَعَكَ ؟ مَعِي زَمِيلِي .]]","Qui est avec toi ? Mon camarade est avec moi."]]}},{"h":"Questions personnelles","tbl":{"h":["Arabe","Français"],"r":[["[[مَا اسْمُكَ ؟ اِسْمِي مُحَمَّدٌ .]]","Quel est ton nom ? Mon nom est Muhammad."],["[[مَا لُغَتُكَ ؟ لُغَتِي الْأُرْدِيَّةُ .]]","Quelle est ta langue ? Ma langue est l'ourdou."],["[[أَيْنَ أَبُوكَ ؟ أَبِي فِي الْكُوَيْتِ .]]","Où est ton père ? Mon père est au Koweït."]]}}],"err":["Garder le tanwin devant un suffixe : [[بَيْتٌي]] est faux.","Oublier le [[و]] dans [[أَبُوكَ]] et [[أَخُوكَ]].","Dire [[عِنْدِي أَخٌ]] ? Compréhensible, mais pour la famille on préfère [[لِي أَخٌ]]."],"rec":["Suffixes : [[ـِي]], [[ـُكَ]], [[ـُهُ]], [[ـُهَا]].","Avoir = [[عِنْدِي]] (objets), [[لِي]] (famille).","Négation : [[مَا]]."]},"11":{"obj":"Lire ton premier texte suivi, « Ma maison », et apprendre [[فِيهِ]] / [[فِيهَا]] (dedans) et [[أُحِبُّ]] (j'aime).","secs":[{"h":"Dedans : فِيهِ / فِيهَا","p":"[[فِي]] + suffixe donne « dans lui / dans elle ». Après la kasra de [[فِي]], le suffixe [[هُ]] devient [[هِ]] : [[فِيهِ]] (dans lui, masculin), [[فِيهَا]] (dans elle, féminin).","tbl":{"h":["Arabe","Français"],"r":[["[[فِيهِ]]","dedans (masculin)"],["[[فِيهَا]]","dedans (féminin)"],["[[أُحِبُّ]]","j'aime"],["[[مَاذَا]]","que, quoi ?"],["[[مَا فِيهِ أَحَدٌ .]]","Il n'y a personne dedans."]]}},{"h":"Le texte « بَيْتِي » (Ma maison)","p":"Lis d'abord avec la traduction, puis sans. Repère les suffixes [[ـِي]], [[ـُهُ]], [[ـُهَا]] et les mots [[فِيهِ]] / [[فِيهَا]].","tbl":{"h":["Arabe","Français"],"r":[["[[هَذَا بَيْتِي . بَيْتِي أَمَامَ الْمَسْجِدِ .]]","Ceci est ma maison. Ma maison est devant la mosquée."],["[[فِيهِ حَدِيقَةٌ صَغِيرَةٌ .]]","Il y a dedans un petit jardin."],["[[هَذِهِ غُرْفَتِي . فِيهَا نَافِذَةٌ كَبِيرَةٌ وَمِرْوَحَةٌ جَمِيلَةٌ .]]","Ceci est ma chambre. Il y a une grande fenêtre et un joli ventilateur."],["[[حَقِيبَتِي تَحْتَ الْمَكْتَبِ .]]","Mon cartable est sous le bureau."],["[[لِي أَخٌ وَاحِدٌ اِسْمُهُ أُسَامَةُ ، وَلِي أُخْتٌ وَاحِدَةٌ اِسْمُهَا سُعَادُ .]]","J'ai un seul frère nommé Oussama et une seule sœur nommée Souad."],["[[أَنَا أُحِبُّ أَبِي وَأُمِّي . وَأُحِبُّ أَخِي وَأُخْتِي .]]","J'aime mon père et ma mère. Et j'aime mon frère et ma sœur."]]}}],"err":["Dire [[فِيهُ]] : après [[فِي]], le suffixe prend la kasra : [[فِيهِ]].","Oublier d'accorder [[فِيهِ]] (masculin) et [[فِيهَا]] (féminin) avec le nom auquel ils renvoient."],"rec":["[[فِيهِ]] masculin, [[فِيهَا]] féminin.","[[أُحِبُّ]] = j'aime.","Relis le texte jusqu'à pouvoir le traduire sans aide."]},"12":{"obj":"Saluer et répondre, demander des nouvelles, et conjuguer un verbe au féminin.","secs":[{"h":"La salutation","p":"La salutation musulmane complète s'adapte à la personne : [[عَلَيْكَ]] à un homme, [[عَلَيْكِ]] à une femme. On répond en inversant : [[وَعَلَيْكَ السَّلَامُ]].","tbl":{"h":["Arabe","Français"],"r":[["[[اَلسَّلَامُ عَلَيْكِ وَرَحْمَةُ اللَّهِ وَبَرَكَاتُهُ .]]","Que la paix, la miséricorde d'Allah et Ses bénédictions soient sur toi (à une femme)."],["[[وَعَلَيْكِ السَّلَامُ وَرَحْمَةُ اللَّهِ وَبَرَكَاتُهُ .]]","Et sur toi la paix, la miséricorde d'Allah et Ses bénédictions."],["[[كَيْفَ حَالُكِ يَا بِنْتُ ؟]]","Comment vas-tu, ma fille ?"],["[[أَنَا بِخَيْرٍ وَالْحَمْدُ لِلَّهِ .]]","Je vais bien, louange à Allah."]]}},{"h":"Le verbe au féminin","p":"Le passé féminin ajoute [[تْ]] au verbe : [[ذَهَبَ]] (il est allé) → [[ذَهَبَتْ]] (elle est allée). [[أَنْتِ]] est le « tu » féminin.","tbl":{"h":["Masculin","Féminin"],"r":[["[[خَرَجَ مُحَمَّدٌ مِنَ الْبَيْتِ .]]","[[خَرَجَتْ آمِنَةُ مِنَ الْبَيْتِ .]]"],["[[ذَهَبَ مُحَمَّدٌ]]","[[ذَهَبَتْ آمِنَةُ]]"]]}},{"h":"الَّذِي / الَّتِي : « qui »","p":"[[الَّذِي]] (masculin) et [[الَّتِي]] (féminin) relient une description à un nom défini.","tbl":{"h":["Arabe","Français"],"r":[["[[مَنْ هَذِهِ الْفَتَاةُ الَّتِي مَعَكِ ؟]]","Qui est cette jeune fille qui est avec toi ?"],["[[مَنِ الْفَتَى الَّذِي خَرَجَ مِنْ بَيْتِكَ ؟]]","Qui est le jeune homme qui est sorti de ta maison ?"],["[[مِنْ أَيْنَ أَنْتِ ؟ أَنَا مِنَ الرِّيَاضِ .]]","D'où es-tu ? Je suis de Riyad."]]}}],"err":["Oublier [[تْ]] quand le sujet est féminin.","Dire [[عَلَيْكَ]] à une femme : on dit [[عَلَيْكِ]].","Confondre [[الَّذِي]] et [[الَّتِي]]."],"rec":["Verbe féminin : + [[تْ]].","[[أَنْتِ]] = tu (féminin).","[[كَيْفَ حَالُكَ]] / [[حَالُكِ]], réponse [[بِخَيْرٍ]]."]},"13":{"obj":"Mettre les noms au pluriel (sain et irrégulier), dire « ils / elles » et conjuguer au pluriel.","secs":[{"h":"Trois pluriels","p":"Il y a trois façons de faire un pluriel. Le pluriel sain masculin ajoute [[ـُونَ]]. Le pluriel sain féminin remplace [[ـَةٌ]] par [[ـَاتٌ]]. Le pluriel irrégulier (« brisé ») change la forme du mot : il s'apprend avec chaque mot.","tbl":{"h":["Type","Singulier","Pluriel"],"r":[["sain masculin","[[مُسْلِمٌ]]","[[مُسْلِمُونَ]]"],["sain féminin","[[طَالِبَةٌ]]","[[طَالِبَاتٌ]]"],["irrégulier","[[طَالِبٌ]]","[[طُلَّابٌ]]"]]}},{"h":"Ils, elles, ceux-ci","p":"[[هُمْ]] = ils, [[هُنَّ]] = elles. [[هَؤُلَاءِ]] = ceux-ci / celles-ci, [[أُولَئِكَ]] = ceux-là / celles-là.","tbl":{"h":["Singulier","Pluriel"],"r":[["[[هَذَا طَالِبٌ]]","[[هَؤُلَاءِ طُلَّابٌ]]"],["[[هَذِهِ طَالِبَةٌ]]","[[هَؤُلَاءِ طَالِبَاتٌ]]"],["[[ذَلِكَ طَالِبٌ]]","[[أُولَئِكَ طُلَّابٌ]]"],["[[تِلْكَ طَالِبَةٌ]]","[[أُولَئِكَ طَالِبَاتٌ]]"]]}},{"h":"Le verbe au pluriel","p":"Pour « ils » : [[ذَهَبُوا]] (le alif final n'est pas prononcé). Pour « elles » : [[ذَهَبْنَ]].","tbl":{"h":["Masculin","Féminin"],"r":[["[[مُحَمَّدٌ ذَهَبَ]]","[[مَرْيَمُ ذَهَبَتْ]]"],["[[مُحَمَّدٌ وَحَامِدٌ وَعَلِيٌّ ذَهَبُوا]]","[[مَرْيَمُ وَآمِنَةُ وَفَاطِمَةُ ذَهَبْنَ]]"]]}},{"h":"Exemples","tbl":{"h":["Arabe","Français"],"r":[["[[هَؤُلَاءِ طُلَّابٌ جُدُدٌ .]]","Ce sont de nouveaux étudiants."],["[[هُمْ مِنْ أَمْرِيكَا .]]","Ils sont d'Amérique."],["[[هُمْ مُجْتَهِدُونَ .]]","Ils sont studieux."],["[[هُنَّ زَمِيلَاتِي .]]","Elles sont mes camarades (filles)."],["[[أُولَئِكَ أَطِبَّاءُ وَهَؤُلَاءِ مُهَنْدِسُونَ .]]","Ceux-là sont médecins et ceux-ci sont ingénieurs."]]}}],"err":["Chercher une règle pour le pluriel brisé : apprends-le avec le mot.","Utiliser [[هُمْ]] pour des filles : c'est [[هُنَّ]].","Prononcer le alif de [[ذَهَبُوا]]."],"rec":["Pluriel masculin sain : [[ـُونَ]] ; féminin sain : [[ـَاتٌ]] ; brisé : à apprendre.","[[هُمْ]] / [[هُنَّ]], [[هَؤُلَاءِ]] / [[أُولَئِكَ]].","Passé : [[ذَهَبَ]] / [[ذَهَبَتْ]] / [[ذَهَبُوا]] / [[ذَهَبْنَ]]."]},"14":{"obj":"Dire « nous » et « vous », utiliser [[ـنَا]] et [[ـكُمْ]], demander « quel ? » avec [[أَيُّ]] et accueillir quelqu'un.","secs":[{"h":"Nous et vous","tbl":{"h":["Arabe","Français"],"r":[["[[نَحْنُ]]","nous"],["[[أَنْتُمْ]]","vous (masculin pluriel)"],["[[ـنَا]]","notre / nous (suffixe)"],["[[ـكُمْ]]","votre (masculin pluriel)"]]}},{"h":"Les suffixes en action","tbl":{"h":["Arabe","Français"],"r":[["[[بَيْتُنَا الْجَدِيدُ قَرِيبٌ مِنَ الْمَطَارِ .]]","Notre nouvelle maison est près de l'aéroport."],["[[أَيْنَ بَيْتُكُمْ ؟ أَيْنَ مَدْرَسَتُكُمْ ؟ مَا لُغَتُكُمْ ؟]]","Où est votre maison ? Où est votre école ? Quelle est votre langue ?"],["[[اللَّهُ رَبُّنَا وَالْإِسْلَامُ دِينُنَا .]]","Allah est notre Seigneur et l'islam est notre religion."]]}},{"h":"Quel ? أَيُّ","p":"[[أَيُّ]] est suivi d'un nom indéfini au génitif.","tbl":{"h":["Arabe","Français"],"r":[["[[أَيُّ يَوْمٍ هَذَا ؟ هَذَا يَوْمُ السَّبْتِ .]]","Quel jour est-ce ? C'est samedi."],["[[أَيُّ شَهْرٍ هَذَا ؟ هَذَا شَهْرُ رَجَبٍ .]]","Quel mois est-ce ? C'est le mois de [[رَجَبٍ]]."]]}},{"h":"Accueillir","tbl":{"h":["Arabe","Français"],"r":[["[[أَهْلًا وَسَهْلًا وَمَرْحَبًا .]]","Bienvenue."],["[[شَفَاهُ اللَّهُ .]]","Qu'Allah le guérisse."],["[[نَحْنُ أَبْنَاءُ الدُّكْتُورِ مُوسَى .]]","Nous sommes les fils du docteur Moussa."],["[[أَأَنْتُمْ فِي الْمَدْرَسَةِ الثَّانَوِيَّةِ ؟ لَا ، نَحْنُ بِالْجَامِعَةِ .]]","Êtes-vous au lycée ? Non, nous sommes à l'université."]]}}],"err":["Confondre [[ـنَا]] (notre) et [[ـكُمْ]] (votre).","Mettre le nom après [[أَيُّ]] avec [[الْ]] : on dit [[أَيُّ يَوْمٍ]]."],"rec":["[[نَحْنُ]] nous, [[أَنْتُمْ]] vous.","Suffixes : [[ـنَا]] notre, [[ـكُمْ]] votre.","[[أَيُّ]] + nom indéfini au génitif."]},"15":{"obj":"Compléter les pronoms (« vous », féminin pluriel), dire quand avec [[مَتَى]], avant / après, et conjuguer [[ذَهَبَ]] au passé.","secs":[{"h":"Les pronoms séparés (الضَّمَائِرُ الْمُنْفَصِلَةُ)","tbl":{"h":["Masculin","Féminin","Français"],"r":[["[[هُوَ طَالِبٌ]]","[[هِيَ طَالِبَةٌ]]","il / elle est étudiant(e)"],["[[أَنْتَ طَالِبٌ]]","[[أَنْتِ طَالِبَةٌ]]","tu es étudiant(e)"],["[[أَنَا طَالِبٌ]]","[[أَنَا طَالِبَةٌ]]","je suis étudiant(e)"],["[[هُمْ طُلَّابٌ]]","[[هُنَّ طَالِبَاتٌ]]","ils / elles sont étudiants"],["[[أَنْتُمْ طُلَّابٌ]]","[[أَنْتُنَّ طَالِبَاتٌ]]","vous êtes étudiants"],["[[نَحْنُ طُلَّابٌ]]","[[نَحْنُ طَالِبَاتٌ]]","nous sommes étudiants"]]}},{"h":"Le passé de ذَهَبَ","p":"Au passé, la terminaison indique la personne : [[ـتُ]] (je), [[ـتَ]] (tu, masculin), [[ـتِ]] (tu, féminin), [[ـنَا]] (nous), [[ـتُمْ]] (vous), [[ـتُنَّ]] (vous, féminin).","tbl":{"h":["Arabe","Français"],"r":[["[[أَنَا ذَهَبْتُ]]","je suis allé(e)"],["[[أَنْتَ ذَهَبْتَ]]","tu es allé"],["[[أَنْتِ ذَهَبْتِ]]","tu es allée"],["[[نَحْنُ ذَهَبْنَا]]","nous sommes allés"],["[[أَنْتُمْ ذَهَبْتُمْ]]","vous êtes allés"],["[[أَنْتُنَّ ذَهَبْتُنَّ]]","vous êtes allées"]]}},{"h":"Quand, avant, après","p":"[[مَتَى]] demande le moment. [[قَبْلَ]] (avant) et [[بَعْدَ]] (après) sont suivis du génitif.","tbl":{"h":["Arabe","Français"],"r":[["[[مَتَى ذَهَبَتْ ؟ ذَهَبَتْ قَبْلَ أُسْبُوعٍ .]]","Quand est-elle partie ? Il y a une semaine."],["[[مَتَى اِخْتِبَارُكُنَّ ؟ اِخْتِبَارُنَا بَعْدَ شَهْرٍ .]]","Quand est votre examen ? Dans un mois."],["[[ذَهَبْتُ إِلَى الْمَسْجِدِ قَبْلَ الْأَذَانِ .]]","Je suis allé à la mosquée avant l'appel à la prière."],["[[ذَهَبْتُ إِلَى الْمَطْعَمِ بَعْدَ الصَّلَاةِ .]]","Je suis allé au restaurant après la prière."]]}}],"err":["Confondre les terminaisons [[ـتَ]] (masculin) et [[ـتِ]] (féminin).","Oublier le génitif après [[قَبْلَ]] / [[بَعْدَ]]."],"rec":["Six pronoms + leurs terminaisons au passé.","[[مَتَى]] quand, [[قَبْلَ]] avant, [[بَعْدَ]] après."]},"16":{"obj":"Parler de plusieurs choses : le pluriel d'un objet se comporte comme un féminin singulier.","secs":[{"h":"La règle d'or","p":"Quand un pluriel désigne des **choses ou des animaux** (غَيْرُ الْعَاقِلِ), tout s'accorde comme avec un féminin singulier : [[هَذِهِ]], [[هِيَ]], adjectif féminin singulier. Pour les **personnes** (الْعَاقِلُ), on utilise [[هَؤُلَاءِ]] et [[هُمْ]].","tbl":{"h":["Personnes","Choses"],"r":[["[[هَذَا طَالِبٌ ← هَؤُلَاءِ طُلَّابٌ]]","[[هَذَا بَيْتٌ ← هَذِهِ بُيُوتٌ]]"],["[[هَذِهِ طَالِبَةٌ ← هَؤُلَاءِ طَالِبَاتٌ]]","[[هَذِهِ سَيَّارَةٌ ← هَذِهِ سَيَّارَاتٌ]]"],["[[ذَلِكَ طَالِبٌ ← أُولَئِكَ طُلَّابٌ]]","[[ذَلِكَ بَيْتٌ ← تِلْكَ بُيُوتٌ]]"],["[[تِلْكَ طَالِبَةٌ ← أُولَئِكَ طَالِبَاتٌ]]","[[تِلْكَ سَيَّارَةٌ ← تِلْكَ سَيَّارَاتٌ]]"]]},"tip":"Choses au pluriel : [[هَذِهِ]] (proche) ou [[تِلْكَ]] (éloigné), et [[هِيَ]] pour « ils / elles »."},{"h":"Exemples","tbl":{"h":["Arabe","Français"],"r":[["[[هِيَ جَمِيلَةٌ جِدًّا .]]","Ils sont très beaux."],["[[هَذَا طَالِبٌ جَدِيدٌ . هُوَ مِنْ بَلْجِيكَا .]]","Ceci est un nouvel étudiant. Il est de Belgique."],["[[هَؤُلَاءِ طُلَّابٌ جُدُدٌ . هُمْ مِنْ بَلْجِيكَا .]]","Ce sont de nouveaux étudiants. Ils sont de Belgique."],["[[هَذِهِ كُتُبٌ جَدِيدَةٌ . هِيَ مِنْ بَلْجِيكَا .]]","Ce sont de nouveaux livres. Ils viennent de Belgique."]]}}],"err":["Utiliser [[هُمْ]] pour des objets : on dit [[هِيَ]].","Accorder l'adjectif au pluriel : on le met au féminin singulier."],"rec":["Pluriel de choses = féminin singulier.","Personnes : [[هَؤُلَاءِ]] / [[هُمْ]] ; choses : [[هَذِهِ]] / [[هِيَ]]."]},"17":{"obj":"Consolider le pluriel des choses avec de nombreux exemples et du vocabulaire.","secs":[{"h":"Rappel : féminin singulier","p":"Un pluriel de choses est accordé au féminin singulier : le verbe, l'adjectif et le pronom ([[هِيَ]]). Apprends chaque pluriel avec son mot.","tbl":{"h":["Arabe","Français"],"r":[["[[أَبْوَابُ الْمَسْجِدِ مَفْتُوحَةٌ .]]","Les portes de la mosquée sont ouvertes."],["[[النُّجُومُ جَمِيلَةٌ .]]","Les étoiles sont belles."],["[[هَذِهِ الدُّرُوسُ سَهْلَةٌ .]]","Ces leçons sont faciles."],["[[فِي الْهِنْدِ لُغَاتٌ كَثِيرَةٌ .]]","En Inde il y a beaucoup de langues."],["[[السَّاعَةُ الْيَابَانِيَّةُ رَخِيصَةٌ .]]","La montre japonaise est bon marché."],["[[هَذِهِ الْحُمُرُ لِلْفَلَّاحِ .]]","Ces ânes sont à l'agriculteur."],["[[أَيْنَ كُتُبُكُنَّ يَا أَخَوَاتُ ؟ هِيَ فِي الْفَصْلِ .]]","Où sont vos livres, mes sœurs ? Ils sont dans la classe."],["[[فِي هَذَا الشَّارِعِ فَنَادِقُ كَبِيرَةٌ .]]","Dans cette rue il y a de grands hôtels."]]}},{"h":"Vocabulaire","tbl":{"h":["Arabe","Français"],"r":[["[[كَثِيرٌ]]","beaucoup, nombreux"]]},"tip":"Pour tout pluriel de chose, l'adjectif est au féminin singulier : [[فَنَادِقُ كَبِيرَةٌ]], jamais [[كَبِيرُونَ]]."}],"err":["Mettre l'adjectif au pluriel d'un nom de chose.","Oublier que le verbe est aussi au féminin singulier."],"rec":["Choses au pluriel → tout au féminin singulier.","Relis les exemples en cachant le français."]},"18":{"obj":"Parler de deux personnes ou objets avec le duel, et demander « combien ? » avec [[كَمْ]].","secs":[{"h":"Former le duel (الْمُثَنَّى)","p":"L'arabe a une forme spéciale pour « deux » : on ajoute [[ـَانِ]] au nom. Pour un nom féminin en [[ـَةٌ]], la lettre [[ة]] devient [[ت]] : [[ـَتَانِ]].","tbl":{"h":["Singulier","Duel","Français"],"r":[["[[كِتَابٌ]]","[[كِتَابَانِ]]","deux livres"],["[[أُخْتٌ]]","[[أُخْتَانِ]]","deux sœurs"],["[[عَجَلَةٌ]]","[[عَجَلَتَانِ]]","deux roues"],["[[عِيدٌ]]","[[عِيدَانِ]]","deux fêtes"],["[[نَافِذَةٌ]]","[[نَافِذَتَانِ]]","deux fenêtres"],["[[مِسْطَرَةٌ]]","[[مِسْطَرَتَانِ]]","deux règles"],["[[أَخٌ]]","[[أَخَوَانِ]]","deux frères"],["[[عَيْنٌ]]","[[عَيْنَانِ]]","deux yeux"],["[[أُذُنٌ]]","[[أُذُنَانِ]]","deux oreilles"],["[[يَدٌ]]","[[يَدَانِ]]","deux mains"],["[[رِجْلٌ]]","[[رِجْلَانِ]]","deux pieds"]]},"tip":"Le duel remplace le tanwin : [[كِتَابٌ]] → [[كِتَابَانِ]]. Attention à [[أَخٌ]] → [[أَخَوَانِ]] : le [[و]] réapparaît. Pour info : au génitif et à l'accusatif, [[ـَانِ]] devient [[ـَيْنِ]] (par exemple [[فِي كِتَابَيْنِ]]), tu le verras plus tard."},{"h":"Demonstratifs et pronom au duel","tbl":{"h":["Arabe","Français"],"r":[["[[هُمَا]]","eux deux / elles deux"],["[[هَذَانِ]]","ces deux (masculin)"],["[[هَاتَانِ]]","ces deux (féminin)"]]}},{"h":"Combien ? كَمْ","p":"[[كَمْ]] est suivi d'un nom au **singulier** terminé par la fatha et le tanwin ([[ـًا]]) : [[كَمْ أَخًا لَكَ ؟]] On répond [[لِي أَخٌ وَاحِدٌ]] ou [[لِي أَخَوَانِ]].","tbl":{"h":["Arabe","Français"],"r":[["[[كَمْ أَخًا لَكَ يَا مُحَمَّدُ ؟ لِي أَخٌ وَاحِدٌ .]]","Combien de frères as-tu, Muhammad ? J'ai un seul frère."],["[[وَكَمْ أُخْتًا لَكَ ؟ لِي أُخْتَانِ .]]","Et combien de sœurs ? J'ai deux sœurs."],["[[كَمْ عَجَلَةً لِلدَّرَّاجَةِ ؟ لَهَا عَجَلَتَانِ .]]","Combien de roues a le vélo ? Il a deux roues."],["[[لِمَنْ هَذَانِ الدَّفْتَرَانِ ؟ هُمَا لِي .]]","À qui sont ces deux cahiers ? Ils sont à moi."],["[[لِي عَيْنَانِ وَأُذُنَانِ وَيَدَانِ وَرِجْلَانِ .]]","J'ai deux yeux, deux oreilles, deux mains et deux pieds."],["[[خَالِدٌ لَهُ ابْنَانِ وَبِنْتَانِ .]]","Khalid a deux fils et deux filles."]]}}],"err":["Dire « deux livres » avec un nombre et un pluriel : on utilise le duel, [[كِتَابَانِ]].","Mettre le nom au pluriel après [[كَمْ]] : il reste au singulier."],"rec":["Duel : nom + [[ـَانِ]] (féminin en [[ة]] : [[ـَتَانِ]]).","[[كَمْ]] + singulier accusatif.","[[هُمَا]], [[هَذَانِ]], [[هَاتَانِ]]."]},"19":{"obj":"Compter de 3 à 10 avec un nom masculin.","secs":[{"h":"La règle","p":"De 3 à 10, le nombre est suivi d'un **pluriel au génitif**, et le genre du nombre est **inversé** par rapport au nom compté. Avec un nom **masculin**, le nombre prend la [[ة]] : [[ثَلَاثَةُ طُلَّابٍ]]. « Un » se place après le nom, comme un adjectif : [[كِتَابٌ وَاحِدٌ]] ; « deux » s'exprime avec le duel : [[كِتَابَانِ]] (leçon 18). Après [[كَمْ]], le nom est au singulier accusatif : [[كَمْ طَالِبًا ؟]]","tbl":{"h":["Chiffre","Arabe","Exemple"],"r":[["٣","[[ثَلَاثَةُ]]","[[ثَلَاثَةُ طُلَّابٍ]]"],["٤","[[أَرْبَعَةُ]]","[[أَرْبَعَةُ طُلَّابٍ]]"],["٥","[[خَمْسَةُ]]","[[خَمْسَةُ طُلَّابٍ]]"],["٦","[[سِتَّةُ]]","[[سِتَّةُ طُلَّابٍ]]"],["٧","[[سَبْعَةُ]]","[[سَبْعَةُ طُلَّابٍ]]"],["٨","[[ثَمَانِيَةُ]]","[[ثَمَانِيَةُ طُلَّابٍ]]"],["٩","[[تِسْعَةُ]]","[[تِسْعَةُ طُلَّابٍ]]"],["١٠","[[عَشَرَةُ]]","[[عَشَرَةُ طُلَّابٍ]]"]]},"tip":"Moyen mnémotechnique : « masculin → nombre en [[ة]] ». Le nombre prend le genre contraire du nom."},{"h":"Exemples","tbl":{"h":["Arabe","Français"],"r":[["[[فِيهِ عَشَرَةُ طُلَّابٍ جُدُدٍ .]]","Il y a dix nouveaux étudiants."],["[[فِيهِ ثَلَاثَةُ طُلَّابٍ مِنَ الْفِلِبِّينِ وَأَرْبَعَةُ طُلَّابٍ مِنَ الْيَابَانِ .]]","Il y a trois étudiants des Philippines et quatre du Japon."],["[[فِيهِ سَبْعَةُ طُلَّابٍ مِنْ أَمْرِيكَا .]]","Il y a sept étudiants d'Amérique."],["[[عِنْدِي خَمْسَةُ كُتُبٍ وَثَلَاثَةُ أَقْلَامٍ .]]","J'ai cinq livres et trois stylos."],["[[خَالِدٌ لَهُ سِتَّةُ أَبْنَاءٍ .]]","Khalid a six fils."],["[[لِي أَرْبَعَةُ إِخْوَةٍ .]]","J'ai quatre frères."],["[[فِي الْأُسْبُوعِ سَبْعَةُ أَيَّامٍ .]]","Dans la semaine il y a sept jours."],["[[فِي هَذَا الْكِتَابِ عَشَرَةُ دُرُوسٍ .]]","Dans ce livre il y a dix leçons."]]}}],"err":["Mettre le nom compté au singulier : après 3 à 10, c'est un pluriel.","Oublier la kasra sur le nom compté (génitif).","Appliquer la règle d'accord habituelle : ici le genre est inversé."],"rec":["3 à 10 + pluriel au génitif.","Nom masculin → nombre avec [[ة]].","[[كَمْ]] + singulier accusatif."]},"20":{"obj":"Compter de 3 à 10 avec un nom féminin, et lire les chiffres arabes.","secs":[{"h":"La règle inversée","p":"Avec un nom **féminin**, le nombre perd la [[ة]] : [[ثَلَاثُ طَالِبَاتٍ]]. Le nom compté reste un pluriel au génitif. Après [[كَمْ]], le nom est au singulier accusatif : [[كَمْ أُخْتًا ؟]]","tbl":{"h":["Chiffre","Arabe","Exemple"],"r":[["٣","[[ثَلَاثُ]]","[[ثَلَاثُ طَالِبَاتٍ]]"],["٤","[[أَرْبَعُ]]","[[أَرْبَعُ طَالِبَاتٍ]]"],["٥","[[خَمْسُ]]","[[خَمْسُ طَالِبَاتٍ]]"],["٦","[[سِتُّ]]","[[سِتُّ طَالِبَاتٍ]]"],["٧","[[سَبْعُ]]","[[سَبْعُ طَالِبَاتٍ]]"],["٨","[[ثَمَانِي]]","[[ثَمَانِي طَالِبَاتٍ]]"],["٩","[[تِسْعُ]]","[[تِسْعُ طَالِبَاتٍ]]"],["١٠","[[عَشْرُ]]","[[عَشْرُ طَالِبَاتٍ]]"]]},"tip":"Masculin → [[ثَلَاثَةُ]] (avec [[ة]]). Féminin → [[ثَلَاثُ]] (sans [[ة]])."},{"h":"Les chiffres arabes","p":"Les chiffres s'écrivent ٠ ١ ٢ ٣ ٤ ٥ ٦ ٧ ٨ ٩ (0 à 9). Les mots s'écrivent de droite à gauche, mais les nombres se lisent de gauche à droite : ١٢٣ = 123.","tbl":{"h":["Chiffre","Valeur"],"r":[["٠","0"],["١","1"],["٢","2"],["٣","3"],["٤","4"],["٥","5"],["٦","6"],["٧","7"],["٨","8"],["٩","9"]]}},{"h":"Exemples","tbl":{"h":["Arabe","Français"],"r":[["[[فِي فَصْلِنَا خَمْسُ طَالِبَاتٍ مِنَ الصِّينِ وَأَرْبَعُ طَالِبَاتٍ مِنَ الْيَابَانِ .]]","Dans notre classe il y a cinq étudiantes de Chine et quatre du Japon."],["[[لِي ثَلَاثُ أَخَوَاتٍ وَخَمْسَةُ إِخْوَةٍ .]]","J'ai trois sœurs et cinq frères."],["[[لِي أَرْبَعَةُ إِخْوَةٍ وَأَرْبَعُ أَخَوَاتٍ .]]","J'ai quatre frères et quatre sœurs."],["[[لَنَا أَرْبَعَةُ أَعْمَامٍ وَخَمْسُ عَمَّاتٍ .]]","Nous avons quatre oncles paternels et cinq tantes paternelles."],["[[فِي بَلَدِي خَمْسُ جَامِعَاتٍ .]]","Dans mon pays il y a cinq universités."],["[[فِي ذَلِكَ الدَّرْسِ ثَمَانِي كَلِمَاتٍ جَدِيدَةٍ .]]","Dans cette leçon il y a huit mots nouveaux."]]}}],"err":["Garder la [[ة]] du nombre devant un nom féminin.","Se fier au sens : le genre se juge sur le **singulier** du nom compté. [[دَرْسٌ]] (leçon) est masculin, donc « dix leçons » = [[عَشَرَةُ دُرُوسٍ]] (leçon 19)."],"rec":["Nom féminin → nombre sans [[ة]].","Les chiffres ٠–٩ ; les nombres se lisent de gauche à droite.","Pour choisir, regarde le genre du **singulier** du nom compté."]},"21":{"obj":"Lire un texte suivi, « Mon école », en réutilisant nombres, duel, pluriels de choses et suffixes.","secs":[{"h":"Nouveaux mots","tbl":{"h":["Arabe","Français"],"r":[["[[ذَاكَ]]","cela (= [[ذَلِكَ]])"],["[[وَلَكِنْ]]","mais"],["[[ـهُمْ]]","leur (suffixe)"]]}},{"h":"Le texte « مَدْرَسَتِي » (Mon école)","p":"Lis-le à voix haute, puis traduis phrase par phrase. Repère le duel ([[نَافِذَتَانِ]]), le nombre ([[ثَلَاثَةُ أَبْوَابٍ]]) et le suffixe [[ـهُمْ]].","tbl":{"h":["Arabe","Français"],"r":[["[[هَذِهِ مَدْرَسَتِي . هِيَ قَرِيبَةٌ مِنَ الْمَسْجِدِ .]]","Ceci est mon école. Elle est près de la mosquée."],["[[هِيَ مَدْرَسَةٌ كَبِيرَةٌ لَهَا ثَلَاثَةُ أَبْوَابٍ .]]","C'est une grande école qui a trois portes."],["[[فِي فَصْلِنَا نَافِذَتَانِ كَبِيرَتَانِ وَسَبُّورَةٌ كَبِيرَةٌ .]]","Dans notre classe il y a deux grandes fenêtres et un grand tableau."],["[[هَذَا مَكْتَبُ الْمُدَرِّسِ وَذَاكَ كُرْسِيُّهُ .]]","Ceci est le bureau de l'enseignant et cela est sa chaise."],["[[وَتِلْكَ مَكَاتِبُ الطُّلَّابِ وَكَرَاسِيُّهُمْ .]]","Et ce sont les bureaux des étudiants et leurs chaises."],["[[فِي فَصْلِنَا عَشَرَةُ طُلَّابٍ .]]","Dans notre classe il y a dix étudiants."],["[[هُمْ مِنْ أَمْرِيكَا وَالْيَابَانِ وَالصِّينِ .]]","Ils viennent d'Amérique, du Japon et de Chine."],["[[وَلَكِنْ دِينُهُمْ وَاحِدٌ . رَبُّهُمْ وَاحِدٌ .]]","Mais leur religion est une. Leur Seigneur est un."],["[[هُمْ مُسْلِمُونَ . وَالْمُسْلِمُونَ إِخْوَةٌ .]]","Ils sont musulmans. Et les musulmans sont frères."]]}}],"err":["Lire sans comprendre : traduis chaque phrase de tête."],"rec":["Relis le texte trois fois à voix haute.","Cache la traduction et traduis de tête."]},"22":{"obj":"Apprendre les couleurs, [[قَالَ]] / [[قَالَتْ]] et les mots qui n'ont pas de tanwin.","secs":[{"h":"Les couleurs (masculin)","tbl":{"h":["Arabe","Français"],"r":[["[[أَبْيَضُ]]","blanc"],["[[أَسْوَدُ]]","noir"],["[[أَحْمَرُ]]","rouge"],["[[أَخْضَرُ]]","vert"],["[[أَزْرَقُ]]","bleu"],["[[أَصْفَرُ]]","jaune"]]},"tip":"Ces adjectifs n'ont pas de tanwin : on dit [[قَلَمٌ أَحْمَرُ]] (stylo rouge). Au féminin ils changent de forme ([[حَمْرَاءُ]], [[بَيْضَاءُ]]…), tu les verras plus tard."},{"h":"Dire : قَالَ / قَالَتْ","p":"[[قَالَ]] = il a dit, [[قَالَتْ]] = elle a dit. On les place avant le nom.","tbl":{"h":["Arabe","Français"],"r":[["[[قَالَ يُوسُفُ : عِنْدِي خَمْسَةُ أَقْلَامٍ : هَذَا قَلَمٌ أَحْمَرُ وَهَذَا قَلَمٌ أَزْرَقُ .]]","Youssouf a dit : j'ai cinq stylos : celui-ci est rouge, celui-ci est bleu."],["[[قَالَتْ زَيْنَبُ : عِنْدِي مَنَادِيلُ كَثِيرَةٌ .]]","Zaynab a dit : j'ai beaucoup de mouchoirs."],["[[قَالَتْ لَهَا فَاطِمَةُ : أَعِنْدَكِ مِنْدِيلٌ أَخْضَرُ ؟ قَالَتْ : لَا .]]","Fatima lui a dit : as-tu un mouchoir vert ? Elle a dit : non."]]}},{"h":"Mots sans tanwin (مَمْنُوعٌ مِنَ الصَّرْفِ)","p":"Certains mots ne prennent jamais de tanwin : on écrit [[زَيْنَبُ]] et non [[زَيْنَبٌ]]. Voici les types à reconnaître.","tbl":{"h":["Type de mot","Exemples"],"r":[["Prénoms féminins","[[زَيْنَبُ ، مَرْيَمُ ، فَاطِمَةُ ، عَائِشَةُ]]"],["Villes","[[مَكَّةُ ، جُدَّةُ]]"],["Prénoms masculins en [[ة]]","[[حَمْزَةُ ، أُسَامَةُ ، مُعَاوِيَةُ ، طَلْحَةُ]]"],["Prénoms en [[ـَانُ]]","[[عُثْمَانُ ، عَفَّانُ ، سُفْيَانُ ، مَرْوَانُ]]"],["Couleurs et comparatifs","[[أَبْيَضُ ، أَسْوَدُ ، أَحْمَرُ ، أَكْبَرُ ، أَسْعَدُ]]"],["Noms étrangers","[[وِلْيَمُ ، إِدْوَرْدُ ، لَنْدَنُ ، بَارِيسُ ، بَغْدَادُ]]"],["Certains pluriels irréguliers","[[أَصْدِقَاءُ ، مَسَاجِدُ ، مَدَارِسُ ، مَفَاتِيحُ ، فَنَاجِينُ]]"]]}}],"err":["Ajouter un tanwin à [[زَيْنَبُ]], [[مَسَاجِدُ]] ou [[أَحْمَرُ]].","Oublier [[تْ]] dans [[قَالَتْ]] quand le sujet est féminin."],"rec":["Couleurs masculines : [[أَبْيَضُ]] [[أَسْوَدُ]] [[أَحْمَرُ]] [[أَخْضَرُ]] [[أَزْرَقُ]] [[أَصْفَرُ]].","Pas de tanwin pour les prénoms féminins, villes, couleurs, comparatifs et beaucoup de pluriels brisés."]},"23":{"obj":"Lire un dialogue en classe et distinguer le génitif d'un nom ordinaire (kasra + tanwin) de celui d'un nom sans tanwin (fatha).","secs":[{"h":"Kasra avec tanwin ou fatha sans tanwin","p":"Après une préposition ou en annexion, un nom ordinaire prend la **kasra avec tanwin** : [[مِنْ مُحَمَّدٍ]]. Un nom qui n'a pas de tanwin prend la **fatha** (seule) : [[مِنْ زَيْنَبَ]]. Dans les deux cas c'est le génitif ; seule la voyelle change.","tbl":{"h":["Nom ordinaire","Nom sans tanwin"],"r":[["[[مِنْ مُحَمَّدٍ]]","[[مِنْ زَيْنَبَ]]"],["[[إِلَى مُحَمَّدٍ]]","[[إِلَى زَيْنَبَ]]"],["[[لِمُحَمَّدٍ]]","[[لِزَيْنَبَ]]"],["[[كِتَابُ مُحَمَّدٍ]]","[[كِتَابُ زَيْنَبَ]]"]]},"tip":"Pour savoir quelle voyelle mettre, demande-toi : ce nom peut-il avoir un tanwin ? Prénoms féminins et villes : jamais."},{"h":"Petits mots","tbl":{"h":["Arabe","Français"],"r":[["[[هَاتِ]]","donne !"],["[[مِنْ / إِلَى / لِ / فِي]]","prépositions suivies du génitif"]]}},{"h":"Exemples","tbl":{"h":["Arabe","Français"],"r":[["[[هَذَا الْكِتَابُ لِمُحَمَّدٍ وَذَلِكَ لِزَيْنَبَ .]]","Ce livre est à Muhammad et celui-là à Zaynab."],["[[ذَهَبَ خَالِدٌ إِلَى أَحْمَدَ .]]","Khalid est allé chez Ahmad."],["[[ذَهَبَ أَبِي إِلَى مَكَّةَ وَذَهَبَ عَمِّي إِلَى جُدَّةَ .]]","Mon père est allé à La Mecque et mon oncle à Djeddah."],["[[أَيْنَ زَوْجُ خَدِيجَةَ ؟ هُوَ فِي لَنْدَنَ .]]","Où est le mari de Khadija ? Il est à Londres."],["[[أَأَنْتَ مِنْ مَكَّةَ ؟ لَا . أَنَا مِنَ الطَّائِفِ .]]","Es-tu de La Mecque ? Non. Je suis de Taëf."],["[[الْبَيْتُ الْحَرَامُ فِي مَكَّةَ .]]","La Maison sacrée est à La Mecque."]]}}],"err":["Mettre un tanwin sur [[مَكَّةَ]] ou [[زَيْنَبَ]] après une préposition.","Mettre la fatha sur un nom ordinaire : [[مِنْ مُ َ]] placé avant le verbe insiste : « Toi seul, et personne d'autre ».","Présent à la première personne du pluriel : le préfixe [[نَ]] dans [[نَعْبُدُ]] et [[نَسْتَعِينُ]] veut dire « nous ».","Arrêt en fin de verset : la voyelle finale disparaît, on s'arrête sur la consonne : [[الْعَالَمِينَ]] se termine sur [[نْ]]."],"v":[{"a":"بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيمِ","f":"Au nom d'Allah, le Tout Miséricordieux, le Très Miséricordieux.","w":[["بِسْمِ","au nom de"],["اللَّهِ","Allah"],["الرَّحْمَنِ","le Tout Miséricordieux"],["الرَّحِيمِ","le Très Miséricordieux"]]},{"a":"الْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ","f":"Louange à Allah, Seigneur des mondes.","w":[["الْحَمْدُ","la louange"],["لِلَّهِ","à Allah"],["رَبِّ","Seigneur de"],["الْعَالَمِينَ","les mondes"]]},{"a":"الرَّحْمَنِ الرَّحِيمِ","f":"Le Tout Miséricordieux, le Très Miséricordieux.","w":[["الرَّحْمَنِ","le Tout Miséricordieux"],["الرَّحِيمِ","le Très Miséricordieux"]]},{"a":"مَالِكِ يَوْمِ الدِّينِ","f":"Maître du jour de la rétribution.","w":[["مَالِكِ","maître de"],["يَوْمِ","jour de"],["الدِّينِ","la rétribution"]]},{"a":"إِيَّاكَ نَعْبُدُ وَإِيَّاكَ نَسْتَعِينُ","f":"C'est Toi seul que nous adorons, et c'est Toi seul dont nous demandons l'aide.","w":[["إِيَّاكَ","c'est Toi (seul)"],["نَعْبُدُ","nous adorons"],["وَإِيَّاكَ","et c'est Toi (seul)"],["نَسْتَعِينُ","nous demandons de l'aide"]]},{"a":"اهْدِنَا الصِّرَاطَ الْمُسْتَقِيمَ","f":"Guide-nous dans le droit chemin.","w":[["اهْدِنَا","guide-nous"],["الصِّرَاطَ","le chemin"],["الْمُسْتَقِيمَ","droit"]]},{"a":"صِرَاطَ الَّذِينَ أَنْعَمْتَ عَلَيْهِمْ غَيْرِ الْمَغْضُوبِ عَلَيْهِمْ وَلَا الضَّالِّينَ","f":"Le chemin de ceux que Tu as comblés de bienfaits, non de ceux qui ont encouru Ta colère, ni des égarés.","w":[["صِرَاطَ","chemin de"],["الَّذِينَ","ceux qui"],["أَنْعَمْتَ","Tu as comblé de bienfaits"],["عَلَيْهِمْ","sur eux"],["غَيْرِ","non, autre que"],["الْمَغْضُوبِ","celui qui a encouru la colère"],["وَلَا","et pas"],["الضَّالِّينَ","les égarés"]]}]},{"n":112,"ar":"الْإِخْلَاصُ","fr":"Le Monothéisme pur","rev":"Mecquoise","th":"L'unicité d'Allah en quatre versets. Elle équivaut au tiers du Coran en mérite, selon un hadith authentique.","r":["[[قُلْ]] est un impératif : « dis ». Il vient de [[قَالَ]].","[[لَمْ]] + verbe au présent donne un passé négatif : [[يَلِدُ]] → [[لَمْ يَلِدْ]]. Le verbe se termine par un soukoun.","Voix passive : [[يُولَدُ]] « il est engendré », de [[يَلِدُ]] « il engendre ». Le préfixe prend la damma.","L'écho : les lettres [[ق ط ب ج د]] rebondissent légèrement quand elles portent un soukoun ou à l'arrêt. C'est le cas du [[د]] de [[أَحَدٌ]] et de [[الصَّمَدُ]].","Arrêt sur [[أَحَدٌ]] : le tanwin disparaît, on s'arrête sur [[د]]."],"v":[{"a":"قُلْ هُوَ اللَّهُ أَحَدٌ","f":"Dis : Il est Allah, Unique.","w":[["قُلْ","dis"],["هُوَ","Il est"],["اللَّهُ","Allah"],["أَحَدٌ","unique"]]},{"a":"اللَّهُ الصَّمَدُ","f":"Allah, l'Absolu, vers qui tous se tournent dans leurs besoins.","w":[["اللَّهُ","Allah"],["الصَّمَدُ","celui vers qui tous se tournent"]]},{"a":"لَمْ يَلِدْ وَلَمْ يُولَدْ","f":"Il n'a pas engendré et n'a pas été engendré.","w":[["لَمْ","ne… pas"],["يَلِدْ","il a engendré"],["وَلَمْ","et ne… pas"],["يُولَدْ","il a été engendré"]]},{"a":"وَلَمْ يَكُنْ لَهُ كُفُوًا أَحَدٌ","f":"Et nul n'est égal à Lui.","w":[["وَلَمْ","et ne… pas"],["يَكُنْ","il est"],["لَهُ","à Lui"],["كُفُوًا","égal"],["أَحَدٌ","personne"]]}]},{"n":113,"ar":"الْفَلَقُ","fr":"L'Aube naissante","rev":"Mecquoise","th":"Une demande de protection contre quatre sortes de maux.","r":["[[بِرَبِّ]] = [[بِ]] + [[رَبِّ]] : la préposition [[بِ]] est suivie du génitif, comme [[مِنْ]] dans [[مِنْ شَرِّ]].","[[شَرِّ]] est le premier terme d'une annexion : « le mal de… ». Il n'a ni [[الْ]] ni tanwin, et le mot suivant est au génitif.","[[أَعُوذُ]] vient de [[عَاذَ]] : le préfixe [[أَ]] veut dire « je ».","[[إِذَا]] est suivi d'un verbe au passé, mais le sens est « quand il (elle) fait ».","L'écho sur le [[ق]] final de [[الْفَلَقِ]], [[خَلَقَ]], [[وَقَبَ]] ([[ب]]) et [[حَسَدَ]] ([[د]]) à l'arrêt."],"v":[{"a":"قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ","f":"Dis : Je cherche refuge auprès du Seigneur de l'aube.","w":[["قُلْ","dis"],["أَعُوذُ","je cherche refuge"],["بِرَبِّ","auprès du Seigneur de"],["الْفَلَقِ","l'aube"]]},{"a":"مِنْ شَرِّ مَا خَلَقَ","f":"Contre le mal de ce qu'Il a créé.","w":[["مِنْ","contre, de"],["شَرِّ","le mal de"],["مَا","ce que"],["خَلَقَ","Il a créé"]]},{"a":"وَمِنْ شَرِّ غَاسِقٍ إِذَا وَقَبَ","f":"Et contre le mal de l'obscurité quand elle s'installe.","w":[["وَمِنْ","et contre"],["شَرِّ","le mal de"],["غَاسِقٍ","obscurité, nuit"],["إِذَا","quand"],["وَقَبَ","elle s'installe"]]},{"a":"وَمِنْ شَرِّ النَّفَّاثَاتِ فِي الْعُقَدِ","f":"Et contre le mal de celles qui soufflent sur les nœuds.","w":[["النَّفَّاثَاتِ","celles qui soufflent"],["فِي","dans, sur"],["الْعُقَدِ","les nœuds"]]},{"a":"وَمِنْ شَرِّ حَاسِدٍ إِذَا حَسَدَ","f":"Et contre le mal de l'envieux quand il envie.","w":[["حَاسِدٍ","envieux"],["إِذَا","quand"],["حَسَدَ","il envie"]]}]},{"n":114,"ar":"النَّاسُ","fr":"Les Hommes","rev":"Mecquoise","th":"Un refuge auprès d'Allah contre le chuchoteur qui se dérobe.","r":["Trois noms d'Allah en annexion avec [[النَّاسِ]] : [[رَبِّ]], [[مَلِكِ]], [[إِلَهِ]]. Le mot [[النَّاسِ]] est chaque fois au génitif.","[[النَّاسِ]] commence par [[ن]] : lettre solaire. Le [[ل]] de [[الْ]] ne se prononce pas et le [[ن]] est doublé.","[[الَّذِي]] relie la description au nom défini qui précède : [[الْوَسْوَاسِ الْخَنَّاسِ]] « le chuchoteur qui se dérobe », puis « qui souffle… ».","[[مِنَ الْجِنَّةِ]] : devant [[الْ]], [[مِنْ]] devient [[مِنَ]].","Adjectifs [[الْوَسْوَاسِ]] et [[الْخَنَّاسِ]] : forme intensive, qui exprime une action répétée."],"v":[{"a":"قُلْ أَعُوذُ بِرَبِّ النَّاسِ","f":"Dis : Je cherche refuge auprès du Seigneur des hommes.","w":[["قُلْ","dis"],["أَعُوذُ","je cherche refuge"],["بِرَبِّ","auprès du Seigneur de"],["النَّاسِ","les hommes"]]},{"a":"مَلِكِ النَّاسِ","f":"Roi des hommes.","w":[["مَلِكِ","roi de"],["النَّاسِ","les hommes"]]},{"a":"إِلَهِ النَّاسِ","f":"Dieu des hommes.","w":[["إِلَهِ","dieu de"]]},{"a":"مِنْ شَرِّ الْوَسْوَاسِ الْخَنَّاسِ","f":"Contre le mal du chuchoteur qui se dérobe.","w":[["مِنْ","contre"],["شَرِّ","le mal de"],["الْوَسْوَاسِ","le chuchoteur"],["الْخَنَّاسِ","celui qui se dérobe"]]},{"a":"الَّذِي يُوَسْوِسُ فِي صُدُورِ النَّاسِ","f":"Qui souffle le mal dans les poitrines des hommes.","w":[["الَّذِي","qui"],["يُوَسْوِسُ","il souffle des suggestions"],["فِي","dans"],["صُدُورِ","poitrines de"]]},{"a":"مِنَ الْجِنَّةِ وَالنَّاسِ","f":"Qu'il soit parmi les djinns ou parmi les hommes.","w":[["مِنَ","parmi"],["الْجِنَّةِ","les djinns"],["وَالنَّاسِ","et les hommes"]]}]},{"n":108,"ar":"الْكَوْثَرُ","fr":"L'Abondance","rev":"Mecquoise","th":"La plus courte sourate : un bienfait immense, une consigne et une promesse.","r":["[[إِنَّا]] = [[إِنَّ]] + [[نَا]] : « certes Nous ». Allah parle de Lui-même au pluriel de majesté.","[[أَعْطَيْنَاكَ]] : verbe au passé + [[نَا]] (Nous) + [[كَ]] (à toi).","[[فَصَلِّ]] et [[وَانْحَرْ]] sont des impératifs. Le sukun final de [[وَانْحَرْ]] est celui de l'impératif.","[[لِرَبِّكَ]] = [[لِ]] + [[رَبِّ]] + [[كَ]] : « pour ton Seigneur ».","[[هُوَ]] placé avant [[الْأَبْتَرُ]] renforce : « c'est lui, et nul autre, qui… »."],"v":[{"a":"إِنَّا أَعْطَيْنَاكَ الْكَوْثَرَ","f":"Nous t'avons certes donné l'Abondance.","w":[["إِنَّا","certes Nous"],["أَعْطَيْنَاكَ","Nous t'avons donné"],["الْكَوْثَرَ","l'Abondance"]]},{"a":"فَصَلِّ لِرَبِّكَ وَانْحَرْ","f":"Prie donc pour ton Seigneur et sacrifie.","w":[["فَصَلِّ","prie donc"],["لِرَبِّكَ","pour ton Seigneur"],["وَانْحَرْ","et sacrifie"]]},{"a":"إِنَّ شَانِئَكَ هُوَ الْأَبْتَرُ","f":"C'est celui qui te hait qui est sans postérité.","w":[["إِنَّ","certes"],["شَانِئَكَ","celui qui te hait"],["هُوَ","c'est lui"],["الْأَبْتَرُ","le coupé de toute postérité"]]}]},{"n":103,"ar":"الْعَصْرُ","fr":"Le Temps","rev":"Mecquoise","th":"Quatre conditions pour échapper à la perte : la foi, les bonnes œuvres, la vérité, l'endurance.","r":["[[وَ]] au début de [[وَالْعَصْرِ]] est le [[و]] du serment : « par… ». Le mot suivant est au génitif.","[[لَفِي]] : le [[لَ]] renforce la phrase. [[فِي خُسْرٍ]] : [[فِي]] + génitif.","[[إِلَّا]] veut dire « sauf » : elle ouvre l'exception du verset 3.","Verbes au passé, 3e personne du pluriel : [[آمَنُوا]], [[عَمِلُوا]], [[تَوَاصَوْا]]. Le [[ا]] final après [[و]] ne se prononce pas.","Pluriel sain féminin : [[الصَّالِحَاتِ]] ([[ـَاتٌ]]), vu à la leçon 13.","Lettre lunaire : [[الْحَقِّ]] (le lām se prononce). Lettres solaires : [[الصَّالِحَاتِ]] et [[الصَّبْرِ]] (le lām est absorbé)."],"v":[{"a":"وَالْعَصْرِ","f":"Par le temps !","w":[["وَ","par"],["الْعَصْرِ","le temps"]]},{"a":"إِنَّ الْإِنْسَانَ لَفِي خُسْرٍ","f":"Certes, l'homme est en perdition.","w":[["إِنَّ","certes"],["الْإِنْسَانَ","l'homme"],["لَفِي","assurément dans"],["خُسْرٍ","perte"]]},{"a":"إِلَّا الَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَاتِ وَتَوَاصَوْا بِالْحَقِّ وَتَوَاصَوْا بِالصَّبْرِ","f":"Sauf ceux qui ont cru, ont fait de bonnes œuvres, se sont recommandé la vérité et se sont recommandé l'endurance.","w":[["إِلَّا","sauf"],["الَّذِينَ","ceux qui"],["آمَنُوا","ils ont cru"],["وَعَمِلُوا","et ils ont fait"],["الصَّالِحَاتِ","les bonnes œuvres"],["وَتَوَاصَوْا","et ils se sont recommandé"],["بِالْحَقِّ","la vérité"],["بِالصَّبْرِ","l'endurance"]]}]},{"n":110,"ar":"النَّصْرُ","fr":"Le Secours","rev":"Médinoise","th":"L'annonce de la victoire et la réponse qui convient : glorifier et demander pardon.","r":["[[إِذَا]] introduit une condition : « lorsque… ». Les verbes passés se traduisent au futur.","[[نَصْرُ اللَّهِ]] : annexion. Le premier terme n'a ni [[الْ]] ni tanwin, [[اللَّهِ]] est au génitif.","[[رَأَيْتَ]] : [[تَ]] = tu. [[النَّاسَ]] est complément d'objet, donc à l'accusatif (fatha).","[[يَدْخُلُونَ]] : présent, pluriel masculin : [[ـُونَ]].","[[تَوَّابًا]] : tanwin fatha. À l'arrêt, le tanwin devient un alif long : on s'arrête sur [[تَوَّابَا]].","[[وَاسْتَغْفِرْهُ]] : impératif + [[هُ]] (lui). Le [[ه]] est le suffixe de la 3e personne du masculin."],"v":[{"a":"إِذَا جَاءَ نَصْرُ اللَّهِ وَالْفَتْحُ","f":"Lorsque viendront le secours d'Allah et la victoire,","w":[["إِذَا","lorsque"],["جَاءَ","est venu"],["نَصْرُ","le secours de"],["اللَّهِ","Allah"],["وَالْفَتْحُ","et la victoire"]]},{"a":"وَرَأَيْتَ النَّاسَ يَدْخُلُونَ فِي دِينِ اللَّهِ أَفْوَاجًا","f":"et que tu verras les gens entrer en foules dans la religion d'Allah,","w":[["وَرَأَيْتَ","et tu as vu"],["النَّاسَ","les gens"],["يَدْخُلُونَ","ils entrent"],["فِي","dans"],["دِينِ","religion de"],["أَفْوَاجًا","par troupes"]]},{"a":"فَسَبِّحْ بِحَمْدِ رَبِّكَ وَاسْتَغْفِرْهُ إِنَّهُ كَانَ تَوَّابًا","f":"glorifie alors ton Seigneur par Sa louange et demande-Lui pardon. Il est Celui qui accueille le repentir.","w":[["فَسَبِّحْ","glorifie donc"],["بِحَمْدِ","par la louange de"],["رَبِّكَ","ton Seigneur"],["وَاسْتَغْفِرْهُ","et demande-Lui pardon"],["إِنَّهُ","car Il"],["كَانَ","est (a toujours été)"],["تَوَّابًا","grand accueillant du repentir"]]}]},{"n":111,"ar":"الْمَسَدُ","fr":"Les Fibres","rev":"Mecquoise","th":"Le sort d'Abou Lahab, oncle du Prophète, et de sa femme.","r":["[[يَدَا]] est un duel (leçon 18) : « les deux mains ». Il se termine par [[ـَا]] au lieu de [[ـَانِ]] parce qu'il est premier terme d'une annexion.","[[أَبِي لَهَبٍ]] : [[أَبُو]] (père de) devient [[أَبِي]] au génitif, car il suit annexion (leçon 10 : [[أَبٌ]] → [[أَبُوكَ]]).","[[مَالُهُ]] : [[مَالٌ]] + suffixe [[ـهُ]] (son). Le tanwin disparaît.","[[ذَاتَ]] est le féminin de [[ذُو]] : « qui possède ». Il est suivi du génitif.","[[سَيَصْلَى]] : [[سَـ]] devant le présent annonce le futur proche.","L'écho dans [[تَبَّ]] à l'arrêt : le [[ب]] rebondit."],"v":[{"a":"تَبَّتْ يَدَا أَبِي لَهَبٍ وَتَبَّ","f":"Que périssent les deux mains d'Abou Lahab, et qu'il périsse lui-même.","w":[["تَبَّتْ","ont péri"],["يَدَا","les deux mains de"],["أَبِي","père de"],["لَهَبٍ","flamme"],["وَتَبَّ","et il a péri"]]},{"a":"مَا أَغْنَى عَنْهُ مَالُهُ وَمَا كَسَبَ","f":"Sa richesse et ce qu'il a acquis ne lui serviront à rien.","w":[["مَا أَغْنَى","n'a pas servi"],["عَنْهُ","à lui"],["مَالُهُ","sa richesse"],["وَمَا","et ce que"],["كَسَبَ","il a acquis"]]},{"a":"سَيَصْلَى نَارًا ذَاتَ لَهَبٍ","f":"Il brûlera dans un feu plein de flammes.","w":[["سَيَصْلَى","il brûlera"],["نَارًا","un feu"],["ذَاتَ","qui possède"],["لَهَبٍ","flamme"]]},{"a":"وَامْرَأَتُهُ حَمَّالَةَ الْحَطَبِ","f":"Et sa femme, la porteuse de bois.","w":[["وَامْرَأَتُهُ","et sa femme"],["حَمَّالَةَ","porteuse de"],["الْحَطَبِ","le bois"]]},{"a":"فِي جِيدِهَا حَبْلٌ مِنْ مَسَدٍ","f":"À son cou, une corde de fibres tressées.","w":[["فِي","à, dans"],["جِيدِهَا","son cou"],["حَبْلٌ","corde"],["مِنْ","de"],["مَسَدٍ","fibres tressées"]]}]},{"n":109,"ar":"الْكَافِرُونَ","fr":"Les Mécréants","rev":"Mecquoise","th":"La séparation nette entre l'adoration d'Allah seul et ce que les autres adorent.","r":["[[لَا]] + présent = négation : [[لَا أَعْبُدُ]] « je n'adore pas ».","Pronoms et verbes : [[أَعْبُدُ]] (je), [[تَعْبُدُونَ]] (vous), [[عَبَدْتُمْ]] (vous avez, au passé).","[[عَابِدُونَ]] est un pluriel sain masculin ([[ـُونَ]]). [[عَابِدٌ]] est le singulier.","[[لَكُمْ]] et [[وَلِيَ]] : [[لِ]] + suffixe. [[لِي]] devient [[لِيَ]] avec un [[و]] devant.","[[دِينُكُمْ]] : suffixe [[ـكُمْ]] (votre), leçon 14. Dans [[دِينِ]], le [[ي]] du suffixe « mon / ma » est omis en fin de verset : la kasra le remplace ([[دِينِي]] → [[دِينِ]]).","[[مَا]] veut dire « ce que » ici, pas « quoi ? »."],"v":[{"a":"قُلْ يَا أَيُّهَا الْكَافِرُونَ","f":"Dis : Ô vous les mécréants !","w":[["قُلْ","dis"],["يَا أَيُّهَا","ô (vous)"],["الْكَافِرُونَ","les mécréants"]]},{"a":"لَا أَعْبُدُ مَا تَعْبُدُونَ","f":"Je n'adore pas ce que vous adorez.","w":[["لَا","ne… pas"],["أَعْبُدُ","j'adore"],["مَا","ce que"],["تَعْبُدُونَ","vous adorez"]]},{"a":"وَلَا أَنْتُمْ عَابِدُونَ مَا أَعْبُدُ","f":"Et vous n'êtes pas adorateurs de ce que j'adore.","w":[["وَلَا","et ne… pas"],["أَنْتُمْ","vous"],["عَابِدُونَ","adorateurs"],["مَا أَعْبُدُ","ce que j'adore"]]},{"a":"وَلَا أَنَا عَابِدٌ مَا عَبَدْتُمْ","f":"Et je ne suis pas adorateur de ce que vous avez adoré.","w":[["أَنَا","moi"],["عَابِدٌ","adorateur"],["عَبَدْتُمْ","vous avez adoré"]]},{"a":"وَلَا أَنْتُمْ عَابِدُونَ مَا أَعْبُدُ","f":"Et vous n'êtes pas adorateurs de ce que j'adore.","w":[["عَابِدُونَ","adorateurs"]]},{"a":"لَكُمْ دِينُكُمْ وَلِيَ دِينِ","f":"À vous votre religion, et à moi ma religion.","w":[["لَكُمْ","à vous"],["دِينُكُمْ","votre religion"],["وَلِيَ","et à moi"],["دِينِ","ma religion"]]}]},{"n":106,"ar":"قُرَيْشٌ","fr":"La tribu de La Mecque","rev":"Mecquoise","th":"Rappel du bienfait d'Allah sur la tribu de La Mecque : la sécurité des voyages et la nourriture.","r":["[[هَذَا الْبَيْتِ]] : [[هَذَا]] (leçon 1) devant un nom défini ([[الْبَيْتِ]]).","[[أَطْعَمَهُمْ]] et [[آمَنَهُمْ]] : verbe au passé + suffixe [[هُمْ]] (les).","[[قُرَيْشٍ]] est un nom propre qui prend pourtant le tanwin (génitif) : tous les noms propres ne sont pas sans tanwin (leçon 22).","[[فَلْيَعْبُدُوا]] : [[لِ]] + verbe = ordre à la 3e personne : « qu'ils adorent ».","[[رَبَّ]] est à l'accusatif (fatha), car il est complément du verbe [[يَعْبُدُوا]].","[[مِنْ جُوعٍ]], [[مِنْ خَوْفٍ]] : [[مِنْ]] + génitif avec tanwin."],"v":[{"a":"لِإِيلَافِ قُرَيْشٍ","f":"Pour l'accoutumance de la tribu de La Mecque,","w":[["لِإِيلَافِ","pour l'accoutumance de"],["قُرَيْشٍ","la tribu de La Mecque"]]},{"a":"إِيلَافِهِمْ رِحْلَةَ الشِّتَاءِ وَالصَّيْفِ","f":"leur accoutumance au voyage de l'hiver et de l'été,","w":[["إِيلَافِهِمْ","leur accoutumance"],["رِحْلَةَ","voyage de"],["الشِّتَاءِ","l'hiver"],["وَالصَّيْفِ","et l'été"]]},{"a":"فَلْيَعْبُدُوا رَبَّ هَذَا الْبَيْتِ","f":"qu'ils adorent donc le Seigneur de cette Maison,","w":[["فَلْيَعْبُدُوا","qu'ils adorent donc"],["رَبَّ","Seigneur de"],["هَذَا","ce"],["الْبَيْتِ","la Maison"]]},{"a":"الَّذِي const RULES={"1":{"t":"« Ceci est… » et le tanwin","c":[{"h":"Pas de verbe « être »","x":"En arabe, il n'y a pas de verbe « être » au présent. On dit simplement [[هَذَا بَيْتٌ]] : « ceci (est) une maison ».\nPour demander : [[مَا هَذَا ؟]] = Qu'est-ce que c'est ? Réponse : [[هَذَا قَلَمٌ]].","q":"Dans [[هَذَا بَيْتٌ]], quel mot correspond à « est » ?","o":["Aucun : l'arabe n'a pas de verbe « être » au présent","[[هَذَا]]","[[بَيْتٌ]]"],"w":"Le verbe « être » est sous-entendu : on met simplement les deux mots côte à côte."},{"h":"Le tanwin = indéfini","x":"Les deux petits signes en fin de mot, comme dans [[بَيْتٌ]], s'appellent le tanwin. Il marque l'indéfini : « un / une ».","q":"Que marque le tanwin ([[ـٌ]]) à la fin de [[بَيْتٌ]] ?","o":["L'indéfini (un / une)","Le défini (le / la)","Le pluriel","Le féminin"],"w":"Tanwin = indéfini. Pour le défini, on ajoutera [[ال]] (leçon 3)."},{"h":"Poser la question","x":"[[مَا هَذَا ؟]] sert pour les choses. On répond toujours par [[هَذَا]] + le nom.","q":"Que veut dire [[مَا هَذَا ؟]]","o":["Qu'est-ce que c'est ?","Où est-ce ?","Qui est-ce ?","Est-ce un stylo ?"],"w":"[[مَا]] = quoi / que. [[هَذَا]] = ceci."}]},"2":{"t":"« Cela » : ذَلِكَ","c":[{"h":"Près ou loin","x":"[[هَذَا]] désigne ce qui est près (ceci). [[ذَلِكَ]] désigne ce qui est loin (cela, là-bas). On les oppose : [[هَذَا بَيْتٌ وَذَلِكَ مَسْجِدٌ]].","q":"Quel mot désigne ce qui est loin (masculin) ?","o":["[[ذَلِكَ]]","[[هَذَا]]","[[هَذِهِ]]","[[مَا]]"],"w":"[[ذَلِكَ]] = cela (loin). [[هَذَا]] = ceci (près)."},{"h":"Lire une phrase","x":"[[مَا ذَلِكَ ؟ ذَلِكَ نَجْمٌ]] = Qu'est-ce que c'est (là-bas) ? C'est une étoile.","q":"Que veut dire [[ذَلِكَ نَجْمٌ]] ?","o":["Cela (là-bas) est une étoile","Ceci est une étoile","Une étoile est ici","Qu'est-ce que c'est ?"],"w":"Même construction qu'à la leçon 1, avec [[ذَلِكَ]]."}]},"3":{"t":"L'article ال, phrase nominale, lettres lunaires et solaires","c":[{"h":"Rendre un mot défini","x":"Pour passer de l'indéfini au défini : on enlève le tanwin (on garde la damma simple) et on ajoute [[الْ]] devant.\n[[بَيْتٌ]] ← [[الْبَيْتُ]]","q":"Comment rendre [[كِتَابٌ]] défini ?","o":["[[الْكِتَابُ]]","[[الْكِتَابٌ]]","[[كِتَابُ]]","[[الْكِتَابِ]]"],"w":"Défini = [[الْ]] + fin simple (damma), sans tanwin."},{"h":"La phrase nominale","x":"Sujet défini + attribut indéfini, sans verbe : [[الْقَلَمُ مَكْسُورٌ]] = le stylo est cassé.","q":"Laquelle veut dire « Le livre est nouveau » ?","o":["[[الْكِتَابُ جَدِيدٌ]]","[[الْكِتَابُ الْجَدِيدُ]]","[[جَدِيدٌ الْكِتَابُ]]"],"w":"[[الْكِتَابُ الْجَدِيدُ]] = « le nouveau livre » (ce n'est pas une phrase). La phrase = défini + indéfini."},{"h":"Lettres lunaires et solaires","x":"Lettres lunaires : le [[ل]] de [[ال]] se prononce, comme dans [[الْقَمَرُ]].\nLettres solaires : le [[ل]] ne se prononce pas et la lettre suivante porte une shadda, comme dans [[الشَّمْسُ]].","q":"Que se passe-t-il pour le [[ل]] dans [[الشَّمْسُ]] ?","o":["Il ne se prononce pas : le [[ش]] est doublé","Il se prononce normalement","Il devient une voyelle longue"],"w":"Devant une lettre solaire comme [[ش]], le [[ل]] s'assimile : la lettre est doublée (shadda)."}]},"4":{"t":"Prépositions : في، على، من، إلى","c":[{"h":"Les quatre prépositions","x":"[[فِي]] = dans, [[عَلَى]] = sur, [[مِنْ]] = de (origine), [[إِلَى]] = vers.\n[[أَيْنَ]] = où ? [[مِنْ أَيْنَ]] = d'où ? [[هُوَ]] = il, [[هِيَ]] = elle.","q":"Que veut dire [[مِنْ أَيْنَ ؟]]","o":["D'où ?","Où ?","Vers où ?","Qui ?"],"w":"[[مِنْ]] (de) + [[أَيْنَ]] (où) = d'où."},{"h":"Le génitif après une préposition","x":"Le nom qui suit une préposition est au génitif : il se termine par une kasra. [[فِي الْبَيْتِ]] = dans la maison.","q":"Quelle terminaison prend le nom après [[فِي]] ?","o":["Une kasra : [[الْبَيْتِ]]","Une damma : [[الْبَيْتُ]]","Une fatha : [[الْبَيْتَ]]"],"w":"Après une préposition : génitif = kasra."}]},"5":{"t":"L'annexion, le vocatif, ابن","c":[{"h":"L'annexion (إِضَافَة)","x":"Pour dire « le livre de Muhammad » : [[كِتَابُ مُحَمَّدٍ]]. Le premier terme perd [[ال]] et le tanwin. Le second est défini et au génitif.","q":"Comment dire « le livre du professeur » ?","o":["[[كِتَابُ الْمُدَرِّسِ]]","[[الْكِتَابُ الْمُدَرِّسِ]]","[[كِتَابٌ الْمُدَرِّسِ]]","[[كِتَابُ الْمُدَرِّسُ]]"],"w":"1er terme : sans [[ال]], sans tanwin. 2e terme : défini, génitif (kasra)."},{"h":"Le vocatif","x":"Pour appeler quelqu'un : [[يَا]] + nom. [[يَا مُحَمَّدُ]] = Ô Muhammad !","q":"Que veut dire [[يَا مُحَمَّدُ]] ?","o":["Ô Muhammad ! (on l'appelle)","Voici Muhammad","Le livre de Muhammad","Muhammad est ici"],"w":"[[يَا]] sert à interpeller."},{"h":"ابْن et la hamza","x":"[[اِبْنٌ]] (fils) perd sa hamza quand un mot le précède : on enchaîne (la [[هَمْزَةُ الْوَصْلِ]]).","q":"Que fait la hamza de [[اِبْنٌ]] quand un mot le précède ?","o":["Elle ne se prononce plus : on enchaîne","Elle devient un tanwin","Elle se double"],"w":"C'est la [[هَمْزَةُ الْوَصْلِ]] : une hamza d'appui qui disparaît à l'enchaînement."}]},"6":{"t":"Le féminin : هَذِهِ et لِ","c":[{"h":"Ceci au féminin","x":"Avec un nom féminin : [[هَذِهِ سَيَّارَةٌ]] = ceci est une voiture. Beaucoup de noms féminins finissent par [[ـة]].","q":"Quel démonstratif avec [[سَيَّارَةٌ]] ?","o":["[[هَذِهِ]]","[[هَذَا]]","[[ذَلِكَ]]"],"w":"[[هَذِهِ]] = ceci (féminin)."},{"h":"Reconnaître le féminin","x":"Les noms en [[ـة]] sont (le plus souvent) féminins.","q":"Lequel de ces mots est féminin ?","o":["[[مَدْرَسَةٌ]]","[[كِتَابٌ]]","[[قَلَمٌ]]","[[بَيْتٌ]]"],"w":"[[مَدْرَسَةٌ]] finit par [[ة]]."},{"h":"لِ : l'appartenance","x":"[[لِ]] + nom = à. [[لِمَنْ هَذِهِ ؟]] = À qui est celle-ci ? [[هَذِهِ لِخَالِدٍ]] = elle est à Khalid.","q":"Que veut dire [[لِمَنْ هَذِهِ ؟]]","o":["À qui est celle-ci ?","Qui est celle-ci ?","Où est celle-ci ?","Quelle est celle-ci ?"],"w":"[[لِ]] (à) + [[مَنْ]] (qui)."}]},"7":{"t":"تِلْكَ et le tableau des démonstratifs","c":[{"h":"Le tableau","x":"Proche : masculin [[هَذَا]], féminin [[هَذِهِ]].\nÉloigné : masculin [[ذَلِكَ]], féminin [[تِلْكَ]].","q":"Quel mot veut dire « cela » (féminin, éloigné) ?","o":["[[تِلْكَ]]","[[ذَلِكَ]]","[[هَذِهِ]]","[[هَذَا]]"],"w":"Éloigné + féminin = [[تِلْكَ]]."},{"h":"Lire une phrase","x":"[[مَنْ تِلْكَ ؟ تِلْكَ فَاطِمَةُ]] = Qui est celle-là ? C'est Fatima.","q":"Que veut dire [[تِلْكَ فَاطِمَةُ]] ?","o":["Celle-là, c'est Fatima","Celle-ci, c'est Fatima","Fatima est ici","À qui est Fatima ?"],"w":"[[تِلْكَ]] = celle-là."}]},"8":{"t":"لِ + nom, خلف / أمام, pays et villes","c":[{"h":"لِ devant un nom défini","x":"[[هَذَا الْبَيْتُ لِلتَّاجِرِ]] = cette maison est au commerçant. Devant [[ال]], [[لِ]] + [[ال]] devient [[لِلـ]].","q":"Comment dire « à l'enseignant » ?","o":["[[لِلْمُدَرِّسِ]]","[[لِالْمُدَرِّسِ]]","[[لْمُدَرِّسِ]]"],"w":"L'alif de [[الْ]] disparaît : [[لِ]] + [[الْمُدَرِّسِ]] s'écrit [[لِلْمُدَرِّسِ]]."},{"h":"Devant et derrière","x":"[[أَمَامَ]] = devant, [[خَلْفَ]] = derrière. Ils sont suivis du génitif : [[أَمَامَ الْبَيْتِ]].","q":"Que veut dire [[أَمَامَ الْبَيْتِ]] ?","o":["Devant la maison","Derrière la maison","Dans la maison","Vers la maison"],"w":"[[أَمَامَ]] = devant, [[خَلْفَ]] = derrière."}]},"9":{"t":"Pronoms, l'adjectif (نَعْت), الَّذِي","c":[{"h":"Les pronoms","x":"[[أَنَا]] = je, [[أَنْتَ]] = tu (masc.), [[هُوَ]] = il, [[هِيَ]] = elle.","q":"Quel pronom veut dire « elle » ?","o":["[[هِيَ]]","[[هُوَ]]","[[أَنْتَ]]","[[أَنَا]]"],"w":"[[هِيَ]] = elle ; [[هُوَ]] = il."},{"h":"L'adjectif suit le nom","x":"L'adjectif suit le nom et s'accorde en genre et en défini : [[الْمُدِيرُ الْجَدِيدُ]] (le nouveau directeur), [[سَيَّارَةٌ جَمِيلَةٌ]] (une belle voiture).","q":"Comment dire « une belle voiture » ?","o":["[[سَيَّارَةٌ جَمِيلَةٌ]]","[[سَيَّارَةٌ جَمِيلٌ]]","[[السَّيَّارَةُ جَمِيلَةٌ]]"],"w":"Nom féminin → adjectif féminin ; les deux indéfinis. [[السَّيَّارَةُ جَمِيلَةٌ]] = « la voiture est belle »."},{"h":"Défini des deux côtés","x":"Si le nom est défini, l'adjectif l'est aussi.","q":"Comment dire « le nouveau directeur » ?","o":["[[الْمُدِيرُ الْجَدِيدُ]]","[[الْمُدِيرُ جَدِيدٌ]]","[[مُدِيرٌ الْجَدِيدُ]]"],"w":"[[الْمُدِيرُ جَدِيدٌ]] = « le directeur est nouveau » (phrase). Pour « le nouveau directeur » : défini + défini."}]},"10":{"t":"Pronoms suffixes et عند","c":[{"h":"Les suffixes","x":"Attachés au nom : [[ـِي]] = mon, [[ـكَ]] = ton (masc.), [[ـهُ]] = son (à lui), [[ـهَا]] = son (à elle). [[كِتَابُهَا]] = son livre (à elle).","q":"Que veut dire [[كِتَابُهَا]] ?","o":["Son livre (à elle)","Son livre (à lui)","Ton livre","Mon livre"],"w":"[[ـهَا]] = son/sa (à elle)."},{"h":"Avoir avec عند","x":"[[عِنْدَ]] + suffixe = « avoir » : [[عِنْدِي قَلَمٌ]] = j'ai un stylo. Négation : [[مَا عِنْدِي سَيَّارَةٌ]]. Avec la famille on dit [[لِي أَخٌ]].","q":"Comment dire « Je n'ai pas de voiture » ?","o":["[[مَا عِنْدِي سَيَّارَةٌ]]","[[عِنْدِي مَا سَيَّارَةٌ]]","[[مَا سَيَّارَةٌ عِنْدَ]]"],"w":"[[مَا]] + [[عِنْدِي]] + nom."},{"h":"La famille : لِي","x":"Pour un membre de la famille : [[لِي أَخٌ]] (j'ai un frère), et non [[عِنْدِي أَخٌ]].","q":"Comment dire « J'ai un frère » ?","o":["[[لِي أَخٌ]]","[[عِنْدِي أَخٌ]]"],"w":"Avec la famille, on utilise [[لِي]]."}]},"11":{"t":"Texte « بَيْتِي »","c":[{"h":"Mots du texte","x":"[[فِيهِ]] = dedans (masc.), [[فِيهَا]] = dedans (fém.), [[أُحِبُّ]] = j'aime, [[مَا فِيهِ أَحَدٌ]] = il n'y a personne dedans.","q":"Que veut dire [[أُحِبُّ]] ?","o":["J'aime","Je pars","Je sais","J'ai"],"w":"[[أُحِبُّ]] = j'aime."},{"h":"Dedans","x":"[[فِيهِ]] renvoie à un nom masculin, [[فِيهَا]] à un nom féminin.","q":"Que veut dire [[فِيهَا]] ?","o":["Dedans (en parlant d'un nom féminin)","Dedans (en parlant d'un nom masculin)","Avec elle","Vers elle"],"w":"[[فِي]] + [[هَا]] = en elle, dedans."}]},"12":{"t":"Salutations, كَيْفَ حَالُكَ، le verbe au féminin","c":[{"h":"Saluer et répondre","x":"[[السَّلَامُ عَلَيْكَ]] — réponse : [[وَعَلَيْكَ السَّلَامُ]].\n[[كَيْفَ حَالُكَ ؟]] = comment vas-tu ? Réponse : [[بِخَيْرٍ]] = bien.","q":"Que répond-on à [[السَّلَامُ عَلَيْكَ]] ?","o":["[[وَعَلَيْكَ السَّلَامُ]]","[[بِخَيْرٍ]]","[[كَيْفَ حَالُكَ]]"],"w":"On renvoie la salutation en inversant l'ordre."},{"h":"Le verbe au féminin","x":"Au passé, le féminin prend [[ـتْ]] : [[ذَهَبَ مُحَمَّدٌ]] / [[ذَهَبَتْ آمِنَةُ]]. [[الَّذِي]] (masc.) / [[الَّتِي]] (fém.) = qui.","q":"Comment dire « elle est allée » ?","o":["[[ذَهَبَتْ]]","[[ذَهَبَ]]","[[ذَهَبُوا]]"],"w":"Féminin au passé : [[ـتْ]] ajouté."}]},"13":{"t":"Le pluriel et les verbes au pluriel","c":[{"h":"Pluriels sains","x":"Masculin : [[ـُونَ]] ([[مُسْلِمٌ]] ← [[مُسْلِمُونَ]]). Féminin : [[ـَاتٌ]] ([[طَالِبَةٌ]] ← [[طَالِبَاتٌ]]).","q":"Quel est le pluriel de [[طَالِبَةٌ]] ?","o":["[[طَالِبَاتٌ]]","[[طَالِبُونَ]]","[[طُلَّابٌ]]"],"w":"Féminin sain : on remplace [[ـة]] par [[ـَاتٌ]]."},{"h":"Pluriel irrégulier","x":"Beaucoup de mots ont un pluriel irrégulier (جَمْعُ تَكْسِيرٍ), à apprendre avec chaque mot : [[طَالِبٌ]] ← [[طُلَّابٌ]].","q":"Comment apprendre un pluriel irrégulier ?","o":["Avec chaque mot, par cœur","Avec une règle fixe","On ajoute [[ـُونَ]]"],"w":"Pas de règle simple : on mémorise le pluriel avec le mot."},{"h":"Ils et elles","x":"[[هُمْ]] = ils, [[هُنَّ]] = elles. Verbes : [[ذَهَبُوا]] (ils sont allés), [[ذَهَبْنَ]] (elles sont allées).","q":"Comment dire « ils sont allés » ?","o":["[[ذَهَبُوا]]","[[ذَهَبْنَ]]","[[ذَهَبَتْ]]"],"w":"[[ـُوا]] = ils ; [[ـْنَ]] = elles."}]},"14":{"t":"نَحْنُ / أَنْتُمْ et suffixes","c":[{"h":"Nous et vous","x":"[[نَحْنُ]] = nous, [[أَنْتُمْ]] = vous (masc. pl.). Suffixes : [[ـنَا]] = notre, [[ـكُمْ]] = votre.","q":"Comment dire « votre maison » (à plusieurs) ?","o":["[[بَيْتُكُمْ]]","[[بَيْتُنَا]]","[[بَيْتُهُمْ]]"],"w":"[[ـكُمْ]] = votre."},{"h":"Verbes au passé","x":"[[ذَهَبْتُمْ]] = vous êtes allés. [[ذَهَبْنَا]] = nous sommes allés. [[أَيُّ]] = quel(le) ? + nom indéfini au génitif.","q":"Que veut dire [[ذَهَبْنَا]] ?","o":["Nous sommes allés","Vous êtes allés","Ils sont allés"],"w":"[[ـْنَا]] = nous."}]},"15":{"t":"أَنْتُنَّ, مَتَى, قَبْلَ / بَعْدَ","c":[{"h":"Vous (féminin pluriel)","x":"[[أَنْتُنَّ]] = vous (fém. pl.). Suffixes : [[ـكُنَّ]] = votre (fém. pl.), [[ـهُنَّ]] = leur (fém.).","q":"Que veut dire [[أَنْتُنَّ]] ?","o":["Vous (féminin pluriel)","Vous (masculin pluriel)","Elles","Nous"],"w":"[[أَنْتُنَّ]] = vous (f. pl.)."},{"h":"Le passé à toutes les personnes","x":"[[ذَهَبْتَ]] = tu es allé (m.), [[ذَهَبْتِ]] = tu es allée (f.), [[ذَهَبْتُ]] = je suis allé(e).","q":"Que veut dire [[ذَهَبْتِ]] ?","o":["Tu es allée","Tu es allé","Je suis allé","Elle est allée"],"w":"Kasra sur [[ت]] = tu (féminin)."},{"h":"Quand, avant, après","x":"[[مَتَى]] = quand ? [[قَبْلَ]] = avant, [[بَعْدَ]] = après (suivis du génitif).","q":"Quel mot veut dire « avant » ?","o":["[[قَبْلَ]]","[[بَعْدَ]]","[[مَتَى]]","[[أَمَامَ]]"],"w":"[[قَبْلَ]] = avant ; [[بَعْدَ]] = après."}]},"16":{"t":"Pluriel des choses (غَيْرُ الْعَاقِلِ)","c":[{"h":"Le pluriel des choses est féminin singulier","x":"[[هَذِهِ كُتُبٌ جَدِيدَةٌ]] : pour des choses au pluriel, l'adjectif est au féminin singulier, et on les reprend par [[هِيَ]].","q":"Quel adjectif pour [[كُتُبٌ]] (livres) ?","o":["[[جَدِيدَةٌ]]","[[جَدِيدٌ]]","[[جَدِيدُونَ]]","[[جَدِيدَانِ]]"],"w":"Pluriel de choses = féminin singulier."},{"h":"Reprendre par un pronom","x":"Les livres → [[هِيَ]]. Les personnes au pluriel → [[هُمْ]] et [[هَؤُلَاءِ]].","q":"Quel pronom reprend « les livres » ?","o":["[[هِيَ]]","[[هُمْ]]","[[هُوَ]]","[[هُنَّ]]"],"w":"[[هِيَ]] pour les choses au pluriel."}]},"17":{"t":"Suite du pluriel des choses","c":[{"h":"Accord du verbe, de l'adjectif et du pronom","x":"[[أَبْوَابُ الْمَسْجِدِ مَفْتُوحَةٌ]] = les portes de la mosquée sont ouvertes. Verbe, adjectif et pronom sont au féminin singulier.","q":"Comment dire « Les voitures sont grandes » ?","o":["[[السَّيَّارَاتُ كَبِيرَةٌ]]","[[السَّيَّارَاتُ كَبِيرُونَ]]","[[السَّيَّارَاتُ كَبِيرٌ]]","[[السَّيَّارَاتُ كَبِيرَانِ]]"],"w":"Pluriel de choses : adjectif au féminin singulier."}]},"18":{"t":"Le duel (الْمُثَنَّى) et كَمْ","c":[{"h":"Former le duel","x":"Duel : [[ـَانِ]]. [[كِتَابٌ]] ← [[كِتَابَانِ]]. Au féminin, [[ة]] devient [[ت]] : [[سَيَّارَةٌ]] ← [[سَيَّارَتَانِ]].","q":"Quel est le duel de [[سَيَّارَةٌ]] ?","o":["[[سَيَّارَتَانِ]]","[[سَيَّارَاتَانِ]]","[[سَيَّارَةَانِ]]"],"w":"Au duel féminin, [[ة]] → [[ت]] + [[ـَانِ]]."},{"h":"Démonstratifs du duel","x":"[[هَذَانِ]] (masc.), [[هَاتَانِ]] (fém.) = ces deux. [[هُمَا]] = eux deux.","q":"Quel démonstratif pour « ces deux (féminin) » ?","o":["[[هَاتَانِ]]","[[هَذَانِ]]","[[هَؤُلَاءِ]]"],"w":"[[هَاتَانِ]] = féminin duel."},{"h":"كَمْ : combien","x":"[[كَمْ]] est suivi d'un nom au singulier accusatif : [[كَمْ أَخًا لَكَ ؟]] Réponse : [[لِي أَخَوَانِ]].","q":"Après [[كَمْ]], quel nom ?","o":["[[طَالِبًا]]","[[طَالِبٌ]]","[[طُلَّابٍ]]","[[طَالِبُونَ]]"],"w":"[[كَمْ]] + singulier à l'accusatif (tanwin fatha)."}]},"19":{"t":"Les nombres de 3 à 10 avec un nom masculin","c":[{"h":"Le chiffre est inversé","x":"3 à 10 : le chiffre est suivi d'un pluriel au génitif, et son genre est inversé. Nom masculin → chiffre avec [[ة]] : [[ثَلَاثَةُ طُلَّابٍ]] (trois étudiants).","q":"Comment dire « trois étudiants » ?","o":["[[ثَلَاثَةُ طُلَّابٍ]]","[[ثَلَاثُ طُلَّابٍ]]","[[ثَلَاثَةُ طَالِبٍ]]"],"w":"Masculin → chiffre en [[ـة]] + pluriel au génitif."},{"h":"1 et 2 comme des adjectifs","x":"1 et 2 s'accordent comme des adjectifs et se placent après le nom : [[كِتَابٌ وَاحِدٌ]], [[كِتَابَانِ]].","q":"Comment dire « un livre » ?","o":["[[كِتَابٌ وَاحِدٌ]]","[[وَاحِدٌ كُتُبٍ]]","[[وَاحِدَةُ كِتَابٍ]]"],"w":"1 se place après le nom, comme un adjectif."}]},"20":{"t":"Les nombres de 3 à 10 avec un nom féminin","c":[{"h":"Féminin : le chiffre perd la ة","x":"Nom féminin → chiffre sans [[ة]] : [[ثَلَاثُ طَالِبَاتٍ]], [[أَرْبَعُ]], [[خَمْسُ]], [[سِتُّ]], [[سَبْعُ]], [[ثَمَانِي]], [[تِسْعُ]], [[عَشْرُ]].","q":"Comment dire « trois étudiantes » ?","o":["[[ثَلَاثُ طَالِبَاتٍ]]","[[ثَلَاثَةُ طَالِبَاتٍ]]","[[ثَلَاثُ طَالِبَةٍ]]"],"w":"Féminin → le chiffre perd [[ـة]] (genre inversé)."},{"h":"Les chiffres arabes","x":"٠ ١ ٢ ٣ ٤ ٥ ٦ ٧ ٨ ٩ s'écrivent de gauche à droite, même dans un texte arabe.","q":"Que vaut [[٤]] ?","o":["4","5","6","3"],"w":"[[٠]]=0 [[١]]=1 [[٢]]=2 [[٣]]=3 [[٤]]=4 [[٥]]=5 [[٦]]=6 [[٧]]=7 [[٨]]=8 [[٩]]=9."}]},"21":{"t":"Texte « مَدْرَسَتِي »","c":[{"h":"Mots-outils du texte","x":"[[وَلَكِنْ]] = mais. Suffixes : [[ـنَا]] = notre, [[ـهُمْ]] = leur. Lis le texte à voix haute, puis traduis phrase par phrase.","q":"Que veut dire [[وَلَكِنْ]] ?","o":["Mais","Et","Où","Quand"],"w":"[[وَلَكِنْ]] = mais."},{"h":"Suffixes","x":"Le suffixe [[ـنَا]] sur un nom veut dire « notre ».","q":"Que veut dire [[مَدْرَسَتُنَا]] ?","o":["Notre école","Mon école","Leur école","Votre école"],"w":"[[ـنَا]] = notre."}]},"22":{"t":"Les couleurs, قَالَ / قَالَتْ, mots sans tanwin","c":[{"h":"Les couleurs","x":"[[أَبْيَضُ]] blanc, [[أَسْوَدُ]] noir, [[أَحْمَرُ]] rouge, [[أَخْضَرُ]] vert, [[أَزْرَقُ]] bleu, [[أَصْفَرُ]] jaune.","q":"Quel mot veut dire « noir » ?","o":["[[أَسْوَدُ]]","[[أَبْيَضُ]]","[[أَحْمَرُ]]","[[أَخْضَرُ]]"],"w":"[[أَسْوَدُ]] = noir."},{"h":"Pas de tanwin","x":"Ces adjectifs, beaucoup de noms propres et certains pluriels irréguliers ([[مَسَاجِدُ]], [[مَدَارِسُ]], [[مَفَاتِيحُ]]) n'ont pas de tanwin : on écrit [[أَحْمَرُ]], pas [[أَحْمَرٌ]].","q":"Lequel est un mot sans tanwin ?","o":["[[مَدَارِسُ]]","[[كِتَابٌ]]","[[قَلَمٌ]]","[[بَيْتٌ]]"],"w":"[[مَدَارِسُ]] est un pluriel irrégulier de ce type ([[مَمْنُوعٌ مِنَ الصَّرْفِ]])."},{"h":"Il a dit, elle a dit","x":"[[قَالَ]] = il a dit ; [[قَالَتْ]] = elle a dit.","q":"Que veut dire [[قَالَتْ]] ?","o":["Elle a dit","Il a dit","Ils ont dit","Tu as dit"],"w":"[[ـتْ]] = féminin."}]},"23":{"t":"Dialogue en classe ; noms propres sans tanwin avec les prépositions","c":[{"h":"Génitif des mots sans tanwin","x":"Un mot sans tanwin prend la fatha au génitif, pas la kasra : [[مِنْ أَحْمَدَ]], [[إِلَى مَكَّةَ]], [[كِتَابُ زَيْنَبَ]].","q":"Complète : [[هَذَا كِتَابُ]] ___ (Zaynab)","o":["[[زَيْنَبَ]]","[[زَيْنَبٍ]]","[[زَيْنَبِ]]"],"w":"Sans tanwin : fatha au génitif."},{"h":"Un nom ordinaire","x":"Un nom ordinaire prend la kasra avec tanwin : [[مِنْ مُحَمَّدٍ]], [[كِتَابُ عَلِيٍّ]].","q":"Complète : [[مِنْ]] ___ (Muhammad)","o":["[[مُحَمَّدٍ]]","[[مُحَمَّدَ]]","[[مُحَمَّدِ]]"],"w":"Mot ordinaire : kasra + tanwin."},{"h":"La Mecque","x":"[[مَكَّةُ]] est un nom propre sans tanwin : [[إِلَى مَكَّةَ]].","q":"Complète : [[ذَهَبْتُ إِلَى]] ___","o":["[[مَكَّةَ]]","[[مَكَّةٍ]]","[[مَكَّةِ]]"],"w":"Nom propre sans tanwin après une préposition : fatha."}]}};

  const pick=weak.length?weak:ls.slice(0,3);
  const qty=[14,10,6];let ids=[];
  pick.forEach((l,i)=>{ids=ids.concat(shuffle(lessonIds(l).slice()).slice(0,qty[i]))});

  return {ids:shuffle(ids),write:avg>=75,pick:pick,avg:avg};
}
